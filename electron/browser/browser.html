<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src 'self' data:;" />
<title>Lumina 浏览器</title>
<style>
  :root {
    --bg: #12141a;
    --bar: #1a1d25;
    --bar-hover: #232732;
    --border: rgba(255, 255, 255, 0.08);
    --text: #e8eaf0;
    --text-2: #a0a6b5;
    --text-3: #6b7280;
    --accent: #6366f1;
    --danger: #ef4444;
    --tb-h: 40px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; background: var(--bg); }
  body {
    font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    color: var(--text);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ── 工具栏 ── */
  .toolbar {
    height: var(--tb-h);
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 0 8px;
    background: var(--bar);
    border-bottom: 1px solid var(--border);
    -webkit-app-region: drag;
  }
  .toolbar button, .toolbar input, .menu { -webkit-app-region: no-drag; }

  .tb-btn {
    width: 28px; height: 28px;
    border: none; border-radius: 6px;
    background: transparent; color: var(--text-2);
    cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center;
    transition: background .12s ease, color .12s ease;
  }
  .tb-btn:hover:not(:disabled) { background: var(--bar-hover); color: var(--text); }
  .tb-btn:disabled { opacity: .35; cursor: default; }
  .tb-btn svg { width: 16px; height: 16px; }

  .urlbar {
    flex: 1;
    height: 28px;
    min-width: 0;
    margin: 0 6px;
    padding: 0 10px;
    border-radius: 999px;
    border: 1px solid transparent;
    background: rgba(255, 255, 255, 0.06);
    color: var(--text);
    font-size: 12.5px;
    outline: none;
    transition: background .15s ease, border-color .15s ease;
  }
  .urlbar::placeholder { color: var(--text-3); }
  .urlbar:focus {
    background: rgba(255, 255, 255, 0.11);
    border-color: var(--accent);
  }

  .zoom-wrap {
    display: flex; align-items: center; gap: 2px;
    font-size: 11px; color: var(--text-2);
    font-variant-numeric: tabular-nums;
  }
  .zoom-wrap .tb-btn { width: 24px; height: 24px; }
  .zoom-val { min-width: 38px; text-align: center; }

  .spacer { width: 6px; }

  /* ── 下拉菜单（图5 那一坨） ── */
  .menu-wrap { position: relative; }
  .menu {
    position: absolute;
    top: 34px; right: 0;
    width: 250px;
    max-height: 72vh;
    overflow-y: auto;
    padding: 6px;
    border-radius: 10px;
    background: #22252e;
    border: 1px solid var(--border);
    box-shadow: 0 12px 40px rgba(0,0,0,.5);
    display: none;
    z-index: 20;
  }
  .menu.open { display: block; }
  .menu-item {
    display: flex; align-items: center; justify-content: space-between;
    gap: 10px;
    padding: 6px 8px;
    border-radius: 6px;
    font-size: 12px;
    color: var(--text);
    cursor: pointer;
  }
  .menu-item:hover { background: var(--bar-hover); }
  .menu-sep { height: 1px; background: var(--border); margin: 5px 4px; }
  .menu-label { font-size: 11px; color: var(--text-3); padding: 4px 8px 2px; }
  .menu-item .check { color: var(--accent); visibility: hidden; }
  .menu-item .sub {
    color: var(--text-3);
    font-size: 11px;
    font-variant-numeric: tabular-nums;
  }

  /* ── 页面容器 ── */
  .viewport {
    flex: 1;
    position: relative;
    min-height: 0;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    overflow: hidden;
    background:
      repeating-conic-gradient(rgba(255,255,255,.02) 0% 25%, transparent 0% 50%) 50% / 18px 18px;
  }
  /* 仅设备预览（固定尺寸设备框可能超出视口）才允许滚动；
     responsive 模式下网页自身在 webview 内滚动，宿主页不出现滚动条，避免底部"抽搐"。 */
  .viewport.device { overflow: auto; }
  webview {
    width: 100%;
    height: 100%;
    min-width: 0;
    border: none;
    background: #fff;
    flex-shrink: 0;
  }
  /* 设备预览时给一个"设备"外框 */
  .viewport.device webview {
    border-radius: 12px;
    box-shadow: 0 0 0 1px rgba(255,255,.12), 0 18px 60px rgba(0,0,0,.55);
    margin: 12px 0;
  }

  /* ── 空状态引导层（about:blank 时挡住白屏） ── */
  .welcome {
    position: absolute;
    inset: 0;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    text-align: center;
    padding: 24px;
    pointer-events: none;
  }
  .welcome.show { display: flex; }
  .welcome-logo {
    width: 46px; height: 46px;
    border-radius: 14px;
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, #6366f1, #8b5cf6);
    font-size: 22px;
    box-shadow: 0 10px 30px rgba(99, 102, 241, .35);
  }
  .welcome-title { font-size: 15px; font-weight: 600; }
  .welcome-sub { font-size: 12px; color: var(--text-3); max-width: 380px; line-height: 1.7; }
  .welcome-kbd {
    margin-top: 4px;
    font-size: 11px;
    color: var(--text-3);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 4px 8px;
  }
  .welcome-kbd b { color: var(--text-2); font-weight: 600; }

  .loading-bar {
    position: absolute; top: 0; left: 0; height: 2px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
    width: 40%;
    animation: load 1.1s ease-in-out infinite;
    opacity: 0;
    pointer-events: none;
    z-index: 5;
  }
  .loading-bar.on { opacity: 1; }
  @keyframes load {
    0%   { transform: translateX(-100%); }
    100% { transform: translateX(350%); }
  }
</style>
</head>
<body>
  <div class="toolbar">
    <button class="tb-btn" id="btnBack" title="后退" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
    </button>
    <button class="tb-btn" id="btnForward" title="前进" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5l7 7-7 7"/></svg>
    </button>
    <button class="tb-btn" id="btnReload" title="刷新">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/></svg>
    </button>

    <input class="urlbar" id="url" placeholder="输入网址或搜索内容，回车打开" spellcheck="false" />

    <button class="tb-btn" id="btnExternal" title="在外部浏览器打开">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><path d="M15 3h6v6"/><path d="M10 14L21 3"/></svg>
    </button>

    <div class="zoom-wrap">
      <button class="tb-btn" id="btnZoomOut" title="缩小">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14"/></svg>
      </button>
      <span class="zoom-val" id="zoomVal">100%</span>
      <button class="tb-btn" id="btnZoomIn" title="放大">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
      </button>
    </div>

    <div class="spacer"></div>

    <div class="menu-wrap">
      <button class="tb-btn" id="btnMenu" title="更多">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg>
      </button>
      <div class="menu" id="menu">
        <div class="menu-item" id="mHardReload">强制重新加载</div>
        <div class="menu-item" id="mExternal">在外部浏览器打开</div>
        <div class="menu-sep"></div>

        <div class="menu-label">缩放</div>
        <div class="menu-item" data-zoom="out">缩小 <span class="sub">−</span></div>
        <div class="menu-item" id="mZoomReset">重置为 100% <span class="sub"></span></div>
        <div class="menu-item" data-zoom="in">放大 <span class="sub">＋</span></div>

        <div class="menu-sep"></div>
        <div class="menu-label">设备预览</div>
        <div class="menu-item" data-device="responsive">Responsive <span class="check" id="ck-responsive">✓</span></div>
        <div class="menu-item" data-device="desktop">桌面 <span class="sub" id="sz-desktop"></span></div>
        <div class="menu-item" data-device="iphone-xr">iPhone XR <span class="sub" id="sz-iphone-xr"></span></div>
        <div class="menu-item" data-device="mobile">Mobile <span class="sub" id="sz-mobile"></span></div>
        <div class="menu-item" data-device="tablet">Tablet <span class="sub" id="sz-tablet"></span></div>

        <div class="menu-sep"></div>
        <div class="menu-item" id="mClearData">清除 Cookie 与缓存</div>
        <div class="menu-item" id="mClose">关闭窗口</div>
      </div>
    </div>
  </div>

  <div class="viewport" id="viewport">
    <div class="loading-bar" id="loadingBar"></div>
    <webview id="view" src="about:blank" allowpopups="false"></webview>

    <div class="welcome" id="welcome">
      <div class="welcome-logo">🌐</div>
      <div class="welcome-title">Lumina 浏览器</div>
      <div class="welcome-sub">
        在上方地址栏输入网址即可开始。你也可以直接跟 Agent 说「打开 example.com」，
        它会在这个窗口里操作——你看到的就是它正在看的页面。
      </div>
      <div class="welcome-kbd"><b>Ctrl+L</b> 定位地址栏　<b>Ctrl+R</b> 刷新　<b>F5</b> 刷新</div>
    </div>
  </div>

<script>
  // ══════════════════════════════════════════════════════════
  // 宿主页只做三件事：画工具栏、把操作转给 <webview>、把 webview 状态
  // 回报给主进程。**本页面自身永远不导航** —— 一旦导航，工具栏就没了。
  // ══════════════════════════════════════════════════════════
  var api = window.browserAPI;
  var view = document.getElementById('view');
  var urlInput = document.getElementById('url');
  var menu = document.getElementById('menu');
  var viewport = document.getElementById('viewport');
  var loadingBar = document.getElementById('loadingBar');
  var welcome = document.getElementById('welcome');
  var editing = false;

  var DEVICES = {
    'responsive': { label: 'Responsive', w: null, h: null },
    'desktop':    { label: '桌面',       w: 1440, h: 900 },
    'iphone-xr':  { label: 'iPhone XR',  w: 414,  h: 896 },
    'mobile':     { label: 'Mobile',     w: 375,  h: 812 },
    'tablet':     { label: 'Tablet',     w: 768,  h: 1024 }
  };
  var DEVICE_IDS = ['responsive', 'desktop', 'iphone-xr', 'mobile', 'tablet'];
  var TITLE_SUFFIX = ' — Lumina 浏览器';

  function $(id) { return document.getElementById(id); }
  function isBlank(u) { return !u || u === 'about:blank' || u.indexOf('about:blank') === 0; }

  // ── webview 的唯一状态出口 ──
  function readState() {
    return {
      url: view.getURL ? view.getURL() : '',
      title: view.getTitle ? view.getTitle() : '',
      canBack: !!(view.canGoBack && view.canGoBack()),
      canForward: !!(view.canGoForward && view.canGoForward()),
      loading: !!(view.isLoading && view.isLoading()),
      zoom: view.getZoomFactor ? view.getZoomFactor() : 1
    };
  }

  // ── 标题必须幂等：早前每次 page-title-updated 都再拼一次后缀，
  //    结果变成 "A — Lumina 浏览器 — Lumina 浏览器 — ..."。先剥旧后缀再拼。 ──
  function setWindowTitle(t) {
    var base = String(t || '')
      .replace(/(?:\s+—\s+Lumina 浏览器)+\s*$/g, '')
      .trim();
    if (isBlank(readState().url)) base = '';
    document.title = base ? base + TITLE_SUFFIX : 'Lumina 浏览器';
  }

  function applyState(s) {
    if (!s) return;
    if (!editing) {
      // 空白页不往地址栏塞 about:blank，否则看起来像"卡在某个地址上"
      urlInput.value = isBlank(s.url) ? '' : s.url;
    }
    $('btnBack').disabled = !s.canBack;
    $('btnForward').disabled = !s.canForward;
    loadingBar.classList.toggle('on', !!s.loading);
    welcome.classList.toggle('show', isBlank(s.url));
    if (typeof s.zoom === 'number') {
      $('zoomVal').textContent = Math.round(s.zoom * 100) + '%';
    }
    setWindowTitle(isBlank(s.url) ? '' : s.title);
  }

  function report() {
    var s = readState();
    applyState(s);
    if (api && api.reportState) api.reportState(s);
  }

  function go(input) {
    var v = String(input === undefined ? urlInput.value : input).trim();
    if (!v) return Promise.resolve({ ok: false, error: '空地址' });
    return __b.navigate(v);
  }

  // ── 主进程命令桥：全部落在 <webview> 上 ──
  var __b = {
    /** 主进程 → 页面：导航 */
    navigate: function (url) {
      return new Promise(function (resolve) {
        var settled = false;
        var timer = null;
        function finish(res) {
          if (settled) return;
          settled = true;
          if (timer) clearTimeout(timer);
          view.removeEventListener('did-finish-loading', onDone);
          view.removeEventListener('did-fail-loading', onFail);
          view.removeEventListener('did-navigate', onDone);
          resolve(res);
        }
        function onDone() { finish({ ok: true, url: view.getURL(), title: view.getTitle() }); }
        function onFail(e) {
          // 子资源失败也会冒泡，只认主框架
          if (e && e.isMainFrame === false) return;
          finish({ ok: false, error: '页面加载失败：' + url });
        }
        view.addEventListener('did-finish-loading', onDone);
        view.addEventListener('did-fail-loading', onFail);
        view.addEventListener('did-navigate', onDone);
        timer = setTimeout(function () {
          finish({ ok: true, url: view.getURL(), title: view.getTitle() });
        }, 20000);
        view.loadURL(url);
      });
    },

    /** 主进程 → 页面：在网页本体执行一段 JS */
    exec: function (src) { return view.executeJavaScript(src, true); },

    /** 主进程 → 页面：截网页本体（不是工具栏） */
    shot: function () {
      return view.capturePage().then(function (img) { return img.toDataURL(); });
    },

    /** 主进程 → 页面：读当前状态 */
    state: function () { return readState(); },

    back: function () { if (view.canGoBack()) view.goBack(); },
    forward: function () { if (view.canGoForward()) view.goForward(); },
    reload: function () { view.reload(); },
    hardReload: function () { view.reloadIgnoringCache(); }
  };
  window.__b = __b;

  // ── 设备尺寸说明（对齐图5 右侧那一列） ──
  DEVICE_IDS.forEach(function (k) {
    var d = DEVICES[k];
    if (!d.w) return;
    var el = $('sz-' + k);
    if (el) el.textContent = d.w + ' × ' + d.h;
  });

  function applyDevice(id) {
    var d = DEVICES[id] || DEVICES.responsive;
    viewport.classList.toggle('device', !!d.w);

    DEVICE_IDS.forEach(function (k) {
      var ck = $('ck-' + k);
      if (ck) ck.style.visibility = k === id ? 'visible' : 'hidden';
    });

    if (d.w) {
      view.style.width = d.w + 'px';
      view.style.maxWidth = '100%';
      view.style.height = d.h + 'px';
      view.style.maxHeight = '100%';
      view.setAttribute('devicepixelratio', d.w <= 500 ? '2' : '1');
    } else {
      view.style.width = '100%';
      view.style.maxHeight = 'none';
      view.style.height = '100%';
      view.removeAttribute('devicepixelratio');
    }
    // 尺寸变化后 webview 需要重新布局，让页面自己再报一次状态
    setTimeout(report, 60);
  }

  function applyZoom(z) {
    var next = Math.max(0.25, Math.min(2, z));
    view.setZoomFactor(next);
    $('zoomVal').textContent = Math.round(next * 100) + '%';
  }
  function nudgeZoom(delta) {
    applyZoom((view.getZoomFactor ? view.getZoomFactor() : 1) + delta);
  }

  // ── 工具栏交互 ──
  $('btnBack').onclick = function () { __b.back(); };
  $('btnForward').onclick = function () { __b.forward(); };
  $('btnReload').onclick = function () { __b.reload(); };
  $('btnExternal').onclick = function () {
    if (urlInput.value.trim() && api) api.openExternal(urlInput.value.trim());
  };
  $('btnZoomIn').onclick = function () { nudgeZoom(0.1); };
  $('btnZoomOut').onclick = function () { nudgeZoom(-0.1); };
  $('btnMenu').onclick = function (e) { e.stopPropagation(); menu.classList.toggle('open'); };

  urlInput.addEventListener('focus', function () { editing = true; urlInput.select(); });
  urlInput.addEventListener('blur', function () { editing = false; });
  urlInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { editing = false; urlInput.blur(); go(); }
    if (e.key === 'Escape') { editing = false; urlInput.blur(); report(); }
  });

  // ── 菜单项 ──
  $('mHardReload').onclick = function () { __b.hardReload(); menu.classList.remove('open'); };
  $('mExternal').onclick = function () {
    if (urlInput.value.trim() && api) api.openExternal(urlInput.value.trim());
    menu.classList.remove('open');
  };
  $('mZoomReset').onclick = function () { applyZoom(1); menu.classList.remove('open'); };
  document.querySelectorAll('[data-zoom]').forEach(function (el) {
    el.onclick = function () {
      nudgeZoom(el.getAttribute('data-zoom') === 'in' ? 0.1 : -0.1);
      menu.classList.remove('open');
    };
  });
  document.querySelectorAll('[data-device]').forEach(function (el) {
    el.onclick = function () { applyDevice(el.getAttribute('data-device')); menu.classList.remove('open'); };
  });
  $('mClearData').onclick = function () {
    if (api && confirm('清除浏览器 Cookie 与缓存？')) api.clearData();
    menu.classList.remove('open');
  };
  $('mClose').onclick = function () { if (api) api.close(); };

  document.addEventListener('click', function (e) {
    if (!menu.contains(e.target)) menu.classList.remove('open');
  });

  document.addEventListener('keydown', function (e) {
    var mod = e.ctrlKey || e.metaKey;
    if (mod && e.key.toLowerCase() === 'l') { e.preventDefault(); urlInput.focus(); }
    if (mod && e.key.toLowerCase() === 'r') { e.preventDefault(); __b.reload(); }
    if (e.key === 'F5') { e.preventDefault(); __b.reload(); }
  });

  // ── webview 事件 → 同步地址栏/标题/按钮 ──
  ['did-start-loading', 'did-stop-loading', 'did-navigate', 'did-navigate-in-page', 'page-title-updated']
    .forEach(function (evt) { view.addEventListener(evt, report); });

  view.addEventListener('did-fail-loading', function (e) {
    if (e && e.isMainFrame === false) return;
    urlInput.value = e && e.validatedURL ? e.validatedURL : urlInput.value;
  });

  if (api) {
    api.onState(applyState);
    api.getState().then(applyState, function () { report(); });
  }
  applyDevice('responsive');
  report();
</script>
</body>
</html>
