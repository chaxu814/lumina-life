<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self';" />
<title>Lumina</title>
<style>
  :root {
    --card-bg: rgba(28, 28, 34, 0.86);
    --card-border: rgba(255, 255, 255, 0.08);
    --text-primary: #f3f4f6;
    --text-secondary: #9ca3af;
    --text-dim: #6b7280;
    --hover-bg: rgba(255, 255, 255, 0.07);
    --active-bg: rgba(99, 102, 241, 0.18);
    --accent: #818cf8;
    --danger: #f87171;
    --divider: rgba(255, 255, 255, 0.08);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }

  html, body {
    width: 100%;
    height: 100%;
    background: transparent;
    font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    font-size: 13px;
    color: var(--text-primary);
    overflow: hidden;
  }

  .card {
    width: 248px;
    margin: 8px;
    border-radius: 16px;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    backdrop-filter: blur(24px) saturate(160%);
    -webkit-backdrop-filter: blur(24px) saturate(160%);
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45),
                0 2px 8px rgba(0, 0, 0, 0.3);
    overflow: hidden;
    padding: 14px 10px 10px;
  }

  /* ── 顶部状态区 ── */
  .header {
    display: flex;
    align-items: center;
    padding: 2px 8px 12px;
  }
  .avatar {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: linear-gradient(135deg, #6366f1, #a855f7);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
    font-weight: 700;
    color: #fff;
    flex-shrink: 0;
    box-shadow: 0 2px 8px rgba(99, 102, 241, 0.4);
  }
  .header-text {
    flex: 1;
    margin-left: 10px;
    min-width: 0;
  }
  .header-name {
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.2px;
    line-height: 1.2;
  }
  .header-status {
    display: flex;
    align-items: center;
    margin-top: 3px;
    font-size: 11px;
    color: var(--text-secondary);
  }
  .status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #4ade80;
    margin-right: 5px;
    box-shadow: 0 0 6px currentColor;
  }
  .status-text { font-size: 11px; }

  .header-badge {
    font-size: 11px;
    font-weight: 600;
    color: var(--text-primary);
    background: rgba(255, 255, 255, 0.08);
    padding: 3px 8px;
    border-radius: 999px;
    flex-shrink: 0;
  }

  /* ── 菜单 ── */
  .menu { display: flex; flex-direction: column; }

  .item {
    display: flex;
    align-items: center;
    height: 36px;
    padding: 0 10px;
    border-radius: 9px;
    cursor: pointer;
    transition: background 0.12s ease;
  }
  .item:hover { background: var(--hover-bg); }
  .item:active { background: var(--active-bg); }

  .item-icon {
    width: 18px;
    height: 18px;
    margin-right: 10px;
    color: var(--text-secondary);
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .item-label {
    flex: 1;
    font-size: 13px;
    color: var(--text-primary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .item-value {
    font-size: 11px;
    color: var(--text-dim);
    margin-right: 6px;
  }

  .divider {
    height: 1px;
    background: var(--divider);
    margin: 6px 8px;
  }

  /* ── toggle 开关 ── */
  .toggle {
    width: 30px;
    height: 17px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.16);
    position: relative;
    transition: background 0.18s ease;
    flex-shrink: 0;
  }
  .toggle::after {
    content: '';
    position: absolute;
    top: 2px;
    left: 2px;
    width: 13px;
    height: 13px;
    border-radius: 50%;
    background: #fff;
    transition: transform 0.18s ease;
  }
  .toggle.on { background: var(--accent); }
  .toggle.on::after { transform: translateX(13px); }

  .item.danger .item-label { color: var(--danger); }
  .item.danger .item-icon { color: var(--danger); }
</style>
</head>
<body>
  <div class="card">
    <div class="header">
      <div class="avatar">L</div>
      <div class="header-text">
        <div class="header-name">Lumina</div>
        <div class="header-status">
          <span class="status-dot" id="statusDot"></span>
          <span class="status-text" id="statusText">在线</span>
        </div>
      </div>
      <div class="header-badge" id="headerBadge">在线</div>
    </div>

    <div class="menu">
      <div class="item" data-action="toggle-main">
        <div class="item-icon">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18"/></svg>
        </div>
        <div class="item-label" id="toggleMainLabel">显示 Lumina</div>
      </div>

      <div class="item" data-action="open-settings">
        <div class="item-icon">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </div>
        <div class="item-label">打开设置</div>
      </div>

      <div class="item" data-action="open-task-workspace">
        <div class="item-icon">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        </div>
        <div class="item-label">任务工作区</div>
        <div class="item-value">即将推出</div>
      </div>

      <div class="divider"></div>

      <div class="item" data-action="toggle-game">
        <div class="item-icon">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="6" y1="12" x2="10" y2="12"/><line x1="8" y1="10" x2="8" y2="14"/><line x1="15" y1="13" x2="15.01" y2="13"/><line x1="18" y1="11" x2="18.01" y2="11"/><rect x="2" y="6" width="20" height="12" rx="2"/></svg>
        </div>
        <div class="item-label">游戏陪伴</div>
        <div class="toggle" id="gameToggle"></div>
      </div>

      <div class="divider"></div>

      <div class="item danger" data-action="quit">
        <div class="item-icon">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        </div>
        <div class="item-label">退出应用</div>
      </div>
    </div>
  </div>

<script>
  // 由 trayMenuPreload 注入
  var api = window.trayMenuAPI;

  function applyState(s) {
    if (!s) { return; }
    var dot = document.getElementById('statusDot');
    var st = document.getElementById('statusText');
    var badge = document.getElementById('headerBadge');
    var toggle = document.getElementById('gameToggle');
    var tml = document.getElementById('toggleMainLabel');

    if (dot) { dot.style.background = s.moodColor || '#4ade80'; dot.style.color = s.moodColor || '#4ade80'; }
    if (st) { st.textContent = s.mood || '在线'; }
    if (badge) { badge.textContent = s.statusText || (s.online ? '在线' : '离线'); }
    if (toggle) { toggle.classList.toggle('on', !!s.gameEnabled); }
    if (tml) { tml.textContent = s.windowVisible ? '隐藏 Lumina' : '显示 Lumina'; }
  }

  document.querySelectorAll('.item').forEach(function (el) {
    el.addEventListener('click', function () {
      var action = el.getAttribute('data-action');
      if (action && api) { api.menuClick(action); }
    });
  });

  if (api) {
    api.onState(applyState);
    api.getState().then(applyState).catch(function () {});
  }
</script>
</body>
</html>
