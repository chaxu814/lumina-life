<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Lumina Chat</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: transparent;
    font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
  }
  /* 让圆角卡片浮在透明窗口内，留出阴影边距 */
  /* 🔧 2026-10-18：去掉窗口外那圈"淡淡的黑框"。
     旧样式是 inset:10px + box-shadow:0 12px 40px rgba(40,60,120,.30)：
     窗口只比面板大 10px，而 40px 模糊半径的投影根本铺不开，被窗口边界
     硬切一刀 → 四周出现一圈边缘生硬的深色带（用户看到的就是"黑框"）。
     现在面板直接铺满窗口（inset:0），窗口本身透明 + 无边框 + hasShadow:false，
     圆角由面板的 border-radius 负责；用 1px 描边替代投影来交代边界。 */
  #chat-panel {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: #ffffff;
    border: 1px solid rgba(15,25,45,0.08); border-radius: 14px;
    box-shadow: none; overflow: hidden;
    display: flex; flex-direction: column;
    font-size: 13px; color: #1f2430; user-select: text;
  }
  /* 标题栏：整个原生窗口的拖拽手柄（frame:false 下系统级拖动） */
  #chat-panel .cp-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 14px; flex: none;
    background: linear-gradient(135deg, rgba(74,158,255,0.15), rgba(107,181,255,0.10));
    border-bottom: 1px solid rgba(100,130,180,0.12);
    -webkit-app-region: drag;
    cursor: move;
  }
  /* 🔧 2026-10-04：聊天记录区也能拖窗。
     之前只有标题栏是 drag 区 —— 用户在正文里按住鼠标拖动，窗口纹丝不动，
     很容易理解成「这窗只能在桌宠那一块里动」。
     正文里有选项按钮和表情按钮，所以整块设为 drag 后再逐个声明 no-drag。 */
  /* 🔧 2026-10-05：拖拽区从「整块正文」收回到「标题栏 + 显式手柄」。
     问题现场：聊天记录区整体是 drag，用户滚不动正文、点不准选项，
     而且拖拽时窗口贴着桌宠窗口一起动，观感上就是「只能在这个范围内拖」。

     实际行为澄清：-webkit-app-region: drag 是【系统级】的，
     窗口本身可以拖到屏幕任意位置，不受桌宠窗口约束 ——
     真正的限制来自「正��区被 drag 吃掉」，而不是窗口边界。
     所以修法是：把 drag 收回标题栏（本来就该 drag）+ 底部拖动手柄，
     正文恢复为正常区域（滚轮滚动 + 文字可选 + 按钮可点）。

     额外收益：去掉 user-select: none 对正文的影响，消息内容可以复制了。 */
  #chat-panel .cp-head { -webkit-app-region: drag; }
  #chat-panel .cp-log { -webkit-app-region: no-drag; overflow-y: auto; }
  /* 底部拖动手柄：空白处也能自由拖窗，不用非得瞄准标题栏 */
  #chat-panel .cp-drag-handle {
    -webkit-app-region: drag; cursor: move;
    display: flex; align-items: center; justify-content: center;
    gap: 5px; flex: none; height: 14px;
  }
  #chat-panel .cp-drag-handle::before {
    content: ''; width: 34px; height: 3px; border-radius: 2px;
    background: rgba(120,150,200,0.35);
  }
  #chat-panel .cp-drag-handle:hover::before { background: rgba(74,158,255,0.6); }
  /* 🔧 2026-10-05：选项组【容器】也必须声明 no-drag。
     -webkit-app-region 是【继承】的：父级是 drag 时，未声明的子元素跟着是 drag。
     旧实现只给按钮（.cp-opt-btn）加了 no-drag，而包裹它们的 .cp-msg-options 没有。
     后果：点选项时，按钮的【周边区域】属于 drag → 触发窗口移动而不是点击，
           用户看到的就是「点了没反应、选项不消失」。 */
  #chat-panel .cp-msg-options { -webkit-app-region: no-drag; }
  /* 🔧 2026-10-05：已选回看条。点完选项后缩成这行，点击可展开当时的完整选项。
     需求原话：「选择完之后应该是收起状态，后期还可以打开查看」。 */
  #chat-panel .cp-msg-chosen {
    -webkit-app-region: no-drag; cursor: pointer; user-select: none;
    margin: 2px 12px 4px 44px; padding: 4px 10px; border-radius: 8px;
    font-size: 11px; color: #7a8ba8; background: rgba(120,150,200,0.07);
    border: 1px dashed rgba(120,150,200,0.25);
    transition: all .15s;
  }
  #chat-panel .cp-msg-chosen:hover { background: rgba(74,158,255,0.10); color: #4a7fb5; }
  #chat-panel .cp-msg-chosen.open {
    background: rgba(74,158,255,0.08); border-style: solid;
    border-color: rgba(74,158,255,0.3); color: #3a6a9a;
  }
  #chat-panel .cp-opt-btn,
  #chat-panel .cp-quick-btn,
  #chat-panel .cp-emoji-item { -webkit-app-region: no-drag; }
  /* 正文可选中、可复制 */
  #chat-panel .cp-msg { user-select: text; -webkit-user-select: text; }
  #chat-panel .cp-head .cp-title { display: flex; align-items: center; gap: 8px; }
  #chat-panel .cp-head .cp-avatar {
    width: 30px; height: 30px; border-radius: 50%;
    background: linear-gradient(135deg, #4a9eff, #6bb5ff);
    display: flex; align-items: center; justify-content: center; font-size: 16px;
    box-shadow: 0 2px 8px rgba(74,158,255,0.3);
    overflow: hidden; flex: none;
  }
  /* 2026-10-19：Lumina 立绘头像（正式形象，源图 assets/lumina-avatar.png） */
  #chat-panel .cp-head .cp-avatar img,
  #chat-panel .cp-msg.pet .cp-msg-avatar img {
    width: 100%; height: 100%; object-fit: cover; border-radius: 50%; display: block;
  }
  #chat-panel .cp-head .cp-name { display: flex; flex-direction: column; gap: 1px; }
  #chat-panel .cp-head .cp-name b { font-weight: 700; font-size: 13px; }
  #chat-panel .cp-head .cp-name .cp-status {
    font-size: 10px; font-weight: 500; color: #5a9a5a;
    display: flex; align-items: center; gap: 4px;
  }
  #chat-panel .cp-head .cp-name .cp-status::before {
    content: ''; width: 6px; height: 6px; border-radius: 50%; background: #5ac85a;
  }
  #chat-panel .cp-head .cp-actions { display: flex; gap: 4px; -webkit-app-region: no-drag; }
  #chat-panel .cp-head .cp-btn,
  #chat-panel .cp-head .cp-actions button {
    -webkit-app-region: no-drag;
    width: 26px; height: 26px; border-radius: 8px; border: none;
    background: rgba(100,130,180,0.1); color: #5a7aaa; cursor: pointer;
    display: flex; align-items: center; justify-content: center; font-size: 13px;
    transition: all .15s;
  }
  #chat-panel .cp-head .cp-btn:hover { background: rgba(74,158,255,0.2); color: #2a6abb; }
  #chat-panel #chat-log {
    flex: 1; overflow-y: auto;
    padding: 14px; display: flex; flex-direction: column; gap: 10px;
    background: rgba(255,255,255,0.3);
  }
  #chat-panel #chat-log::-webkit-scrollbar { width: 5px; }
  #chat-panel #chat-log::-webkit-scrollbar-thumb { background: rgba(100,130,180,0.25); border-radius: 3px; }
  #chat-panel .cp-msg {
    max-width: 88%; padding: 8px 12px; border-radius: 14px; line-height: 1.5; word-break: break-word;
    font-size: 13px; animation: msgIn .25s ease;
  }
  @keyframes msgIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  #chat-panel .cp-msg.user {
    align-self: flex-end; background: linear-gradient(135deg, #4a9eff, #5aa8ff); color: #fff;
    border-bottom-right-radius: 4px; box-shadow: 0 2px 8px rgba(74,158,255,0.25);
  }
  /* ⚠️ AI 气泡不要写在这里 —— 本文件下方「── 消息区 ──」区块里还有一组
     #chat-panel .cp-msg / .cp-msg.pet，同优先级、位置更靠后，会把这里的声明
     整体覆盖掉。2026-10-18 那次「给 AI 消息加气泡」就是加在这一段，结果被
     下面那句 `background: transparent` 清空，用户看到的仍然是没有气泡的一坨
     文字。气泡的唯一定义点已收拢到下方消息区区块，改样式请只改那一处。 */
  /* pet-md.js 没加载成功时的纯文本兜底：保住换行 */
  #chat-panel .cp-msg.pet.no-md { white-space: pre-wrap; }
  #chat-panel .cp-typing {
    align-self: flex-start; background: rgba(255,255,255,0.9);
    border: 1px solid rgba(100,130,180,0.1); border-radius: 14px;
    border-bottom-left-radius: 4px; padding: 10px 14px;
    display: none; gap: 4px; align-items: center;
  }
  #chat-panel .cp-typing.show { display: flex; }
  #chat-panel .cp-typing span {
    width: 7px; height: 7px; border-radius: 50%; background: #8aa0c8;
    animation: typingBounce 1.2s infinite ease-in-out;
  }
  #chat-panel .cp-typing span:nth-child(2) { animation-delay: 0.15s; }
  #chat-panel .cp-typing span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes typingBounce { 0%,60%,100% { transform: translateY(0); opacity: .5; } 30% { transform: translateY(-5px); opacity: 1; } }
  /* ── 🧠 推理过程面板（2026-10-17）─────────────────────────────
     桌宠聊天此前只有"三个点"等待动画，看不到任何思考与工具调用，
     和主聊天面板的思考区完全不像同一个产品。现在主窗口把 agent:event
     按 requestId 过滤后经 pet:chat-trace 中转过来，这里渲染成可折叠的推理链。 */
  #chat-panel .cp-trace {
    align-self: flex-start; max-width: 88%; margin: 0 0 2px 0;
    background: rgba(248,250,255,0.78); border: 1px solid rgba(100,130,180,0.16);
    border-radius: 10px; overflow: hidden; -webkit-app-region: no-drag;
    animation: msgIn .2s ease;
  }
  #chat-panel .cp-trace-head {
    display: flex; align-items: center; gap: 6px; cursor: pointer;
    padding: 5px 9px; background: rgba(120,150,200,0.06); user-select: none;
    font-size: 11px; font-weight: 600; color: #4a6a95;
  }
  #chat-panel .cp-trace-head:hover { background: rgba(120,150,200,0.12); }
  #chat-panel .cp-trace-count { margin-left: auto; font-weight: 500; font-size: 10px; color: #8a9cba; }
  #chat-panel .cp-trace-body {
    max-height: 132px; overflow-y: auto; padding: 6px 9px 8px;
    display: flex; flex-direction: column; gap: 3px;
  }
  #chat-panel .cp-trace-body::-webkit-scrollbar { width: 4px; }
  #chat-panel .cp-trace-body::-webkit-scrollbar-thumb { background: rgba(100,130,180,0.25); border-radius: 2px; }
  #chat-panel .cp-trace.collapsed .cp-trace-body { display: none; }
  #chat-panel .cp-trace-line { display: flex; gap: 5px; line-height: 1.45; word-break: break-word; font-size: 11px; color: #5a6f92; }
  #chat-panel .cp-trace-ico { flex: none; }
  #chat-panel .cp-trace-txt { opacity: .94; }
  #chat-panel .cp-trace.done .cp-trace-head { color: #4a7a5a; }
  #chat-panel .cp-trace.fail .cp-trace-head { color: #a05a5a; }

  /* ── 🗑 删除菜单 / 会话选择面板（2026-10-18）────────────────────
     此前垃圾桶点了直接 clearChat() 清 DOM，后端一条没删 —— 用户感知
     「删了但没删掉」。现在点垃圾桶先弹菜单：清空当前 / 选择删除 / 全部删除。 */
  #chat-panel .cp-del-menu {
    position: absolute; right: 10px; top: 48px; z-index: 50;
    min-width: 176px; padding: 5px; border-radius: 12px;
    background: rgba(255,255,255,0.98); border: 1px solid rgba(100,130,180,0.18);
    box-shadow: 0 10px 28px rgba(30,50,100,0.20);
    display: none; flex-direction: column; gap: 2px;
    -webkit-app-region: no-drag;
  }
  #chat-panel .cp-del-menu.show { display: flex; }
  #chat-panel .cp-del-menu button {
    text-align: left; padding: 8px 10px; border-radius: 8px; border: none;
    background: transparent; color: #2a3a5c; font-size: 12px; cursor: pointer;
    font-family: inherit; -webkit-app-region: no-drag; transition: background .12s;
    display: flex; align-items: center; gap: 7px;
  }
  #chat-panel .cp-del-menu button .cp-i { width: 15px; height: 15px; opacity: .8; }
  #chat-panel .cp-del-menu button:hover { background: rgba(74,158,255,0.12); }
  #chat-panel .cp-del-menu button.danger { color: #c0392b; }
  #chat-panel .cp-del-menu button.danger:hover { background: rgba(239,68,68,0.12); }
  #chat-panel .cp-del-menu .cp-del-sep { height: 1px; background: rgba(100,130,180,0.14); margin: 3px 4px; }

  #chat-panel .cp-mask {
    position: absolute; inset: 0; z-index: 60; display: none;
    background: rgba(20,30,50,0.30); backdrop-filter: blur(2px);
    align-items: center; justify-content: center; padding: 14px;
    -webkit-app-region: no-drag;
  }
  #chat-panel .cp-mask.show { display: flex; }
  #chat-panel .cp-dialog {
    width: 100%; max-width: 320px; max-height: 100%;
    display: flex; flex-direction: column; overflow: hidden;
    background: #fff; border-radius: 14px;
    box-shadow: 0 14px 36px rgba(20,40,80,0.28);
  }
  #chat-panel .cp-dialog-head {
    display: flex; align-items: center; gap: 8px; flex: none;
    padding: 12px 14px; font-size: 13px; font-weight: 700; color: #2a3a5c;
    border-bottom: 1px solid rgba(100,130,180,0.12);
  }
  #chat-panel .cp-dialog-head .cp-x {
    margin-left: auto; width: 22px; height: 22px; border-radius: 6px; border: none;
    background: rgba(100,130,180,0.10); color: #5a7aaa; cursor: pointer; font-size: 12px;
    display: flex; align-items: center; justify-content: center;
  }
  #chat-panel .cp-dialog-body {
    flex: 1; overflow-y: auto; padding: 8px 10px; min-height: 60px;
  }
  #chat-panel .cp-dialog-body::-webkit-scrollbar { width: 5px; }
  #chat-panel .cp-dialog-body::-webkit-scrollbar-thumb { background: rgba(100,130,180,0.25); border-radius: 3px; }
  #chat-panel .cp-conv-item {
    display: flex; align-items: center; gap: 8px; padding: 8px 9px;
    border-radius: 9px; cursor: pointer; transition: background .12s;
  }
  #chat-panel .cp-conv-item:hover { background: rgba(74,158,255,0.08); }
  #chat-panel .cp-conv-item input { flex: none; cursor: pointer; }
  #chat-panel .cp-conv-name {
    flex: 1; min-width: 0; font-size: 12px; color: #2a3a5c;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  #chat-panel .cp-conv-count { flex: none; font-size: 10px; color: #8a9cba; }
  #chat-panel .cp-conv-badge {
    flex: none; font-size: 10px; color: #2a6abb; background: rgba(74,158,255,0.12);
    border-radius: 999px; padding: 1px 6px;
  }
  #chat-panel .cp-dialog-foot {
    display: flex; align-items: center; gap: 8px; flex: none;
    padding: 10px 12px; border-top: 1px solid rgba(100,130,180,0.12);
    background: rgba(248,250,255,0.8);
  }
  #chat-panel .cp-dialog-foot label {
    display: flex; align-items: center; gap: 5px; font-size: 11px; color: #5a7aaa; cursor: pointer;
  }
  #chat-panel .cp-dialog-foot .cp-btn-primary {
    margin-left: auto; padding: 7px 14px; border-radius: 9px; border: none;
    background: linear-gradient(135deg,#ef4444,#f87171); color: #fff;
    font-size: 12px; font-weight: 600; cursor: pointer; font-family: inherit;
  }
  #chat-panel .cp-dialog-foot .cp-btn-primary:disabled {
    background: rgba(150,165,190,0.35); cursor: not-allowed;
  }
  #chat-panel .cp-dialog-tip { padding: 4px 12px 10px; font-size: 11px; color: #8a9cba; }
  #chat-panel .cp-quick {
    display: flex; gap: 6px; padding: 8px 12px 0; flex-wrap: wrap; flex: none;
  }
  #chat-panel .cp-quick .cp-quick-btn {
    padding: 4px 12px; border-radius: 999px; font-size: 11px;
    border: 1px solid rgba(74,158,255,0.3); background: rgba(74,158,255,0.08);
    color: #2a6abb; cursor: pointer; transition: all .15s; white-space: nowrap;
  }
  #chat-panel .cp-quick .cp-quick-btn:hover { background: rgba(74,158,255,0.18); }
  #chat-panel .cp-emoji-panel {
    display: none; padding: 8px 12px; gap: 6px; flex-wrap: wrap; flex: none;
    border-top: 1px solid rgba(100,130,180,0.1); background: rgba(255,255,255,0.5);
    max-height: 100px; overflow-y: auto;
  }
  #chat-panel .cp-emoji-panel.show { display: flex; }
  #chat-panel .cp-emoji-panel .cp-emoji-item {
    font-size: 18px; cursor: pointer; padding: 3px 6px; border-radius: 8px; transition: background .15s;
  }
  #chat-panel .cp-emoji-panel .cp-emoji-item:hover { background: rgba(74,158,255,0.15); }
  #chat-panel .cp-msg-options {
    display: flex; flex-direction: column; gap: 5px; padding: 0 12px 2px 44px; flex: none;
  }
  #chat-panel .cp-opt-btn {
    text-align: left; padding: 6px 11px; border-radius: 10px; font-size: 12px; cursor: pointer;
    border: 1px solid rgba(74,158,255,0.3); background: rgba(74,158,255,0.07);
    color: #2a6abb; transition: all .15s;
  }
  #chat-panel .cp-opt-btn:hover { background: rgba(74,158,255,0.16); transform: translateX(2px); }
  /* 收起动画：先压高度再淡出，避免选项消失时下方内容瞬移 */
  #chat-panel .cp-msg-options.leaving {
    opacity: 0; max-height: 0; padding-top: 0; padding-bottom: 0;
    overflow: hidden; pointer-events: none;
    transition: opacity .18s, max-height .18s, padding .18s;
  }
  #chat-panel .cp-input-row {
    display: flex; gap: 8px; padding: 10px 12px 12px; flex: none;
    border-top: 1px solid rgba(100,130,180,0.1);
    background: rgba(255,255,255,0.4); align-items: flex-end;
    -webkit-app-region: no-drag;
  }
  #chat-panel #pet-chat-input {
    flex: 1; padding: 9px 12px; border-radius: 12px;
    border: 1px solid rgba(100,130,180,0.15); background: rgba(255,255,255,0.85);
    color: #2a3a5c; outline: none; font-size: 13px; font-family: inherit;
    resize: none; min-height: 36px; max-height: 80px; line-height: 1.4;
    transition: border-color .15s;
  }
  #chat-panel #pet-chat-input:focus { border-color: rgba(74,158,255,0.5); }
  #chat-panel #pet-chat-input::placeholder { color: #9aaccc; }
  #chat-panel .cp-input-btn {
    width: 36px; height: 36px; border-radius: 10px; border: none;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    font-size: 16px; transition: all .15s; flex: none;
  }
  #chat-panel #pet-chat-emoji { background: rgba(100,130,180,0.1); color: #5a7aaa; }
  #chat-panel #pet-chat-emoji:hover { background: rgba(100,130,180,0.2); }
  #chat-panel #pet-chat-send {
    background: linear-gradient(135deg, #4a9eff, #5aa8ff); color: #fff;
    box-shadow: 0 2px 8px rgba(74,158,255,0.3);
  }
  #chat-panel #pet-chat-send:hover { filter: brightness(1.1); transform: scale(1.05); }

  /* ── 消息正文排版 ────────────────────────────────────────────
     2026-10-18：原来 .cp-msg 没设 white-space，模型回复里的换行被
     全部折叠成一段，`**加粗**`、`- 列表` 的标记原样露出来 —— 几百字挤成
     一坨，眼睛很难受。现在：
       · 用户气泡保持纯文本 + pre-wrap（用户敲的换行要保留）
       · 助手气泡走 pet-md.js 渲染成真正的标题/列表/代码块/表格
     所以两者用不同的 white-space：pre-wrap 会把已渲染的块级结构再撑开一次。 */
  #chat-panel .cp-msg.user { white-space: pre-wrap; }
  #chat-panel .cp-msg.pet { white-space: normal; }
  #chat-panel .cp-msg.pet .cp-md { min-width: 0; }

  #chat-panel .cp-md > *:first-child { margin-top: 0; }
  #chat-panel .cp-md > *:last-child { margin-bottom: 0; }
  #chat-panel .cp-md p { margin: 0 0 7px; }
  #chat-panel .cp-md h3,
  #chat-panel .cp-md h4,
  #chat-panel .cp-md h5,
  #chat-panel .cp-md h6 {
    margin: 11px 0 5px; font-weight: 700; color: #1f2d49; line-height: 1.35;
  }
  #chat-panel .cp-md h3 { font-size: 14.5px; }
  #chat-panel .cp-md h4 { font-size: 13.5px; }
  #chat-panel .cp-md h5 { font-size: 13px; }
  #chat-panel .cp-md h6 { font-size: 12.5px; color: #3a4c6d; }

<!-- Markdown 渲染（零依赖，见 pet-md.js 顶部注释）：必须在主脚本之前加载 -->
<script src="./pet-md.js"></script>
<script>
/* ════════════════════════════════════════════════════════════
   Lumina 独立聊天窗口（pet-chat.html）
   - 由 petWindow.ts 的 openPetChatWindow 创建：frame:false + 透明 + 置顶
   - 标题栏 -webkit-app-region: drag → 系统级自由拖动，可拖到屏幕任意位置
   - 消息收发复用桌宠既有通道：pet:sync-send / pet:chat / pet:sync-reply
   ════════════════════════════════════════════════════════════ */
let ipc = null;
try { ipc = (window.petAPI && window.petAPI.ipc) || null; } catch (e) {}
const HAS_IPC = !!ipc;

const chatLog = document.getElementById('chat-log');
const chatInput = document.getElementById('pet-chat-input');
const typingEl = document.getElementById('chat-typing');
const micBtn = document.getElementById('btn-mic');
/** 待发送的附件（文件路径 / 截图 dataURL），随下一条消息一起发出 */
let _attachments = [];
/** 思考开关（「更多 → 思考」），随消息带给主窗口决定 trackReasoning */
let _thinking = true;

/* 助手回复里的链接走受控外链打开（petPreload 的 openExternal 只放行 http(s)/mailto）。
   不在 <a> 上直接挂 onclick —— 渲染出来的是 innerHTML，用事件委托更稳，
   也不会因为重新渲染丢失监听。 */
chatLog.addEventListener('click', function (e) {
  const a = e.target && e.target.closest ? e.target.closest('a[data-ext]') : null;
  if (!a) return;
  e.preventDefault();
  const url = a.getAttribute('href') || '';
  if (!/^https?:\/\//i.test(url)) return;
  try {
    if (window.petAPI && typeof window.petAPI.openExternal === 'function') {
      window.petAPI.openExternal(url);
    }
  } catch (err) { /* 无 preload 的纯浏览器预览：静默忽略 */ }
});

function addChatMsg(role, text) {
  // 🐛 2026-10-17：同一句话被画两次 —— 点 Live2D 头顶搭话卡片的 A/B/C 时必现。
  //
  //   根因（两条路径撞在一起）：
  //     ① pet-live2d.html 的 replyProactive 先发 `pet:sync-send` → 主窗口
  //        PetChatSync 把这句话写进 store 并开始跑 Agent；
  //     ② 紧接着它又发 `pet:sync-reply {role:'user'}` 把用户气泡"回显"到本窗，
  //        而这条走 sendWhenReady，要等 did-finish-load。
  //
  //   新窗口加载时会先拉一次历史 —— 此时 ① 已经把这句话写进 store 了，
  //   于是历史里**已经有它**；随后 ② 的延迟回显到达，又画一遍 → 两个一样的蓝气泡。
  //
  //   为什么不能直接删掉 ②：窗口早就开着的时候不会拉历史，② 是唯一的渲染者。
  //   所以修在渲染层：相邻、同角色、同文本、3 秒内 → 判为重复，丢弃。
  //   （顺带也挡住快捷按钮连点、双击发送这类真实重复。）
  //
  //   历史回填时不丢：历史是权威数据，不可能含这条 bug 造成的重复，
  //   但真实对话里"连说两句一样的话"是可能的 —— 回填阶段只记录不拦截。
  const dup = isDuplicateMsg(role, text);
  if (dup && !_replayingHistory) return;
  const d = document.createElement('div');
  d.className = 'cp-msg ' + role;
  if (role === 'pet') {
    // 结构：头像在气泡外，正文包在 .cp-bubble 里（见上方「AI 消息气泡」样式注释）
    // 2026-10-19：Lumina 立绘头像（同 .cp-head，assets/lumina-avatar.png）
    const av = document.createElement('span');
    av.className = 'cp-msg-avatar';
    const avImg = document.createElement('img');
    avImg.src = './assets/lumina-avatar.png';
    avImg.alt = '';
    av.appendChild(avImg);
    const bubble = document.createElement('div');
    bubble.className = 'cp-bubble';
    // 🔧 2026-10-18：助手回复走 Markdown 渲染。
    //   旧实现 `span.textContent = text` 是纯文本，而 .cp-msg 又没设
    //   white-space —— 换行被全部折叠成一段，`**加粗**`、`- 列表` 的标记
    //   原样露出来，几百字挤成一坨（用户原话：「眼睛看起来比较难受」）。
    //   渲染器先整体转义再插标签，模型输出里的 <script> 只会变成可见字符。
    //   若 pet-md.js 没加载成功（离线/文件缺失），退化为纯文本 + pre-wrap，
    //   至少不会把原文吞掉。
    const body = document.createElement('div');
    body.className = 'cp-md';
    let html = '';
    try {
      if (window.PetMD && typeof window.PetMD.render === 'function') {
        html = window.PetMD.render(text);
      }
    } catch (e) { html = ''; }
    if (html) {
      body.innerHTML = html;
    } else {
      body.textContent = text;
      body.classList.add('cp-md-plain');
      d.classList.add('no-md');
    }
    bubble.appendChild(body);
    d.appendChild(av);
    d.appendChild(bubble);
  } else {
    d.textContent = text;
  }
  chatLog.appendChild(d);
  while (chatLog.children.length > 30) chatLog.removeChild(chatLog.firstChild);
  chatLog.scrollTop = chatLog.scrollHeight;
}

/* ── 相邻重复消息判定（见 addChatMsg 注释） ── */
const DEDUPE_WINDOW_MS = 3000;
let _lastMsg = null; // { role, text, at }
/** 历史回填期间为 true —— 只记录不拦截（历史是权威数据，见 addChatMsg 注释） */
let _replayingHistory = false;
function isDuplicateMsg(role, text) {
  const now = Date.now();
  const t = text == null ? '' : String(text);
  if (_lastMsg && _lastMsg.role === role && _lastMsg.text === t && now - _lastMsg.at < DEDUPE_WINDOW_MS) {
    _lastMsg.at = now; // 续期：连续多次重复只算一次
    return true;
  }
  _lastMsg = { role, text: t, at: now };
  return false;
}
function resetMsgDedupe() { _lastMsg = null; }
function showTyping(show) { typingEl.classList.toggle('show', show); if (show) chatLog.scrollTop = chatLog.scrollHeight; }
// 🆕 2026-10-13：等待态改为**计数**而不是布尔开关。
//   桌宠侧是串行排队处理消息的（见 src/lib/petChatOrchestrator.ts：处理中到达的
//   新消息排队而非丢弃）。排队时存在「前一条的回复先到、后一条仍在处理」的中间态，
//   布尔开关会在第一条回复到达时就把动画关掉，后一条全程没有任何反馈。
//   计数保证动画一直持续到**最后一个**请求回来为止。
let _pendingReplies = 0;
function beginWait() { _pendingReplies++; showTyping(true); }
function endWait() {
  _pendingReplies = Math.max(0, _pendingReplies - 1);
  if (_pendingReplies === 0) showTyping(false);
}

/* ════════════════════════════════════════════════════════════
   🧠 推理过程面板（2026-10-17 新增）
   ────────────────────────────────────────────────────────────
   需求原话：「这里也不像 agent 那样的推理思考」。
   此前桌宠聊天只有三个点的等待动画：模型在搜网页、在翻文件、在纠错，
   用户完全看不见，体验上和主聊天面板的「思考过程」是两个产品。

   数据从哪来：`agent:event` 只发给**发起 agent:chat 的窗口**（主窗口），
   桌宠聊天窗收不到。主窗口的 PetChatSync 订阅事件、按 requestId 过滤，
   再经 `pet:chat-trace` 中转到这里（见 electron/pet/petWindow.ts）。

   渲染策略：一轮一块，可折叠；回复到达后自动收起成一行摘要，
   点标题可展开回看。不自动删除 —— 想回看上一轮怎么想的还能翻到。
   ════════════════════════════════════════════════════════════ */
let _trace = null; // { el, title, count, body, steps, streamLine }

function traceClear() {
  if (_trace && _trace.el && _trace.el.isConnected) {
    try { _trace.el.remove(); } catch (e) {}
  }
  _trace = null;
}

function traceEnsure() {
  if (_trace && _trace.el && _trace.el.isConnected) return _trace;
  const el = document.createElement('div');
  el.className = 'cp-trace';
  const head = document.createElement('div'); head.className = 'cp-trace-head';
  const title = document.createElement('span'); title.className = 'cp-trace-title';
  title.textContent = '💭 思考中…';
  const count = document.createElement('span'); count.className = 'cp-trace-count';
  head.appendChild(title); head.appendChild(count);
  const body = document.createElement('div'); body.className = 'cp-trace-body';
  el.appendChild(head); el.appendChild(body);
  chatLog.appendChild(el);
  while (chatLog.children.length > 30) chatLog.removeChild(chatLog.firstChild);
  _trace = { el: el, title: title, count: count, body: body, steps: 0, streamLine: null };
  head.onclick = function () {
    if (!_trace) return;
    _trace.el.classList.toggle('collapsed');
  };
  return _trace;
}

/**
 * 追加一行推理。
 * @param {string} icon  💭 思考 / 🔧 工具 / ✅ 完成 / ⚠️ 失败 / ❌ 错误
 * @param {string} text  一行文字
 * @param {{stream?: boolean}} [opts] stream=true 表示这是**同一条**流式推理的增量，
 *        原地更新最后一行而不是新起一行（否则每 180ms 就多一行，瞬间刷满）。
 */
function tracePush(icon, text, opts) {
  const t = String(text == null ? '' : text).trim();
  if (!t) return;
  const isStream = !!(opts && opts.stream);
  const tr = traceEnsure();
  if (isStream && tr.streamLine) {
    tr.streamLine.querySelector('.cp-trace-txt').textContent = t;
  } else {
    const line = document.createElement('div'); line.className = 'cp-trace-line';
    const ico = document.createElement('span'); ico.className = 'cp-trace-ico'; ico.textContent = icon;
    const txt = document.createElement('span'); txt.className = 'cp-trace-txt'; txt.textContent = t;
    line.appendChild(ico); line.appendChild(txt);
    tr.body.appendChild(line);
    tr.steps++;
    tr.count.textContent = tr.steps + ' 步';
    if (isStream) tr.streamLine = line;
  }
  if (!isStream) tr.streamLine = null;
  tr.body.scrollTop = tr.body.scrollHeight;
  chatLog.scrollTop = chatLog.scrollHeight;
}

/** 收尾：把面板折成一行摘要（失败时标红），并断开引用。
 *  断开引用是必须的：这块面板已"定型"留在聊天记录里当回看入口，
 *  下一轮 traceEnsure 要新建一块，而不是把新推理接到旧面板尾巴上。 */
function traceFinish(ok) {
  if (!_trace) return;
  _trace.streamLine = null;
  _trace.title.textContent = (ok === false ? '⚠️ 思考中断 · ' : '🧠 思考完成 · ') + _trace.steps + ' 步';
  _trace.el.classList.add(ok === false ? 'fail' : 'done');
  _trace.el.classList.add('collapsed');
  _trace = null;
}
// 当前显示中的选项组。
// 【为什么要记下来，而不是每次各自 append】
// 旧实现每次都新建一个 wrap 追加到聊天记录末尾，**从不清理上一组**。
// 多轮之后会同时存在多组 A/B/C，点掉一组还能看到别的 ——
// 用户感知就是「点了选择它不收回」。
let _activeOptions = null;
/** 已选择过的选项（按顺序），用于底部「重看选项」入口 */
let _optionHistory = [];

/** 收起当前选项组（带淡出动画，避免下方内容突然上跳） */
function clearChatOptions() {
  const w = _activeOptions;
  _activeOptions = null;
  if (!w || !w.isConnected) return;
  w.classList.add('leaving');
  setTimeout(() => { try { w.remove() } catch (_) {} }, 180);
}

/** 🔧 2026-10-05：构建「已选」回看条。
 *  需求：点完选项应该收起，但用户可能想回去看当时有哪些选项。
 *  做法：把整组缩成一行灰色文字「A. 帮写 prompt（已选 B. 我自己搞）」，点击展开。 */
function buildChosenBar(list, chosenIndex) {
  const bar = document.createElement('div');
  bar.className = 'cp-msg-chosen';
  bar.title = '点击展开这轮的全部选项';
  const letters = list.map((_, i) => String.fromCharCode(65 + i));
  bar.textContent = `选项 ${letters.join(' / ')} · 已选 ${letters[chosenIndex]}`;
  bar.onclick = () => {
    if (bar.classList.contains('open')) { bar.classList.remove('open'); return }
    bar.classList.add('open');
    bar.textContent = `选项 ${letters.join(' / ')} · 已选 ${letters[chosenIndex]}（点击收起）`;
  };
  return bar;
}

function addChatOptions(options) {
  const list = (options || []).slice(0, 3);
  if (!list.length) return;
  // 新的选项组出现时先收掉旧的 —— 同一时刻只该有一组可选项
  clearChatOptions();
  const wrap = document.createElement('div');
  wrap.className = 'cp-msg-options';
  list.forEach((o, i) => {
    const b = document.createElement('button');
    b.className = 'cp-opt-btn';
    b.textContent = String.fromCharCode(65 + i) + '. ' + o;
    b.onclick = () => {
      // 🔧 2026-10-05：先发出消息，再把选项组换成「已选」回看条。
      // 旧实现是 clearChatOptions() 后直接 sendText，选项消失得无痕 ——
      // 用户想确认自己刚才选了什么、当时还有哪些选项，就只能往上翻。
      _optionHistory.push({ list, chosenIndex: i });
      try { wrap.replaceWith(buildChosenBar(list, i)); } catch (e) {}
      _activeOptions = null;
      sendText(o);
    };
    wrap.appendChild(b);
  });
  chatLog.appendChild(wrap);
  _activeOptions = wrap;
  chatLog.scrollTop = chatLog.scrollHeight;
}
function clearChat() { _activeOptions = null; _optionHistory = []; chatLog.innerHTML = ''; traceClear(); resetMsgDedupe(); }

// 由主 Agent 回复文本本地派生动作/表情（纯关键词启发式，**不发任何 LLM**）。
// 替代旧的"同一轮再打一次 pet:chat 意图 LLM"——那会和完整回复并发抢同一个本地模型。
function deriveIntent(text) {
  const t = text || '';
  if (/[?？]/.test(t.slice(-8)) || /为什么|怎么|如何|是不是|对吗/.test(t)) return { action: 'think', mood: '好奇 🤔' };
  if (/[哈呵嘿嘻嘻]|😊|😄|🎉|✨|开心|高兴|棒|好耶/.test(t)) return { action: 'happy', mood: '开心 😊' };
  if (/晚安|睡|困|累|疲惫|早点休息/.test(t)) return { action: 'sleep', mood: '疲惫 😩' };
  if (/抱歉|对不起|没答上|出错|失败|不行/.test(t)) return { action: 'sad', mood: '闷闷不乐 😕' };
  return { action: 'nod', mood: '平静 😐' };
}

function sendText(text) {
  const t = (text || '').trim();
  if (!t && !_attachments.length) return;
  // 📎 附件单独走 attachments 字段，**不拼进 text**：
  //   主窗口 agentRunner.sendMessage 的去重条件是「history 末条 user 与本次 text
  //   逐字相同」，拼前缀会让去重失效 → 用户的话被模型看到两遍。
  const files = _attachments.map(function (a) { return { name: a.name, path: a.path }; });
  addChatMsg('user', t || '（已发送附件）');
  if (chatInput) chatInput.value = '';
  _attachments = [];
  renderAttachments();
  syncMicMode();
  traceClear();          // 新一轮 → 上一轮的推理面板收走（已折叠的那块保留在历史里）
  beginWait();
  if (HAS_IPC) {
    // 完整回复统一走 pet:sync 主 Agent 路径（串行排队 + 退避重试在主窗 PetChatSync 编排）。
    // 不再并发打 pet:chat 意图 LLM——避免与完整回复抢同一个本地模型导致冷启动失败。
    // 动作/表情等主 Agent 回复回来后，由回复文本本地派生（见 pet:sync-reply 处理）。
    try { ipc.send('pet:sync-send', { text: t || '（见附件）', attachments: files, thinking: _thinking }); } catch (e) {}
  } else {
    endWait();
    addChatMsg('pet', '喵~');
  }
}
function submitChat() { sendText(chatInput && chatInput.value); }

// 发送
chatInput.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); submitChat(); } });
// 🔧 2026-10-18：新版输入条没有独立的发送按钮（参考稿就是回车发送）。
//   🎤 按钮在输入框有内容时变成「发送」箭头，兼顾可发现性。
function syncMicMode() {
  const has = !!(chatInput.value || '').trim() || _attachments.length > 0;
  micBtn.classList.toggle('has-text', has);
  micBtn.setAttribute('data-tip', has ? '发送（Enter）' : '语音输入');
  micBtn.innerHTML = has
    ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M6 11l6-6 6 6"/></svg>'
    : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3.5" width="6" height="10.5" rx="3"/><path d="M5.5 11.5a6.5 6.5 0 0013 0M12 18v3"/></svg>';
}
chatInput.addEventListener('input', syncMicMode);
// 清空 / 关闭
/* ════════════════════════════════════════════════════════════
   🗑 删除对话（2026-10-18 重做）
   ────────────────────────────────────────────────────────────
   旧实现：点垃圾桶直接 `clearChat()` —— 只把 DOM 清空，后端 store 里的
   会话和消息一条没动。下次窗口重新打开拉历史，删掉的对话全回来了，
   用户感知就是「点了删除但没删掉」，而且没有任何"选择 / 全部删除"的口径。

   现在：点垃圾桶先弹菜单，三种口径
     · 清空当前对话   → 只清 conv-pet-live2d 的消息，会话保留（最常用）
     · 选择要删除的对话… → 拉会话清单，多选后删除
     · 删除全部对话   → 全删（store 会兜底留一个空会话）
   真正的删除在**主窗口**执行（会话住在它的 zustand store 里，本窗够不到），
   删完由主窗口发 pet:conv-changed 回来，这里清屏并重新拉历史。
   ════════════════════════════════════════════════════════════ */
const delMenu = document.getElementById('cp-del-menu');
const pickerMask = document.getElementById('cp-picker-mask');
const pickerList = document.getElementById('cp-picker-list');
const pickerAllBox = document.getElementById('cp-picker-all');
const pickerOkBtn = document.getElementById('cp-picker-ok');
const confirmMask = document.getElementById('cp-confirm-mask');
const confirmTitleEl = document.getElementById('cp-confirm-title');
const confirmTextEl = document.getElementById('cp-confirm-text');
const confirmOkBtn = document.getElementById('cp-confirm-ok');

let _confirmAction = null;
function askConfirm(title, text, onOk) {
  confirmTitleEl.textContent = title;
  confirmTextEl.textContent = text;
  _confirmAction = onOk;
  confirmMask.classList.add('show');
}
function closeConfirm() {
  confirmMask.classList.remove('show');
  _confirmAction = null;
}

function doDelete(payload) {
  if (!HAS_IPC) {
    // 无 IPC（纯浏览器预览）时退化为本地清屏，至少不会误以为删掉了
    clearChat();
    return;
  }
  try { ipc.send('pet:conv-delete', payload); } catch (e) {}
}

function pickerBoxes() {
  const out = [];
  const inputs = pickerList.querySelectorAll('input[data-conv]');
  for (let i = 0; i < inputs.length; i++) out.push(inputs[i]);
  return out;
}
function syncPickerState() {
  const boxes = pickerBoxes();
  const picked = boxes.filter(function (b) { return b.checked; }).length;
  pickerOkBtn.disabled = picked === 0;
  pickerOkBtn.textContent = picked ? ('删除选中（' + picked + '）') : '删除选中';
  pickerAllBox.checked = boxes.length > 0 && picked === boxes.length;
}
function renderPicker(list) {
  pickerList.innerHTML = '';
  const items = Array.isArray(list) ? list : [];
  if (!items.length) {
    const tip = document.createElement('div');
    tip.className = 'cp-dialog-tip';
    tip.textContent = '还没有任何对话。';
    pickerList.appendChild(tip);
    pickerAllBox.checked = false;
    pickerAllBox.disabled = true;
    pickerOkBtn.disabled = true;
    return;
  }
  pickerAllBox.disabled = false;
  items.forEach(function (c) {
    const row = document.createElement('label');
    row.className = 'cp-conv-item';
    const cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.value = c.id;
    cb.setAttribute('data-conv', '1');
    cb.onchange = syncPickerState;
    const name = document.createElement('span');
    name.className = 'cp-conv-name';
    name.textContent = c.name || '未命名对话';
    const count = document.createElement('span');
    count.className = 'cp-conv-count';
    count.textContent = (c.count || 0) + ' 条';
    row.appendChild(cb); row.appendChild(name); row.appendChild(count);
    if (c.isPet) {
      const badge = document.createElement('span');
      badge.className = 'cp-conv-badge';
      badge.textContent = '桌宠';
      row.appendChild(badge);
    }
    pickerList.appendChild(row);
  });
  pickerAllBox.checked = false;
  syncPickerState();
}
function openPicker() {
  pickerList.innerHTML = '';
  const loading = document.createElement('div');
  loading.className = 'cp-dialog-tip';
  loading.textContent = '正在读取对话列表…';
  pickerList.appendChild(loading);
  pickerOkBtn.disabled = true;
  pickerMask.classList.add('show');
  if (HAS_IPC) {
    try { ipc.send('pet:conv-list-request'); } catch (e) {}
  } else {
    renderPicker([]);
  }
}

document.getElementById('chat-clear').addEventListener('click', function (e) {
  e.stopPropagation();
  delMenu.classList.toggle('show');
});
delMenu.addEventListener('click', function (e) {
  const btn = e.target && e.target.closest ? e.target.closest('button[data-act]') : null;
  if (!btn) return;
  const act = btn.getAttribute('data-act');
  delMenu.classList.remove('show');
  if (act === 'current') {
    askConfirm('清空当前对话',
      '只清空这条桌宠对话里的消息，对话本身保留。删除后不可恢复。',
      function () { doDelete({ scope: 'current' }); });
  } else if (act === 'select') {
    openPicker();
  } else if (act === 'all') {
    askConfirm('删除全部对话',
      '将删除所有对话，桌宠这条里的消息也会一并清空。删除后不可恢复。',
      function () { doDelete({ scope: 'all' }); });
  }
});
document.getElementById('cp-picker-close').addEventListener('click', function () {
  pickerMask.classList.remove('show');
});
pickerMask.addEventListener('click', function (e) {
  if (e.target === pickerMask) pickerMask.classList.remove('show');
});
pickerAllBox.addEventListener('change', function () {
  const on = pickerAllBox.checked;
  pickerBoxes().forEach(function (b) { b.checked = on; });
  syncPickerState();
});
pickerOkBtn.addEventListener('click', function () {
  const ids = pickerBoxes().filter(function (b) { return b.checked; }).map(function (b) { return b.value; });
  if (!ids.length) return;
  pickerMask.classList.remove('show');
  doDelete({ scope: 'select', ids: ids });
});
document.getElementById('cp-confirm-cancel').addEventListener('click', closeConfirm);
confirmMask.addEventListener('click', function (e) {
  if (e.target === confirmMask) closeConfirm();
});
confirmOkBtn.addEventListener('click', function () {
  const fn = _confirmAction;
  closeConfirm();
  if (typeof fn === 'function') fn();
});
// 点空白处收起删除菜单（菜单自身与垃圾桶按钮除外）
document.addEventListener('click', function (e) {
  if (!delMenu.classList.contains('show')) return;

  if (e.target && e.target.id === 'chat-clear') return;
  delMenu.classList.remove('show');

// 主 Agent 回复
if (HAS_IPC) {
  ipc.on('pet:sync-reply', (_e, data) => {
    // 🆕 2026-10-13：收到「用户消息」回显 = 用户刚从**别处**发来一条消息 ——
    //   具体是 Live2D 角色头顶的主动搭话卡片 A/B/C 选项（pet-live2d.html 的
    //   replyProactive：它自己不在聊天窗里，只能靠 ipc 把用户气泡推过来）。
    //   此时主 Agent 刚开始处理 → 必须进入「正在思考」三点动画。
    //   旧实现这里无条件 showTyping(false)：输入框路径看不出来（sendText 自己
    //   已经 showTyping(true)），但卡片选项路径**全程没有任何加载反馈** ——
    //   用户点完 A/B/C 只看到一句自己的话，然后界面一动不动，以为程序卡死了。
    //   输入框与聊天窗内选项走 sendText()，且主窗不会回推自己注入的 user 消息，
    //   所以这里判断 role==='user' 不会给它们带来副作用。
    if (data && data.role === 'user') {
      // 用户消息来自别处（Live2D 头顶卡片的 A/B/C）→ 进入等待态。
      // ⚠️ 这里**不能** traceClear()：卡片路径是先 pet:sync-send（Agent 立刻开跑、
      //    推理事件已经在路上了），再延迟回显这句用户消息。此时清面板会把
      //    刚收到的思考行抹掉。收尾由 traceFinish 自己断引用，下一轮自然新建。
      beginWait();
    } else {
      traceFinish(true);
      endWait();
      // 自动播报：仅对「主 Agent 的回复」生效，用户气泡不念。
      // speakReply 内部自己判 _autoSpeak，关闭时零开销。
      speakReply(data && data.text);
    }
    if (data && data.text) {
      addChatMsg(data.role === 'user' ? 'user' : 'pet', data.text);
      if (data.role !== 'user' && Array.isArray(data.options) && data.options.length) addChatOptions(data.options);
      // 主 Agent 回复回来 → 本地派生动作/表情（pet:test-intent 不发 LLM，只驱动桌宠动效）
      if (data.role !== 'user') {
        try { ipc.invoke('pet:test-intent', deriveIntent(data.text)); } catch (e) {}
      }
    }
  });
  // 历史回填
  ipc.on('pet:sync-history-reply', (_e, messages) => {
    if (!Array.isArray(messages) || messages.length === 0) return;
    chatLog.innerHTML = '';
    // 清空后必须重置去重状态：否则"清空前最后一条"会跟"回填的第一条"比较，
    // 若恰好同角色同文本，历史的第一条会被误吞。
    resetMsgDedupe();
    traceClear();
    _replayingHistory = true;
    try {
      for (const m of messages) addChatMsg(m.role === 'user' ? 'user' : 'pet', m.content);
    } finally {
      _replayingHistory = false;
    }
  });
  // 🧠 推理过程中转（主窗口 → 本窗，见 petWindow.ts 的 pet:chat-trace 注释）
  ipc.on('pet:chat-trace', (_e, data) => {
    if (!data || typeof data.kind !== 'string') return;
    if (data.kind === 'thinking') { tracePush('💭', data.text, { stream: !!data.stream }); return; }
    if (data.kind === 'tool_start') {
      tracePush('🔧', data.detail ? ('调用 ' + data.tool + '：' + data.detail) : ('调用 ' + data.tool));
      return;
    }
    if (data.kind === 'tool_end') {
      tracePush(data.ok === false ? '⚠️' : '✅', data.tool + (data.ok === false ? ' 失败' : ' 完成'));
      return;
    }
    if (data.kind === 'error') { tracePush('❌', data.text || '出错了'); return; }
  });
  // 🗑 删除流程的两个回调（见下方「删除对话」模块）
  ipc.on('pet:conv-list', (_e, list) => {
    // 只在选择面板开着时渲染：用户可能已经关掉了，迟到的清单不该弹窗
    if (pickerMask.classList.contains('show')) renderPicker(list);
  });
  ipc.on('pet:conv-changed', () => {
    // 主窗口已经真的删掉了 → 本窗清屏并重新拉一次历史
    chatLog.innerHTML = '';
    resetMsgDedupe();
    traceClear();
    _activeOptions = null;
    _optionHistory = [];
    try { ipc.send('pet:sync-history-request'); } catch (e) {}
  });
  // 拉取历史
  try { ipc.send('pet:sync-history-request'); } catch (e) {}
  // 主进程通知聚焦输入框（窗口刚打开时）
  ipc.on('pet:chat-window-focus', () => { setTimeout(() => chatInput.focus(), 120); });
}

/* ════════════════════════════════════════════════════════════
   2026-10-18 · 新版顶栏 / 输入条 / 侧边工作台 / 附件
   ────────────────────────────────────────────────────────────
   参考稿的形态：极简白、细线图标、悬停出黑色小提示（带快捷键）、
   输入区是一个大圆角卡片（上输入 / 下操作条：+ ｜ 对话 更多 ｜ 🎤）。
   这里把每个按钮都接到**真实能力**上，不做占位：
     · 最小化 / 置顶 / 自动播报 / 在主窗口中打开 → 主进程或主窗口
     · 任务列表 → 主窗口 taskWorkspaceStore 的真实数据
     · 侧边工作台 → 文件夹选择、新建文件、搜索、时光胶囊
     · 更多 → 增强提示词（真调模型）、Lucky、思考、表情、文件、语音、CU、胶囊
     · + → 上传文件 / 截图提问（按用户要求去掉云盘与共享屏幕）
   ════════════════════════════════════════════════════════════ */
const $id = function (id) { return document.getElementById(id); };

/* ── 悬停提示 ── */
const tipEl = $id('cp-tip');
let _tipTimer = null;
function showTipFor(el) {
  const txt = el.getAttribute('data-tip') || '';
  if (!txt) { return; }
  const kbd = el.getAttribute('data-kbd') || '';
  tipEl.textContent = txt;
  if (kbd) {
    const k = document.createElement('span');
    k.className = 'cp-tip-kbd';
    k.textContent = kbd;
    tipEl.appendChild(k);
  }
  tipEl.classList.add('show');
  const r = el.getBoundingClientRect();
  const tr = tipEl.getBoundingClientRect();
  let left = r.left + r.width / 2 - tr.width / 2;
  left = Math.max(6, Math.min(left, window.innerWidth - tr.width - 6));
  let top = r.bottom + 7;
  if (top + tr.height > window.innerHeight - 6) { top = r.top - tr.height - 7; }
  tipEl.style.left = left + 'px';
  tipEl.style.top = top + 'px';
}
function hideTip() { tipEl.classList.remove('show'); }
document.querySelectorAll('[data-tip]').forEach(function (el) {
  el.addEventListener('mouseenter', function () {
    clearTimeout(_tipTimer);
    _tipTimer = setTimeout(function () { showTipFor(el); }, 300);
  });
  el.addEventListener('mouseleave', hideTip);
  el.addEventListener('click', hideTip);
});

/* ── 轻提示（动作反馈） ── */
const toastEl = $id('cp-toast');
let _toastTimer = null;
function toast(msg) {
  if (!msg) { return; }
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(function () { toastEl.classList.remove('show'); }, 2200);
}

/* ── 附件条 ── */
const attachBar = $id('attach-bar');
function renderAttachments() {
  attachBar.innerHTML = '';
  _attachments.forEach(function (a, i) {
    const chip = document.createElement('span');
    chip.className = 'cp-chip';
    if (a.dataUrl) {
      const img = document.createElement('img');
      img.src = a.dataUrl;
      chip.appendChild(img);
    }
    const nm = document.createElement('span');
    nm.className = 'cp-chip-name';
    nm.textContent = a.name || '附件';
    chip.appendChild(nm);
    const x = document.createElement('button');
    x.className = 'cp-chip-x';
    x.textContent = '✕';
    x.title = '移除';
    x.onclick = function (e) {
      e.stopPropagation();
      _attachments.splice(i, 1);
      renderAttachments();
      syncMicMode();
    };
    chip.appendChild(x);
    attachBar.appendChild(chip);
  });
  attachBar.classList.toggle('show', _attachments.length > 0);
}
function addAttachments(list) {
  (list || []).forEach(function (f) {
    if (!f || !f.path) { return; }
    if (_attachments.some(function (a) { return a.path === f.path; })) { return; }
    _attachments.push({ name: f.name || '附件', path: f.path, dataUrl: f.dataUrl || '' });
  });
  renderAttachments();
  syncMicMode();
}

/* ── 顶栏状态 ── */
let _pinned = true;
let _autoSpeak = false;
let _compact = false;
let _luckyPreset = 'off';
let _voiceOn = false;
let _cuOn = false;

const pinBtn = $id('tb-pin');
const speakBtn = $id('tb-speak');
const sideBtn = $id('tb-side');

function applyPin(on) {
  _pinned = !!on;
  pinBtn.classList.toggle('on', _pinned);
  pinBtn.classList.toggle('off', !_pinned);
  pinBtn.setAttribute('data-tip', _pinned ? '取消置顶' : '置顶窗口');
}
function applySpeak(on) {
  _autoSpeak = !!on;
  speakBtn.classList.toggle('on', _autoSpeak);
  speakBtn.classList.toggle('off', !_autoSpeak);
  speakBtn.setAttribute('data-tip', _autoSpeak ? '关闭自动播报' : '开启自动播报');
}
function applyCompact(on) {
  _compact = !!on;
  $id('chat-panel').classList.toggle('cp-compact', _compact);
  sideBtn.classList.toggle('on', _compact);
  sideBtn.setAttribute('data-tip', _compact ? '展开快捷语' : '收起快捷语');

if (HAS_IPC) {
  try {

      applyPin(p.pinned !== false);
      applySpeak(p.autoSpeak === true);
    }).catch(function () {});
  } catch (e) {}

pinBtn.addEventListener('click', function () {
  applyPin(!_pinned);
  if (HAS_IPC) { try { ipc.invoke('pet:ui:set-pinned', _pinned); } catch (e) {} }
});
sideBtn.addEventListener('click', function () { applyCompact(!_compact); });
speakBtn.addEventListener('click', function () {
  applySpeak(!_autoSpeak);
  if (HAS_IPC) { try { ipc.invoke('pet:ui:set-auto-speak', _autoSpeak); } catch (e) {} }
  toast(_autoSpeak ? '🔊 已开启自动播报' : '🔇 已关闭自动播报');
});
$id('tb-min').addEventListener('click', function () {
  if (HAS_IPC) { try { ipc.send('pet:chat-window-minimize'); } catch (e) {} }
});
$id('tb-main').addEventListener('click', function () {
  if (HAS_IPC) { try { ipc.send('pet:ui:open-main'); } catch (e) {} }
  toast('已在主窗口打开这条对话');
});

/* ── 自动播报：回复到达时读出来 ── */
function speakReply(text) {
  if (!_autoSpeak || !HAS_IPC || !text) { return; }
  // 代码块/表格读出来是灾难，先洗一遍再念，并截断到合理长度
  const clean = String(text)
    .replace(/```[\s\S]*?```/g, '（代码块）')
    .replace(/`([^`]*)`/g, '$1')
    .replace(/\[([^\]]*)\]\([^)]*\)/g, '$1')
    .replace(/[*_~#>|]/g, '')
    .replace(/\s+/g, ' ')
    .trim()
    .slice(0, 500);
  if (!clean) { return; }
  try { ipc.invoke('edge-tts:speak', { text: clean }).catch(function () {}); } catch (e) {}
}

/* ── 弹出层管理 ── */
const popPlus = $id('pop-plus');
const popMore = $id('pop-more');
const popTask = $id('pop-task');
const popTaskDetail = $id('pop-task-detail');
const workbench = $id('workbench');

function closeAllPops(except) {
  [popPlus, popMore, popTask, popTaskDetail].forEach(function (p) {
    if (p && p !== except) { p.classList.remove('show'); }
  });
  $id('btn-plus').classList.remove('open');
  $id('btn-more').classList.remove('on');
  $id('tb-task').classList.remove('on');
}
document.addEventListener('click', function (e) {
  if (!e.target.closest) { return; }
  if (e.target.closest('.cp-pop') || e.target.closest('#composer') || e.target.closest('.cp-topbar')) { return; }
  closeAllPops(null);
});
document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape') { closeAllPops(null); emojiPanel.classList.remove('show'); }
});

/* ── 「+」菜单 ── */
$id('btn-plus').addEventListener('click', function (e) {
  e.stopPropagation();
  const open = !popPlus.classList.contains('show');
  closeAllPops(popPlus);
  popPlus.classList.toggle('show', open);
  this.classList.toggle('open', open);
  if (open) { $id('plus-search').focus(); }
});
$id('plus-search').addEventListener('input', function () {
  const q = this.value.trim().toLowerCase();
  popPlus.querySelectorAll('.cp-pop-item').forEach(function (it) {
    const label = (it.querySelector('.cp-pop-label') || {}).textContent || '';
    it.style.display = (!q || label.toLowerCase().indexOf(q) !== -1) ? '' : 'none';
  });
});
popPlus.addEventListener('click', function (e) {
  const btn = e.target.closest ? e.target.closest('.cp-pop-item') : null;
  if (!btn) { return; }
  const act = btn.getAttribute('data-act');
  closeAllPops(null);
  if (act === 'upload') { void pickFiles(); }
  else if (act === 'shot') { void takeScreenshot(); }
});

async function pickFiles() {
  if (!HAS_IPC) { toast('需要桌面端才能选文件'); return; }
  try {
    const r = await ipc.invoke('pet:ui:pick-files');
    if (r && r.ok && r.files && r.files.length) {
      addAttachments(r.files);
      toast('已添加 ' + r.files.length + ' 个文件');
    }
  } catch (e) { toast('选择文件失败'); }
}
async function takeScreenshot() {
  if (!HAS_IPC) { toast('需要桌面端才能截图'); return; }
  try {
    const shot = await ipc.invoke('pet:ui:screenshot');
    if (!shot || !shot.ok || !shot.dataUrl) { toast(shot && shot.error ? shot.error : '截图失败'); return; }
    const saved = await ipc.invoke('pet:ui:save-shot', shot.dataUrl);
    if (!saved || !saved.ok) { toast(saved && saved.error ? saved.error : '截图保存失败'); return; }
    addAttachments([{ name: '屏幕截图.png', path: saved.path, dataUrl: shot.dataUrl }]);
    toast('已截屏，可继续输入问题');
  } catch (e) { toast('截图失败'); }
}

/* ── 「更多」面板 ── */
$id('btn-more').addEventListener('click', function (e) {
  e.stopPropagation();
  const open = !popMore.classList.contains('show');
  closeAllPops(popMore);
  popMore.classList.toggle('show', open);
  this.classList.toggle('on', open);
  if (open && HAS_IPC) { try { ipc.send('pet:ui:action', { kind: 'lucky-get' }); } catch (e2) {} }
});
popMore.addEventListener('click', function (e) {
  // Lucky 快捷选择栏：点一下就切过去，不用连点
  const qb = e.target.closest ? e.target.closest('.cp-quick-btn') : null;
  if (qb) {
    const preset = qb.getAttribute('data-lucky') || 'off';
    if (HAS_IPC) { try { ipc.send('pet:ui:action', { kind: 'lucky-preset', preset: preset }); } catch (e3) {} }
    applyLucky(preset);
    toast('🍀 Lucky Agent：' + ({ off: '关闭', default: '标准', goal: '目标', mission: '任务' }[preset] || '关闭'));
    return;
  }
  const btn = e.target.closest ? e.target.closest('.cp-pop-item') : null;
  if (!btn) { return; }
  const act = btn.getAttribute('data-act');
  if (act === 'emoji') { closeAllPops(null); toggleEmojiPanel(true); return; }
  if (act === 'file') { closeAllPops(null); void pickFiles(); return; }
  if (act === 'enhance') { closeAllPops(null); void enhancePrompt(); return; }
  if (act === 'capsule') { closeAllPops(null); insertCapsule(); return; }
  if (act === 'lucky') {
    const order = ['off', 'default', 'goal', 'mission'];
    const next = order[(order.indexOf(_luckyPreset) + 1) % order.length];
    if (HAS_IPC) { try { ipc.send('pet:ui:action', { kind: 'lucky-preset', preset: next }); } catch (e2) {} }
    applyLucky(next);
    return;
  }
  if (act === 'thinking') {
    _thinking = !_thinking;
    btn.classList.toggle('on', _thinking);
    toast(_thinking ? '🧠 思考过程已开启' : '🧠 思考过程已关闭');
    return;
  }
  if (act === 'voice' || act === 'cu') {
    const on = act === 'voice' ? !_voiceOn : !_cuOn;
    if (HAS_IPC) { try { ipc.send('pet:ui:action', { kind: act, on: on }); } catch (e2) {} }
    if (act === 'voice') { _voiceOn = on; } else { _cuOn = on; }
    btn.classList.toggle('on', on);
    toast(on ? (act === 'voice' ? '🎙 实时语音对话已启动' : '💻 AI 操作电脑已就绪')
             : (act === 'voice' ? '🎙 已停止实时语音对话' : '💻 已停止 AI 操作电脑'));
  }
});

function applyLucky(preset) {
  _luckyPreset = preset || 'off';
  const label = { off: '关闭', default: '标准', goal: '目标', mission: '任务' }[_luckyPreset] || '关闭';
  const el = $id('lucky-state');
  if (el) { el.textContent = label; }
  const row = popMore.querySelector('[data-act="lucky"]');
  if (row) { row.classList.toggle('on', _luckyPreset !== 'off'); }
  // 快捷栏高亮跟着走 —— 不跟着走就会出现「选了目标、栏里还亮着标准」
  const quick = $id('lucky-quick');
  if (quick) {
    const btns = quick.querySelectorAll('.cp-quick-btn');
    for (let i = 0; i < btns.length; i++) {
      btns[i].classList.toggle('on', btns[i].getAttribute('data-lucky') === _luckyPreset);
    }
  }
}

function insertCapsule() {
  const draft = (chatInput.value || '').trim();
  const text = draft
    ? '帮我埋一颗时光胶囊，内容是：' + draft + '，30天后开启'
    : '帮我埋一颗时光胶囊';
  chatInput.value = text;
  chatInput.focus();
  syncMicMode();
  toast(draft ? '已生成胶囊指令，回车发送' : '先写点想对未来的自己说的话');
}

async function enhancePrompt() {
  const draft = (chatInput.value || '').trim();
  if (!draft) { toast('先在输入框写点内容，再点增强提示词'); return; }
  toast('✨ 正在增强…');
  if (!HAS_IPC) { return; }
  try { ipc.send('pet:ui:action', { kind: 'enhance', text: draft }); } catch (e) { toast('增强失败'); }
}

/* ── 任务列表 ── */
let _taskData = { artifacts: [], skills: [], recentFiles: [] };
$id('tb-task').addEventListener('click', function (e) {
  e.stopPropagation();
  const open = !popTask.classList.contains('show');
  closeAllPops(popTask);
  popTask.classList.toggle('show', open);
  this.classList.toggle('on', open);
  if (open && HAS_IPC) { try { ipc.send('pet:ui:tasklist-request'); } catch (e2) {} }
});
function renderTaskCounts() {
  $id('cnt-artifacts').textContent = (_taskData.artifacts || []).length;
  $id('cnt-skills').textContent = (_taskData.skills || []).length;
  $id('cnt-recent').textContent = (_taskData.recentFiles || []).length;
}
popTask.addEventListener('click', function (e) {
  const btn = e.target.closest ? e.target.closest('.cp-pop-item') : null;
  if (!btn) { return; }
  const sec = btn.getAttribute('data-sec');
  closeAllPops(null);
  openTaskDetail(sec);
});
function openTaskDetail(sec) {
  const titles = { artifacts: '对话产物', skills: '技能', recent: '最近文件' };
  const list = sec === 'skills'
    ? (_taskData.skills || [])
    : (sec === 'recent' ? (_taskData.recentFiles || []) : (_taskData.artifacts || []));
  $id('task-detail-title').textContent = titles[sec] || '任务';
  const box = $id('task-detail-list');
  box.innerHTML = '';
  if (!list.length) {
    const empty = document.createElement('div');
    empty.className = 'cp-pop-empty';
    empty.textContent = '暂无内容';
    box.appendChild(empty);
  } else {
    list.forEach(function (item) {
      const btn = document.createElement('button');
      btn.className = 'cp-pop-item';
      const ico = document.createElement('span');
      ico.className = 'cp-pop-ico';
      ico.textContent = sec === 'skills' ? '🧩' : '📄';
      const label = document.createElement('span');
      label.className = 'cp-pop-label';
      label.textContent = typeof item === 'string' ? item : (item.filename || '未命名');
      btn.appendChild(ico);
      btn.appendChild(label);
      if (typeof item !== 'string' && item.id) {
        btn.onclick = function () {
          if (HAS_IPC) { try { ipc.send('pet:ui:action', { kind: 'open-artifact', id: item.id }); } catch (e) {} }
          closeAllPops(null);
          toast('已打开：' + label.textContent);
        };
      }
      box.appendChild(btn);
    });
  }
  popTaskDetail.classList.add('show');
}

/* ── 侧边工作台 ── */
function toggleWorkbench(force) {
  const show = typeof force === 'boolean' ? force : !workbench.classList.contains('show');
  workbench.classList.toggle('show', show);
  $id('tb-work').classList.toggle('on', show);
  if (show) { closeAllPops(null); }
}
$id('tb-work').addEventListener('click', function (e) { e.stopPropagation(); toggleWorkbench(); });
$id('wb-close').addEventListener('click', function () { toggleWorkbench(false); });
document.addEventListener('keydown', function (e) {
  if (e.ctrlKey && e.shiftKey && (e.key === 'B' || e.key === 'b')) {
    e.preventDefault();
    toggleWorkbench();
  }
});

workbench.addEventListener('click', function (e) {
  const row = e.target.closest ? e.target.closest('[data-wb]') : null;
  if (!row) { return; }
  const act = row.getAttribute('data-wb');
  if (act === 'search') {
    const wrap = $id('wb-search-wrap');
    const on = !wrap.classList.contains('show');
    wrap.classList.toggle('show', on);
    if (on) { $id('wb-search-input').focus(); }
    return;
  }
  if (act === 'folder') { void openFolder(); return; }
  if (act === 'recent') { toggleWorkbench(false); openTaskDetail('recent'); return; }
  if (act === 'newfile') { void newFile(); return; }
  if (act === 'capsule') { toggleWorkbench(false); insertCapsule(); return; }
  if (act === 'life') { /* 老按钮自带监听，这里不重复处理 */ return; }
});

$id('wb-search-input').addEventListener('keydown', function (e) {
  if (e.key !== 'Enter') { return; }
  const q = (this.value || '').trim();
  if (!q) { return; }
  // 看着像网址就直接开，否则交给搜索引擎
  const isUrl = /^https?:\/\//i.test(q) || /^[\w-]+(\.[\w-]+)+(\/|$)/.test(q);
  const url = isUrl ? (/^https?:\/\//i.test(q) ? q : 'https://' + q) : ('https://www.bing.com/search?q=' + encodeURIComponent(q));
  if (HAS_IPC) { try { ipc.invoke('pet:open-external', url); } catch (err) {} }
  this.value = '';
  toggleWorkbench(false);
});

async function openFolder() {
  if (!HAS_IPC) { toast('需要桌面端'); return; }
  try {
    const r = await ipc.invoke('pet:ui:pick-folder');
    if (r && r.ok) { toast('已打开：' + (r.name || r.path)); }
  } catch (e) { toast('打开文件夹失败'); }
}
async function newFile() {
  if (!HAS_IPC) { toast('需要桌面端'); return; }
  try {
    const r = await ipc.invoke('pet:ui:new-file');
    if (r && r.ok && r.path) {
      addAttachments([{ name: r.name, path: r.path }]);
      toggleWorkbench(false);
      toast('已新建：' + r.name + '（已挂为附件）');
    }
  } catch (e) { toast('新建文件失败'); }
}

/* ── 动作结果回执 ── */
if (HAS_IPC) {
  ipc.on('pet:ui:tasklist', function (_e, data) {
    _taskData = data || { artifacts: [], skills: [], recentFiles: [] };
    renderTaskCounts();
    if (popTaskDetail.classList.contains('show')) {
      // 明细开着时同步刷新，避免"点了半天没数据"
      const title = $id('task-detail-title').textContent;
      const sec = title === '技能' ? 'skills' : (title === '最近文件' ? 'recent' : 'artifacts');
      openTaskDetail(sec);
    }
  });
  ipc.on('pet:ui:action-result', function (_e, data) {
    if (!data) { return; }
    if (data.kind === 'lucky-get') {
      applyLucky(String(data.message || 'off'));
      return;
    }
    if (data.kind === 'enhance') {
      if (data.ok && data.message) {
        chatInput.value = data.message;
        chatInput.focus();
        syncMicMode();
        toast('✨ 已增强，可继续编辑后发送');
      } else {
        toast('增强失败：' + (data.message || '未知错误'));
      }
      return;
    }
    if (data.ok === false && data.message) { toast(data.message); }
  });
}

/* ── 输入区按钮 ── */
$id('btn-conv').addEventListener('click', function (e) {
  e.stopPropagation();
  // 复用「选择对话」面板作为对话切换入口（同一个清单，只是不勾选删除）
  openPicker();
});
// 顶栏标题「🐱 Lumina Virtual Pet ›」= 切换对话（与下方「对话 ›」同一入口）
$id('tb-title').addEventListener('click', function (e) {
  e.stopPropagation();
  closeAllPops(null);
  openPicker();
});
micBtn.addEventListener('click', function () {
  if ((chatInput.value || '').trim() || _attachments.length) { submitChat(); return; }
  const row = popMore.querySelector('[data-act="voice"]');
  const on = !_voiceOn;
  _voiceOn = on;
  if (row) { row.classList.toggle('on', on); }
  if (HAS_IPC) { try { ipc.send('pet:ui:action', { kind: 'voice', on: on }); } catch (e) {} }
  toast(on ? '🎙 实时语音对话已启动' : '🎙 已停止实时语音对话');
});

// 初始同步一次（textarea 可能是自动填充）
syncMicMode();

/* ── 初始状态同步 ──
   开关行的 .on 是「画出来的状态」，_thinking / _voiceOn / _cuOn 才是真实状态。
   不在这里对齐一次，就会出现「开关看着是关的、其实思考是开的」这种鬼故事。
   （置顶 / 自动播报的真实值由上方 pet:ui:prefs 异步取回后覆盖，这里只管开关行。） */
(function syncToggles() {
  const set = function (act, on) {
    const row = popMore.querySelector('[data-act="' + act + '"]');
    if (row) { row.classList.toggle('on', !!on); }
  };
  set('thinking', _thinking);
  set('voice', _voiceOn);
  set('cu', _cuOn);
  set('lucky', _luckyPreset !== 'off');
})();
</script>
</body>
</html>
