<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Lumina Live2D 桌宠</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: transparent; }
  body { font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif; }
  #pet-container {
    position: relative; width: 100%; height: 100%;
    display: flex; align-items: flex-end; justify-content: center;
    -webkit-app-region: no-drag;
  }
  #stage { position: absolute; inset: 0; }

  /* 情绪气泡 */
  .emotion-bubble {
    position: fixed; top: 0; left: 0;
    padding: 3px 10px; border-radius: 12px; background: rgba(0,0,0,0.6);
    color: #fff; font-size: 11px; font-weight: 600; white-space: nowrap;
    opacity: 0; transition: opacity .4s ease; pointer-events: none; z-index: 50;
  }
  .emotion-bubble.show { opacity: 1; }

  /* 对话气泡 */
  .speech-bubble {
    position: fixed; left: 0; top: 0;
    padding: 6px 12px; border-radius: 12px;
    background: rgba(0,0,0,0.78); color: #fff; font-size: 12px;
    max-width: min(240px, calc(100vw - 24px)); min-width: 40px; box-sizing: border-box;
    text-align: left; white-space: normal; overflow-wrap: anywhere; word-break: break-word;
    opacity: 0; transition: opacity .3s ease; pointer-events: none; z-index: 50; line-height: 1.45;
  }
  .speech-bubble::after { content: ''; position: absolute; top: 100%; left: 50%; transform: translateX(-50%);
    border: 5px solid transparent; border-top-color: rgba(0,0,0,0.78); }
  .speech-bubble.show { opacity: 1; }

  /* 🤵 主动秘书搭话卡片（N.E.K.O 风格：文本 + A/B/C 快捷回复） */
  #proactive-card {
    position: fixed; left: 0; top: 0; z-index: 58; width: 268px;
    background: rgba(255,255,255,0.97); backdrop-filter: blur(16px);
    border: 1px solid rgba(236,72,153,0.28); border-radius: 16px;
    box-shadow: 0 10px 36px rgba(190,24,93,0.22);
    padding: 11px 12px 10px; color: #3a2a3c; font-size: 12.5px; line-height: 1.5;
    visibility: hidden; opacity: 0; transform: translateY(6px) scale(.96);
    transition: opacity .22s ease, transform .22s cubic-bezier(.34,1.56,.64,1), visibility 0s linear .22s;
    pointer-events: none;
  }
  #proactive-card.show { visibility: visible; opacity: 1; transform: translateY(0) scale(1); pointer-events: auto;
    transition: opacity .22s ease, transform .22s cubic-bezier(.34,1.56,.64,1); }
  #proactive-card .pc-head { display: flex; align-items: center; gap: 6px; font-weight: 700; color: #be185d; margin-bottom: 6px; font-size: 12px; }
  #proactive-card .pc-kind { font-size: 10px; color: #db2777; opacity: .72; font-weight: 600; }
  #proactive-card .pc-close { margin-left: auto; cursor: pointer; border: none; background: rgba(0,0,0,.05);
    border-radius: 50%; width: 20px; height: 20px; text-align: center; color: #888; font-size: 11px; }
  #proactive-card .pc-close:hover { background: rgba(0,0,0,.1); }
  #proactive-card .pc-text { margin-bottom: 8px; white-space: normal; }
  #proactive-card .pc-opt { display: block; width: 100%; text-align: left; margin-top: 6px; padding: 7px 10px;
    border-radius: 10px; border: 1px solid rgba(236,72,153,.22);
    background: linear-gradient(135deg,#fdf2f8,#fce7f3); color: #9d174d; font-size: 12px; cursor: pointer;
    transition: transform .1s, background .15s; }
  #proactive-card .pc-opt:hover { background: linear-gradient(135deg,#fce7f3,#fbcfe8); transform: translateX(2px); }
  /* 🌸 朋友圈 / 🎬剧场 / 📰日报 三入口小菜单 */
  #life-menu { position: fixed; z-index: 59; display: none; flex-direction: column; gap: 2px; min-width: 140px;
    padding: 6px; background: rgba(255,255,255,.98); border: 1px solid rgba(0,0,0,.08); border-radius: 12px;
    box-shadow: 0 10px 30px rgba(0,0,0,.18); }
  #life-menu.show { display: flex; }
  #life-menu .lm-item { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 8px;
    cursor: pointer; font-size: 12.5px; color: #374151; }
  #life-menu .lm-item:hover { background: #fdf2f8; color: #be185d; }

  /* 名称标签 */
  .name-tag {
    position: fixed; top: 0; left: 0;
    padding: 2px 10px; border-radius: 10px; background: rgba(0,0,0,0.45);
    font-size: 11px; color: #fff; white-space: nowrap; z-index: 50;
    transition: opacity .5s; pointer-events: none;
  }
  .name-tag.idle { opacity: 0.5; }
  .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #10b981; display: inline-block; margin-right: 4px; }
  .ct-hint { position: absolute; top: 4px; right: 4px; font-size: 8px; color: rgba(255,255,255,0.35); pointer-events: none; z-index: 4; }

  /* 右键自定义菜单 */
  #pet-menu {
    position: fixed; z-index: 60; min-width: 168px;
    background: rgba(22,24,38,0.92); backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.12); border-radius: 12px;
    padding: 6px; box-shadow: 0 8px 28px rgba(0,0,0,0.45);
    font-size: 12px; color: #e6e8ff; user-select: none;
  }
  #pet-menu .pm-title { padding: 4px 10px 6px; font-size: 11px; color: #8b8faa; border-bottom: 1px solid rgba(255,255,255,0.08); margin-bottom: 4px; }
  #pet-menu .pm-item { padding: 6px 10px; border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  #pet-menu .pm-item:hover { background: rgba(124,111,247,0.28); }
  #pet-menu .pm-item .pm-mark { color: #7c6ff7; font-weight: 700; }
  #pet-menu .pm-sep { height: 1px; background: rgba(255,255,255,0.08); margin: 4px 6px; }
  #pet-menu .pm-slider { padding: 6px 10px; display: flex; align-items: center; gap: 8px; font-size: 11px; color: #8b8faa; }
  #pet-menu .pm-slider input[type="range"] { flex: 1; accent-color: #7c6ff7; cursor: pointer; }
  #pet-menu .pm-slider #pm-scale-val { min-width: 34px; text-align: right; color: #e6e8ff; }

  /* 迷你聊天面板（N.E.K.O / AIRI 风格） */
  #chat-panel {
    position: fixed; z-index: 55; width: 420px;
    background: rgba(245,247,255,0.95); backdrop-filter: blur(16px);
    border: 1px solid rgba(255,255,255,0.6); border-radius: 18px;
    box-shadow: 0 12px 40px rgba(40,60,120,0.25); overflow: hidden;
    display: flex; flex-direction: column;
    font-size: 13px; color: #2a3a5c; user-select: text;
    transform-origin: bottom left;
    visibility: hidden; opacity: 0; transform: scale(0.92) translateY(8px);
    transition: opacity .22s ease, transform .22s cubic-bezier(.34,1.56,.64,1), visibility 0s linear .22s;
    pointer-events: none;
  }
  #chat-panel.show {
    visibility: visible; opacity: 1; transform: scale(1) translateY(0);
    pointer-events: auto; transition: opacity .22s ease, transform .22s cubic-bezier(.34,1.56,.64,1), visibility 0s;
  }
  #chat-panel.closing {
    opacity: 0; transform: scale(0.92) translateY(8px);
    transition: opacity .18s ease, transform .18s ease;
  }
  #chat-panel .cp-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 14px;
    background: linear-gradient(135deg, rgba(74,158,255,0.15), rgba(107,181,255,0.10));
    border-bottom: 1px solid rgba(100,130,180,0.12);
    font-weight: 700; font-size: 13px; cursor: move;
  }
  #chat-panel .cp-head .cp-title { display: flex; align-items: center; gap: 8px; }
  #chat-panel .cp-head .cp-avatar {
    width: 30px; height: 30px; border-radius: 50%;
    background: linear-gradient(135deg, #4a9eff, #6bb5ff);
    display: flex; align-items: center; justify-content: center; font-size: 16px;
    box-shadow: 0 2px 8px rgba(74,158,255,0.3);
  }
  #chat-panel .cp-head .cp-name { display: flex; flex-direction: column; gap: 1px; }
  #chat-panel .cp-head .cp-name .cp-status { font-size: 10px; font-weight: 500; color: #5a9a5a; display: flex; align-items: center; gap: 4px; }
  #chat-panel .cp-head .cp-name .cp-status::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: #5ac85a; }
  #chat-panel .cp-head .cp-actions { display: flex; gap: 4px; }
  #chat-panel .cp-head .cp-btn {
    width: 26px; height: 26px; border-radius: 8px; border: none;
    background: rgba(100,130,180,0.1); color: #5a7aaa; cursor: pointer;
    display: flex; align-items: center; justify-content: center; font-size: 13px;
    transition: all .15s;
  }
  #chat-panel .cp-head .cp-btn:hover { background: rgba(74,158,255,0.2); color: #2a6abb; }
  #chat-panel #chat-log {
    max-height: 340px; min-height: 200px; overflow-y: auto;
    padding: 14px; display: flex; flex-direction: column; gap: 10px;
    background: rgba(255,255,255,0.3);
  }
  #chat-panel #chat-log::-webkit-scrollbar { width: 5px; }
  #chat-panel #chat-log::-webkit-scrollbar-thumb { background: rgba(100,130,180,0.25); border-radius: 3px; }
  #chat-panel .cp-msg {
    max-width: 82%; padding: 8px 12px; border-radius: 14px; line-height: 1.5; word-break: break-word;
    position: relative; font-size: 13px;
    animation: msgIn .25s ease;
  }
  @keyframes msgIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  #chat-panel .cp-msg.user {
    align-self: flex-end; background: linear-gradient(135deg, #4a9eff, #5aa8ff); color: #fff;
    border-bottom-right-radius: 4px;
    box-shadow: 0 2px 8px rgba(74,158,255,0.25);
  }
  #chat-panel .cp-msg.pet {
    align-self: flex-start; background: rgba(255,255,255,0.85); color: #2a3a5c;
    border-bottom-left-radius: 4px;
    border: 1px solid rgba(100,130,180,0.1);
    box-shadow: 0 1px 4px rgba(40,60,120,0.06);
  }
  #chat-panel .cp-msg.pet .cp-msg-avatar {
    display: inline-flex; width: 22px; height: 22px; border-radius: 50%;
    background: linear-gradient(135deg, #4a9eff, #6bb5ff); color: #fff;
    align-items: center; justify-content: center; font-size: 12px;
    margin-right: 6px; vertical-align: middle;
  }
  #chat-panel .cp-typing {
    align-self: flex-start; background: rgba(255,255,255,0.85);
    border: 1px solid rgba(100,130,180,0.1); border-radius: 14px;
    border-bottom-left-radius: 4px; padding: 10px 14px;
    display: none; gap: 4px; align-items: center;
  }
  #chat-panel .cp-typing.show { display: flex; }
  #chat-panel .cp-typing span {
    width: 7px; height: 7px; border-radius: 50%; background: #8aa0c8;
    animation: typingBounce 1.2s infinite ease-in-out;
  }
  #chat-panel .cp-typing span:nth-child(2) { animation-delay: 0.15s; }
  #chat-panel .cp-typing span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes typingBounce { 0%, 60%, 100% { transform: translateY(0); opacity: 0.5; } 30% { transform: translateY(-5px); opacity: 1; } }
  #chat-panel .cp-quick {
    display: flex; gap: 6px; padding: 8px 12px 0; flex-wrap: wrap;
  }
  #chat-panel .cp-quick .cp-quick-btn {
    padding: 4px 12px; border-radius: 999px; font-size: 11px;
    border: 1px solid rgba(74,158,255,0.3); background: rgba(74,158,255,0.08);
    color: #2a6abb; cursor: pointer; transition: all .15s; white-space: nowrap;
  }
  #chat-panel .cp-quick .cp-quick-btn:hover { background: rgba(74,158,255,0.18); }
  #chat-panel .cp-input-row {
    display: flex; gap: 8px; padding: 10px 12px 12px;
    border-top: 1px solid rgba(100,130,180,0.1);
    background: rgba(255,255,255,0.4); align-items: flex-end;
  }
  #chat-panel #pet-chat-input {
    flex: 1; padding: 9px 12px; border-radius: 12px;
    border: 1px solid rgba(100,130,180,0.15); background: rgba(255,255,255,0.8);
    color: #2a3a5c; outline: none; font-size: 13px; font-family: inherit;
    resize: none; min-height: 36px; max-height: 80px; line-height: 1.4;
    transition: border-color .15s;
  }
  #chat-panel #pet-chat-input:focus { border-color: rgba(74,158,255,0.5); }
  #chat-panel #pet-chat-input::placeholder { color: #9aaccc; }
  #chat-panel .cp-input-btn {
    width: 36px; height: 36px; border-radius: 10px; border: none;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    font-size: 16px; transition: all .15s; flex: none;
  }
  #chat-panel #pet-chat-emoji { background: rgba(100,130,180,0.1); color: #5a7aaa; }
  #chat-panel #pet-chat-emoji:hover { background: rgba(100,130,180,0.2); }
  #chat-panel #pet-chat-send {
    background: linear-gradient(135deg, #4a9eff, #5aa8ff); color: #fff;
    box-shadow: 0 2px 8px rgba(74,158,255,0.3);
  }
  #chat-panel #pet-chat-send:hover { filter: brightness(1.1); transform: scale(1.05); }
  #chat-panel .cp-emoji-panel {
    display: none; padding: 8px 12px; gap: 6px; flex-wrap: wrap;
    border-top: 1px solid rgba(100,130,180,0.1); background: rgba(255,255,255,0.5);
    max-height: 100px; overflow-y: auto;
  }
  #chat-panel .cp-emoji-panel.show { display: flex; }
  #chat-panel .cp-emoji-panel .cp-emoji-item {
    font-size: 18px; cursor: pointer; padding: 3px 6px; border-radius: 8px; transition: background .15s;
  }
  #chat-panel .cp-emoji-panel .cp-emoji-item:hover { background: rgba(74,158,255,0.15); }
  /* 消息流内可点选项（N.E.K.O 选择项聊天） */
  #chat-panel .cp-msg-options { display: flex; flex-direction: column; gap: 5px; padding: 0 12px 2px 44px; }
  #chat-panel .cp-opt-btn { text-align: left; padding: 6px 11px; border-radius: 10px; font-size: 12px; cursor: pointer;
    border: 1px solid rgba(74,158,255,0.3); background: rgba(74,158,255,0.07); color: #2a6abb; transition: all .15s; }
  #chat-panel .cp-opt-btn:hover { background: rgba(74,158,255,0.16); transform: translateX(2px); }
  /* 聊天框内 朋友圈/剧场/日报 生活视图 */
  #chat-panel #chat-life-view { display: none; min-height: 200px; max-height: 340px; flex-direction: column; overflow: hidden; }
  #chat-panel #chat-life-view.show { display: flex; }
  #chat-life-view .clv-head { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-bottom: 1px solid rgba(100,130,180,.12); font-weight: 700; font-size: 13px; color: #1a2a4c; }
  #chat-life-view .clv-back, #chat-life-view .clv-open-main { border: none; background: rgba(100,130,180,.14); border-radius: 8px; width: 28px; height: 28px; cursor: pointer; font-size: 15px; color: #2a6abb; }
  #chat-life-view .clv-back:hover, #chat-life-view .clv-open-main:hover { background: rgba(74,158,255,.22); }
  #chat-life-view .clv-title { flex: 1; }
  #chat-life-view .clv-list { flex: 1; overflow-y: auto; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; background: rgba(255,255,255,.3); }
  #chat-life-view .clv-item { background: rgba(255,255,255,.78); border: 1px solid rgba(100,130,180,.14); border-radius: 12px; padding: 9px 11px; }
  #chat-life-view .clv-item-head { font-weight: 600; font-size: 12.5px; color: #1a2a4c; margin-bottom: 3px; }
  #chat-life-view .clv-item-meta { font-size: 10.5px; color: #8a9aba; margin-bottom: 4px; }
  #chat-life-view .clv-item-body { font-size: 12px; color: #3a4a6c; line-height: 1.55; white-space: pre-wrap; }
  #chat-life-view .clv-empty, #chat-life-view .clv-loading { text-align: center; color: #8a9aba; font-size: 12px; padding: 34px 10px; }
  #chat-panel .cp-btn#chat-life { font-size: 13px; }

  /* ═══════ 模型旁工具栏 ═══════ */
  #neko-toolbar {
    position: fixed; z-index: 58; display: flex; flex-direction: column; gap: 6px;
    pointer-events: auto;
    padding: 6px 4px;
    background: rgba(30,40,70,0.35); backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.15); border-radius: 22px;
    box-shadow: 0 4px 16px rgba(20,30,60,0.25);
    transition: opacity .35s cubic-bezier(.4,0,.2,1),
                padding .35s cubic-bezier(.4,0,.2,1),
                gap .35s cubic-bezier(.4,0,.2,1),
                width .35s cubic-bezier(.4,0,.2,1);
    overflow: hidden;
  }
  #neko-toolbar .tb-btn, #neko-toolbar .tb-sep {
    transition: opacity .3s ease, max-height .4s cubic-bezier(.4,0,.2,1),
                transform .35s cubic-bezier(.4,0,.2,1),
                margin .35s ease, padding .35s ease;
    transform-origin: center center;
  }
  #neko-toolbar.collapsed .tb-btn:not(.tb-collapse),
  #neko-toolbar.collapsed .tb-sep {
    opacity: 0; max-height: 0; margin: 0; padding: 0;
    transform: scale(0.2) rotate(-20deg); pointer-events: none;
    overflow: hidden; border-width: 0;
  }
  #neko-toolbar.collapsed { padding: 4px; gap: 0; }
  /* 收缩时逐个按钮延迟消失，展开时逐个出现 */
  #neko-toolbar.collapsed .tb-btn:nth-child(2) { transition-delay: 0ms; }
  #neko-toolbar.collapsed .tb-btn:nth-child(4) { transition-delay: 30ms; }
  #neko-toolbar.collapsed .tb-btn:nth-child(5) { transition-delay: 60ms; }
  #neko-toolbar.collapsed .tb-btn:nth-child(6) { transition-delay: 90ms; }
  #neko-toolbar.collapsed .tb-btn:nth-child(7) { transition-delay: 120ms; }
  #neko-toolbar.collapsed .tb-btn:nth-child(9) { transition-delay: 150ms; }
  #neko-toolbar.collapsed .tb-btn:nth-child(10) { transition-delay: 180ms; }
  #neko-toolbar.collapsed .tb-btn:nth-child(11) { transition-delay: 210ms; }
  #neko-toolbar.collapsed .tb-btn:nth-child(12) { transition-delay: 240ms; }
  #neko-toolbar:not(.collapsed) .tb-btn:nth-child(2) { transition-delay: 200ms; }
  #neko-toolbar:not(.collapsed) .tb-btn:nth-child(4) { transition-delay: 170ms; }
  #neko-toolbar:not(.collapsed) .tb-btn:nth-child(5) { transition-delay: 140ms; }
  #neko-toolbar:not(.collapsed) .tb-btn:nth-child(6) { transition-delay: 110ms; }
  #neko-toolbar:not(.collapsed) .tb-btn:nth-child(7) { transition-delay: 80ms; }
  #neko-toolbar:not(.collapsed) .tb-btn:nth-child(9) { transition-delay: 50ms; }
  #neko-toolbar:not(.collapsed) .tb-btn:nth-child(10) { transition-delay: 30ms; }
  #neko-toolbar:not(.collapsed) .tb-btn:nth-child(11) { transition-delay: 10ms; }
  #neko-toolbar:not(.collapsed) .tb-btn:nth-child(12) { transition-delay: 0ms; }
  .tb-collapse svg { transition: transform .4s cubic-bezier(.4,0,.2,1); }
  #neko-toolbar.collapsed .tb-collapse svg { transform: rotate(180deg); }
  #tb-collapsed {
    position: fixed; z-index: 58; width: 36px; height: 36px; border-radius: 50%;
    background: rgba(30,40,70,0.55); backdrop-filter: blur(8px);
    border: 1.5px solid rgba(255,255,255,0.2); color: #fff;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    font-size: 18px; pointer-events: auto;
    transition: all .3s cubic-bezier(.34,1.56,.64,1);
    animation: tb-pop .4s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes tb-pop {
    0% { transform: scale(0) rotate(-180deg); opacity: 0; }
    100% { transform: scale(1) rotate(0deg); opacity: 1; }
  }
  #tb-collapsed:hover { background: rgba(74,158,255,0.55); transform: scale(1.15) rotate(10deg); }
  .tb-btn {
    width: 36px; height: 36px; border-radius: 50%;
    border: 1.5px solid rgba(255,255,255,0.2);
    background: rgba(40,50,80,0.5); color: #fff;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: all .18s ease; position: relative;
  }
  .tb-btn:hover { background: rgba(74,158,255,0.55); border-color: rgba(160,210,255,0.7); transform: scale(1.1); }
  .tb-btn:active { transform: scale(0.92); }
  .tb-btn.active { background: linear-gradient(135deg, #4a9eff, #6bb5ff); border-color: rgba(160,210,255,0.9); box-shadow: 0 0 10px rgba(74,158,255,0.5); }
  .tb-btn svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .tb-btn .tb-badge {
    position: absolute; top: -1px; right: -1px; width: 9px; height: 9px;
    border-radius: 50%; background: #ff5555; border: 1.5px solid rgba(30,40,70,0.6);
  }
  .tb-sep { width: 22px; height: 1px; background: rgba(255,255,255,0.12); margin: 1px auto; }
  .tb-play {
    position: absolute; right: -5px; top: -5px; width: 17px; height: 17px;
    border-radius: 50%; background: linear-gradient(135deg, #4a9eff, #6bb5ff);
    border: 1.5px solid rgba(255,255,255,0.3); display: flex; align-items: center; justify-content: center;
    cursor: pointer;
  }
  .tb-play svg { width: 8px; height: 8px; fill: #fff; stroke: none; }
  .tb-collapse svg { width: 16px; height: 16px; }

  /* ═══════ N.E.K.O 风格弹出面板 ═══════ */
  .nk-panel {
    position: fixed; z-index: 57; min-width: 240px;
    background: rgba(200,215,240,0.88); backdrop-filter: blur(14px);

/* ── IPC 探测 ────────────────────────────────────────────── */
let ipc = null;

if (!ipc && window.require) { try { ipc = window.require('electron').ipcRenderer; } catch (e) {} }

  bubbles: true, nekoSounds: true, proactive: true, allowInterrupt: true, maxTokens: 300,

};

  if (app && app.ticker) app.ticker.maxFPS = prefs.fps || 0;
  const tag = document.getElementById('name-tag');
  if (tag) tag.style.display = (prefs.catpaw && prefs.catpaw.hud === false) ? 'none' : '';

  const tbSs = document.getElementById('tb-screenshare');
  const tbMic = document.getElementById('tb-mic');
  if (tbSs) tbSs.classList.toggle('active', !!prefs.screenShare);
  if (tbMic) tbMic.classList.toggle('active', !!prefs.voiceRecognition);
  // 锁定图标
  updateLockIcon();
  // 悬停淡化
  applyHoverFade();
  // 注意：不在此处 refreshPanels()，否则用户拖动滑块/切换开关时面板会被重建导致中断
}

  ipc.invoke('pet:prefs').then(p => {
    if (!p) return;
    prefs = Object.assign(prefs, p);
    prefs.catpaw = Object.assign({ master: false, kbm: false, browser: false, perception: true, hud: true, desktop: false, plugins: false }, p.catpaw || {});

  ipc.on('pet:prefs-changed', (_e, p) => {
    if (!p) return;
    prefs = Object.assign(prefs, p);

/* ── 🫀 v0.2 生命表演引擎（pet-life.js）：统一情绪软组织 / 五元音口型 / 分层微表情 / 表演 DSL ──
   引擎每帧只接管现有 focus/idle/motion 没有驱动的「软组织」（眉、嘴角、眼笑、五元音、脸颊、肩）；
   头角 / 眼球 / 眼开闭 / 身体角度仍走原有 focusController 与 motion3，互不打架。 */
let lifeEngine = null;
let _speechAnalyser = null, _speechBuf = null;
const LIFE_SOFT_PARAMS = new Set([
  'ParamBrowLY','ParamBrowRY','ParamBrowLX','ParamBrowRX','ParamBrowLAngle','ParamBrowRAngle','ParamBrowLForm','ParamBrowRForm',
  'ParamEyeLSmile','ParamEyeRSmile',
  'ParamA','ParamI','ParamU','ParamE','ParamO','ParamMouthUp','ParamMouthDown','ParamMouthAngry',
  'ParamCheek','ParamLeftShoulderUp','ParamRightShoulderUp'
]);
const LIFE_EFFECT_PARAMS = {
  heart: ['ParamHeartMissOn','ParamHeartBackMissOn'],
  sparkle: ['ParamHeartLightOn'], stars: ['ParamHeartLightOn'],
  aura: ['ParamAuraOn'], heal: ['ParamHeartHealOn'],
  smoke: ['ParamSmokeOn'], ink: ['ParamInkDropOn'], rabbit: ['ParamRabbitAppearance']
};
function initLifeEngine() {
  try {
    if (window.LuminaLife && window.LuminaLife.PetPerformanceEngine) {
      lifeEngine = new window.LuminaLife.PetPerformanceEngine();
      lifeEngine.setBlinkEnabled(false); // 眨眼交给模型 idle motion / 现有 doBlink
      if (state && state.mood) lifeEngine.setMood(state.mood, performance.now());
      console.log('[PetLife] 表演引擎已初始化');
    } else {
      console.warn('[PetLife] pet-life.js 未加载，软组织表演不可用');
    }
  } catch (e) { console.warn('[PetLife] 引擎初始化失败:', e); }
}
function lifeFrame(now) {
  if (!lifeEngine || !model) return;
  try {
    if (_speechAnalyser && _speechBuf) {
      _speechAnalyser.getByteTimeDomainData(_speechBuf);
      let sum = 0;
      for (let i = 0; i < _speechBuf.length; i++) { const x = (_speechBuf[i] - 128) / 128; sum += x * x; }
      const rms = Math.sqrt(sum / _speechBuf.length);
      lifeEngine.setSpeechLevel(rms > 0.02 ? Math.min(1, rms * 2.4) : 0);
    }
    const patches = lifeEngine.update(now);
    for (const p of patches) if (LIFE_SOFT_PARAMS.has(p.id)) setParam(p.id, p.value);
  } catch (e) {}
}
function _lifeGesture(name) {
  switch (name) {
    case 'wave': doWave(); break;
    case 'nod': doNod(2); break;
    case 'shake': doShake(2); break;
    case 'think': doThink(); break;
    case 'clap': doClap(); break;
    case 'dance': doDance(); break;
    case 'happy': doHappy(); break;
    case 'surprised': doSurprised(); break;
    case 'sleep': setSleep(); break;
    case 'wake': setWake(); break;
    case 'walk': walk(1); break;
    case 'idle': resetPoseParams(); break;
    default: return false;
  }
  return true;
}
function lifePerform(dsl) {
  if (!lifeEngine || !dsl) return;
  try {
    const hints = lifeEngine.perform(dsl, performance.now());
    if (hints.gesture && hints.builtin && _lifeGesture(hints.gesture)) markActionBusy(1800);
    if (hints.effect) {
      const ids = LIFE_EFFECT_PARAMS[hints.effect.name] || [];
      const dur = 1600;
      ids.forEach(id => { setParam(id, hints.effect.amount); setTimeout(() => setParam(id, 0), dur); });
    }
    if (hints.motion) { try { playBuiltinMotion(hints.motion, 0); markActionBusy(1800); } catch (e) {} }
  } catch (e) {}
}

/* ── 👀 注视系统：回归 pixi-live2d-display 标准链路（对齐 N.E.K.O 的 model.focus 与 AIRI 的柔和幅度/空闲眼动）──
   不再用 setParam 覆盖眼球和头，而是把鼠标方向交给 model.focus → FocusController 做带加减速、
   帧率无关的惯性插值 → Cubism InternalModel 每帧用 addParameterValueById 把“同一个焦点”叠加到
   眼球(EyeBallX/Y)、头(AngleX/Y/Z)、身体(BodyAngleX)。眼头身天然协同、与呼吸/待机动作叠加而不打架。 */
const GAZE_AMP = 0.55;          // 注视幅度（AIRI 取 0.5；桌宠 0.5~0.6 最自然：看得出来又不会一直瞪眼/歪头）
const GAZE_IDLE_MS = 800;       // 鼠标静止多久后进入空闲（平滑回中 / 偶尔轻飘一眼）
const gazeState = { lastMove: 0, nextIdle: 0 };
function focusControllerOf() { return (model && model.internalModel) ? model.internalModel.focusController : null; }
// 模型“眼睛”在画布里的纵向位置（相对模型几何中心上移的比例，占显示高度）：
// Mao 是半身立绘（眼睛接近画布中部）。
const GAZE_HEAD_RATIO = { Mao: 0.08 };
const GAZE_DEAD_PX = 26; // 固定屏幕像素死区（不再按模型尺寸，避免全身立绘死区过大、看起来不跟随）
// 鼠标移动：以模型“眼睛”为参考点算方位，喂给 FocusController（仍走 pixi 标准惯性 + 每帧叠加链路）
function driveGaze(clientX, clientY) {
  if (!model) return;
  const fc = focusControllerOf(); if (!fc) return;
  const now = performance.now();
  gazeState.lastMove = now; gazeState.nextIdle = now + 1400;
  const headRatio = GAZE_HEAD_RATIO[state.name] != null ? GAZE_HEAD_RATIO[state.name] : 0.12;
  const eyeX = model.x;
  const eyeY = model.y - Math.abs(model.height || 1) * headRatio;
  const dx = clientX - eyeX, dy = clientY - eyeY;
  if (Math.hypot(dx, dy) < GAZE_DEAD_PX) { fc.focus(0, 0, false); return; }
  // 与打包版 pixi-live2d-display 的 model.focus 同约定：atan2(屏幕dy, dx)，第二参对 sin 取反；
  // atan2 内不能再对 dy 取反，否则纵向反向（上下看反、左右正常）。
  const ang = Math.atan2(dy, dx);
  fc.focus(Math.cos(ang) * GAZE_AMP, -Math.sin(ang) * GAZE_AMP, false);
}
// 每帧：鼠标静止后平滑回中，并偶尔轻轻飘一眼（saccade），让角色像活人一样有神
function gazeFrame() {
  const fc = focusControllerOf(); if (!fc) return;
  const now = performance.now();
  if (now - gazeState.lastMove < GAZE_IDLE_MS) return;
  if (now < gazeState.nextIdle) return;
  if (Math.random() < 0.32) {
    fc.focus((Math.random() * 2 - 1) * 0.16, (Math.random() * 2 - 1) * 0.12 - 0.04, false);
  } else { fc.focus(0, 0, false); }
  gazeState.nextIdle = now + 1600 + Math.random() * 2600;
}
function gazeCenter() { const fc = focusControllerOf(); if (fc) fc.focus(0, 0, false); }

let userScale = 1;
function fitScale() {
  const fitH = Math.max(innerHeight * 0.62, 100);
  const fitW = Math.max(innerWidth * 0.5, 100);
  return Math.min(fitH / state.naturalH, fitW / state.naturalW);
}
function applyScale() { if (!model) return; model.scale.set(fitScale() * userScale); clampPosition(); }
let _persistScaleTimer = null;
function setUserScale(v, persist) {
  userScale = Math.min(1.6, Math.max(0.4, v));
  applyScale();
  if (persist && HAS_IPC) {
    clearTimeout(_persistScaleTimer);
    _persistScaleTimer = setTimeout(() => {
      ipc.invoke('pet:update-config', { scale: Math.round(userScale * 100) / 100 }).catch(() => {});
    }, 400);
  }
}
function modelHalfW() { return Math.abs(model ? model.width : 0) / 2; }
function groundY() { return innerHeight - 6 - Math.abs(model.height) / 2; }
function clampPosition() {
  if (!model) return;
  const hw = modelHalfW() + 4;
  if (model.x < hw) model.x = hw;
  else if (model.x > innerWidth - hw) model.x = innerWidth - hw;
  if (!state.floating) { state.floatY = groundY(); model.y = state.floatY; }
  else { const hh = Math.abs(model.height) / 2 + 4; state.floatY = Math.min(innerHeight - hh, Math.max(hh, state.floatY)); }
}
function positionOverlays() {
  if (!model) return;
  const hw = modelHalfW();
  const modelTop = model.y - Math.abs(model.height) / 2;
  const modelBottom = model.y + Math.abs(model.height) / 2;

  // 对话气泡 — 模型头顶上方
  const b = document.getElementById('speech-bubble');
  if (b) {
    const _bw = b.offsetWidth || 80;
    b.style.left = Math.max(_bw / 2 + 8, Math.min(innerWidth - _bw / 2 - 8, model.x)) + 'px';
    b.style.top = Math.max(6, modelTop - (b.offsetHeight || 24) - 10) + 'px';
    b.style.transform = 'translateX(-50%)';
  }

  // 情绪气泡 — 模型头顶更上方
  const eb = document.getElementById('emotion-bubble');
  if (eb) {
    eb.style.left = model.x + 'px';
    eb.style.top = Math.max(6, modelTop - 22) + 'px';
    eb.style.transform = 'translateX(-50%)';
  }

  // 名称标签 — 模型脚下
  const nt = document.getElementById('name-tag');
  if (nt) {
    nt.style.left = model.x + 'px';
    nt.style.top = Math.min(innerHeight - 20, modelBottom + 4) + 'px';
    nt.style.transform = 'translateX(-50%)';
  }

  positionToolbar();
  positionProactiveCard();
}

/* 工具栏跟随模型定位（模型右侧，空间不够则左侧） */
function positionToolbar() {
  const tb = document.getElementById('neko-toolbar');
  const collapsed = document.getElementById('tb-collapsed');
  if (!tb || !model) return;
  const isCollapsed = tb.classList.contains('collapsed');
  if (isCollapsed) {
    tb.style.display = 'none';
    collapsed.style.display = 'flex';
  } else {
    tb.style.display = 'flex';
    collapsed.style.display = 'none';
  }
  const activeEl = isCollapsed ? collapsed : tb;
  const tbW = activeEl.offsetWidth || 46;
  const tbH = activeEl.offsetHeight || 300;
  const hw = modelHalfW();
  const modelTop = model.y - Math.abs(model.height) / 2;
  let y = modelTop + Math.abs(model.height) * 0.18;
  y = Math.max(8, Math.min(innerHeight - tbH - 8, y));
  const gap = 12;
  let x = model.x + hw + gap;
  if (x + tbW > innerWidth - 8) x = model.x - hw - tbW - gap;
  x = Math.max(8, x);
  activeEl.style.left = x + 'px';
  activeEl.style.top = y + 'px';
  // 面板打开时跟随重新定位
  document.querySelectorAll('.nk-panel.show').forEach(p => {
    const btnId = p.dataset.anchor;
    if (btnId) { const btn = document.getElementById(btnId); if (btn) positionPanel(p, btn); }
  });
}

  setParam('ParamAngleX', cfg.angleX);

function say(text) {
  let t = text || SPEECH_POOL[Math.floor(Math.random() * SPEECH_POOL.length)];
  if (prefs.nekoSounds !== false && Math.random() < 0.3 && !/喵/.test(t)) t += ' 喵~';
  if (prefs.bubbles !== false) {
    const b = document.getElementById('speech-bubble');
    if (b) {
      b.textContent = t; b.classList.add('show');
      if (typeof positionOverlays === 'function') requestAnimationFrame(() => { try { positionOverlays(); } catch (e) {} });
      clearTimeout(window._sp);
      window._sp = setTimeout(() => b.classList.remove('show'), 4000);
    }
  }
  speakTts(t);
}

function showProactiveCard(cmd) {

  const text = (cmd && cmd.text || '').trim();

  const opts = Array.isArray(cmd.options) ? cmd.options.slice(0, 3).filter(x => typeof x === 'string' && x.trim()) : [];

  if (opts.length) addChatOptions(opts);

  if (!chatLog) return;
  const wrap = document.createElement('div');
  wrap.className = 'cp-msg-options';
  (options || []).slice(0, 3).forEach(function(o, i){

/* ── AI 语音 ─────────────────────────────────────────────── */
let _audioCtx = null, _lastSpeakAt = 0;
async function speakTts(text) {
  if (!HAS_IPC || prefs.voiceOn !== true) return;
  if (!text || text.length > 40) return;
  const now = Date.now();
  if (now - _lastSpeakAt < 4000) return;
  _lastSpeakAt = now;

  const engine = prefs.ttsEngine || 'edge-tts';
  if (engine === 'indextts') {
    // IndexTTS-2.5 本地服务
    try {
      const res = await fetch('http://127.0.0.1:18927/tts', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text, lang: 'ZH' }),
        signal: AbortSignal.timeout(30000),
      });
      if (res.ok) {
        const data = await res.json();
        if (data.audio) {
          // hex → WAV ArrayBuffer → blob URL
          const hex = data.audio;
          const bytes = new Uint8Array(hex.length / 2);
          for (let i = 0; i < bytes.length; i++) bytes[i] = parseInt(hex.substr(i * 2, 2), 16);
          const blob = new Blob([bytes], { type: 'audio/wav' });
          playAudioDataUrl(URL.createObjectURL(blob), text);
          return;
        }
      }
    } catch (e) {
      console.warn('[TTS] IndexTTS 失败，降级到 Edge-TTS:', e.message);
    }
  }

  // Edge-TTS（默认/降级）
  ipc.invoke('edge-tts:speak', { text }).then(res => {
    if (res && res.audio) playAudioDataUrl(res.audio, text);
  }).catch(() => {});
}
function playAudioDataUrl(url, text) {
  try {
    _audioCtx = _audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const ctx = _audioCtx;
    if (ctx.state === 'suspended') ctx.resume();
    fetch(url).then(r => r.arrayBuffer()).then(buf => ctx.decodeAudioData(buf)).then(audio => {
      const src = ctx.createBufferSource(); src.buffer = audio;
      const gain = ctx.createGain(); gain.gain.value = (Number(prefs.volume) || 100) / 100;
      src.connect(gain); let out = gain;
      if (prefs.spatial !== false && model && ctx.createStereoPanner) {
        const pan = ctx.createStereoPanner();
        pan.pan.value = Math.max(-0.8, Math.min(0.8, (model.x / innerWidth) * 2 - 1));
        gain.connect(pan); out = pan;
      }
      out.connect(ctx.destination);
      // 👄 v0.2 五元音口型：文本给元音形状，Analyser 实时电平给张度，结束自动闭嘴
      try {
        if (lifeEngine) lifeEngine.speak(text || '', performance.now());
        const an = ctx.createAnalyser(); an.fftSize = 512; src.connect(an);
        _speechAnalyser = an; _speechBuf = new Uint8Array(an.fftSize);
        src.onended = function () {
          if (_speechAnalyser === an) { _speechAnalyser = null; _speechBuf = null; }
          try { if (lifeEngine) lifeEngine.stopSpeak(performance.now()); } catch (e) {}
        };
      } catch (e) {}
      src.start();
    }).catch(() => {});
  } catch (e) {}
}

function walk(dir) {
  if (state.locked) return; // 锁定时不移动
  if (state.floating) { state.floating = false; state.floatY = groundY(); }
  state.walking = true;
  const hw = modelHalfW() + 8;
  state.targetX = Math.min(innerWidth - hw, Math.max(hw, model.x + dir * (60 + Math.random() * 80)));
  const s = Math.abs(model.scale.x); model.scale.x = dir > 0 ? s : -s;
  sendEvent('walk-start');
}
function emote(i) {
  markActionBusy(2500);
  // 优先用检测到的动作组，回退到默认 MOTION_GROUPS
  const groups = Object.keys(modelMotions).length > 0 ? Object.keys(modelMotions) : MOTION_GROUPS;
  const grp = groups[Math.floor(Math.random() * groups.length)];
  const cnt = modelMotions[grp] || 10;
  try { model.motion(grp, (Number(i) || 0) % cnt); } catch (e) {}
}
function localIntent() {
  const stayPlaced = state.floating || Date.now() - state.lastPlaceAt < 60_000;
  const r = Math.random();
  if (r < 0.30 && !stayPlaced) return { action: 'walk', dir: Math.random() < 0.5 ? -1 : 1 };
  if (r < 0.60) return { action: 'emote', motion: Math.floor(Math.random() * 10) };
  if (r < 0.85) return { action: 'say' };
  return { action: 'idle' };
}

const ACTION_DEBOUNCE = 180;
let _lastActionAt = 0;
function _canAct() { const now = Date.now(); if (now - _lastActionAt < ACTION_DEBOUNCE) return false; _lastActionAt = now; return true; }

const tweens = [];
function animateParam(id, to, dur, cb) {
  const from = (() => { try { return model.internalModel.coreModel.getParameterValueById(id); } catch (e) { return 0; } })();
  tweens.push({ id, from, to, start: Date.now(), dur: dur || 500, cb });
}
function tickTweens() {
  if (!model) { tweens.length = 0; return; }
  for (let i = tweens.length - 1; i >= 0; i--) {
    const t = tweens[i];
    const p = Math.min(1, (Date.now() - t.start) / t.dur);
    const eased = p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;
    const v = t.from + (t.to - t.from) * eased;
    setParam(t.id, v);
    if (p >= 1) { tweens.splice(i, 1); if (t.cb) t.cb(); }
  }
}
function resetPoseParams() { ['ParamAngleX', 'ParamAngleY', 'ParamAngleZ'].forEach(id => animateParam(id, 0, 400)); }

function doNod(times) {
  if (!_canAct()) return;
  const n = Math.min(6, times || 2); let i = 0;
  const step = () => { if (i >= n) { animateParam('ParamAngleY', 0, 200); resetPoseParams(); return; } const target = i % 2 === 0 ? 8 : -8; animateParam('ParamAngleY', target, 180, step); i++; };
  step();
}
function doShake(times) {
  if (!_canAct()) return;
  const n = Math.min(4, times || 2); let i = 0;
  const step = () => { if (i >= n) { animateParam('ParamAngleX', 0, 200); resetPoseParams(); return; } const target = i % 2 === 0 ? 10 : -10; animateParam('ParamAngleX', target, 160, step); i++; };
  step();
}
function doThink() {
  if (!_canAct()) return;
  animateParam('ParamAngleZ', -14, 350); animateParam('ParamAngleY', 5, 350);
  setTimeout(() => resetPoseParams(), 1800);
}
function doWave() {
  if (!_canAct()) return;
  markActionBusy(1000);
  // 尝试播放内置动作
  playRandomMotion('TapBody');
  animateParam('ParamBodyAngleZ', 14, 200); animateParam('ParamAngleZ', 10, 200);
  setTimeout(() => { animateParam('ParamBodyAngleZ', -14, 200); animateParam('ParamAngleZ', -8, 200); }, 240);
  setTimeout(() => { animateParam('ParamBodyAngleZ', 12, 200); }, 480);
  setTimeout(() => { animateParam('ParamBodyAngleZ', 0, 260); animateParam('ParamAngleZ', 0, 260); }, 720);
}
function doHappy() {
  if (!_canAct()) return;
  markActionBusy(1500);
  applyEmotion('超开心 🎉'); setFace('joy');
  // 尝试播放内置动作（如果模型有）
  playRandomMotion('TapBody');
  // 连续跳两下
  state.jumpStart = Date.now(); state.jumpEnd = Date.now() + 500;
  setTimeout(() => { state.jumpStart = Date.now(); state.jumpEnd = Date.now() + 500; }, 550);
  // 身体摇摆
  animateParam('ParamBodyAngleZ', 12, 200);
  setTimeout(() => animateParam('ParamBodyAngleZ', -12, 200), 250);
  setTimeout(() => animateParam('ParamBodyAngleZ', 8, 200), 500);
  setTimeout(() => animateParam('ParamBodyAngleZ', 0, 300), 750);
  if (prefs.dropEffects) spawnDropEffect();
}
function doSurprised() {
  if (!_canAct()) return;
  markActionBusy(900);
  applyEmotion('兴奋 🤩'); setFace('surprise');
  animateParam('ParamAngleZ', 0, 100);
  animateParam('ParamBodyAngleZ', 0, 100);
  // 身体后倾
  animateParam('ParamAngleX', -8, 200);
  setTimeout(() => animateParam('ParamAngleX', 0, 400), 600);
}
function doDance() {
  if (!_canAct()) return;
  markActionBusy(2000);
  applyEmotion('超开心 🎉'); setFace('joy');
  // 尝试播放内置动作
  playRandomMotion('TapBody');
  let count = 0;
  const danceStep = () => {
    if (count >= 4) { animateParam('ParamBodyAngleZ', 0, 300); animateParam('ParamAngleZ', 0, 300); return; }
    const dir = count % 2 === 0 ? 15 : -15;
    animateParam('ParamBodyAngleZ', dir, 200);
    animateParam('ParamAngleZ', dir * 0.5, 200);
    state.jumpStart = Date.now(); state.jumpEnd = Date.now() + 200;
    count++;
    setTimeout(danceStep, 250);
  };
  danceStep();
}
function doClap() {
  if (!_canAct()) return;
  markActionBusy(1200);
  applyEmotion('开心 😊');
  // 尝试播放内置拍手动作
  try { model.motion('TapBody', 0); } catch (e) {}
  animateParam('ParamAngleZ', 8, 200);
  setTimeout(() => animateParam('ParamAngleZ', -8, 200), 300);
  setTimeout(() => animateParam('ParamAngleZ', 0, 300), 600);
}
function setSleep(customText) {
  animateParam('ParamEyeLOpen', 0, 800); animateParam('ParamEyeROpen', 0, 800);
  state.sleeping = true; say(customText || '呼噜呼噜…');
}
function setWake(customText) {
  animateParam('ParamEyeLOpen', 1, 500); animateParam('ParamEyeROpen', 1, 500);
  state.sleeping = false; document.body.style.opacity = '1'; resetPoseParams(); say(customText || '唔…醒啦！');
}
function doBlink() {
  animateParam('ParamEyeLOpen', 0, 90); animateParam('ParamEyeROpen', 0, 90);
  setTimeout(() => { animateParam('ParamEyeLOpen', 1, 140); animateParam('ParamEyeROpen', 1, 140); }, 110);
}

const FACE_EXPR_MAP = { happy: 'exp_02', sad: 'exp_05', angry: 'exp_08', joy: 'exp_04', blush: 'exp_06', surprise: 'exp_07', calm: 'exp_01', shy: 'exp_03' };
function setFace(exprName) {
  const exprId = FACE_EXPR_MAP[exprName] || (typeof exprName === 'string' && exprName.startsWith('exp_') ? exprName : null);
  if (!exprId) return;
  try { if (model.internalModel?.coreModel?.setExpression) model.internalModel.coreModel.setExpression(exprId); } catch (e) {}
}

/* ═══════ 🎬 内置动作系统（LLM 驱动 Live2D 原生 motion）═══════ */
let modelMotions = {};   // { groupName: count }
let modelHasExpr = false;
let _idleMotionTimer = null;
let _actionBusyUntil = 0;

/** 检测模型支持的动作组和表情 */
function detectModelCapabilities() {
  modelMotions = {};
  modelHasExpr = false;
  if (!model) return;
  try {
    const mm = model.internalModel?.motionManager;
    if (mm) {
      // pixi-live2d-display: motionManager.definitions 是数组
      const defs = mm.definitions || mm._definitions || [];
      if (Array.isArray(defs)) {
        for (const d of defs) {
          if (d && d.group != null) {
            const cnt = Array.isArray(d.motions) ? d.motions.length : (d.count || 1);
            modelMotions[d.group] = cnt;
          }
        }
      }
      // 兜底：从 settings.motions 读取
      if (Object.keys(modelMotions).length === 0) {
        const settings = model.internalModel?.settings;
        if (settings && settings.motions) {
          for (const [grp, arr] of Object.entries(settings.motions)) {
            modelMotions[grp] = Array.isArray(arr) ? arr.length : 1;
          }
        }
      }
    }
    // 检测表情支持
    const core = model.internalModel?.coreModel;
    if (core && typeof core.setExpression === 'function') {
      const exprCount = core.getExpressionCount ? core.getExpressionCount() : 0;
      modelHasExpr = exprCount > 0;
    }
  } catch (e) { console.warn('[Pet] 动作检测失败:', e); }
  console.log('[Pet] 模型能力:', { motions: modelMotions, expressions: modelHasExpr });
}

/** 安全播放内置动作 */
function playBuiltinMotion(group, index) {
  if (!model) return false;
  try {
    if (typeof model.motion === 'function') {
      model.motion(group, index);
      return true;
    }
  } catch (e) {}
  return false;
}

/** 从指定组随机播放一个动作 */
function playRandomMotion(group) {
  const cnt = modelMotions[group];
  if (!cnt) return false;
  return playBuiltinMotion(group, Math.floor(Math.random() * cnt));
}

/** 启动空闲动作循环（定期播放 Idle 组动作，让模型"活"起来） */
function startIdleMotionLoop() {
  if (_idleMotionTimer) clearInterval(_idleMotionTimer);
  const hasIdle = !!(modelMotions['Idle'] || modelMotions['']);
  if (!hasIdle) return;
  _idleMotionTimer = setInterval(() => {
    if (!model || state.sleeping || state.walking) return;
    if (Date.now() < _actionBusyUntil) return;  // 动作冷却中
    if (menuOpen || anyPanelOpen() || chatOpenNow()) return;
    // 优先 Idle 组，没有就用空名组
    const grp = modelMotions['Idle'] ? 'Idle' : '';
    playRandomMotion(grp);
  }, 6000 + Math.random() * 5000);  // 6~11 秒随机
}

/** 初始化动作系统（模型加载后调用） */
function initMotionSystem() {
  detectModelCapabilities();
  startIdleMotionLoop();
}

/** 标记动作忙碌时间（在此期间不插空闲动作） */
function markActionBusy(ms) { _actionBusyUntil = Date.now() + ms; }

/** 根据情绪设置面部表情（仅支持表情的模型生效） */
function applyMoodExpression(moodLabel) {
  if (!modelHasExpr) return;
  const map = {
    '超开心 🎉': 'joy', '兴奋 🤩': 'happy', '幸福 💖': 'blush', '开心 😊': 'happy',
    '闷闷不乐 😕': 'sad', '低落 😔': 'sad', '难过 😢': 'sad', '疲惫 😩': 'calm',
    '平静 😐': 'calm',
  };
  const face = map[moodLabel];
  if (face) setFace(face);
}

/* 自然微表情：偶尔眨眼/歪头 */
function naturalMicroExpression() {
  if (!model || state.sleeping || !prefs.naturalExpression) return;
  const r = Math.random();
  if (r < 0.5) doBlink();
  else if (r < 0.7) { animateParam('ParamAngleZ', (Math.random() - 0.5) * 6, 400); setTimeout(() => resetPoseParams(), 1200); }
}

function switchModel(modelName) {
  // 目前仅保留 Mao（虹色 Mao）一个 Live2D 模型
  const name = modelName === 'Mao' ? 'Mao' : null;
  if (!name || name === state.name) return;
  if (HAS_IPC) { ipc.invoke('pet:set-model', name).finally(() => location.reload()); }
  else location.reload();
}

function execIntent(it) {
  if (!it || !it.action) return;
  // 统一应用情绪
  if (it.mood) applyEmotion(it.mood);
  // 🎭 v0.2：大脑可给高层表演指令（表情/视线/手势/特效），由生命引擎安全解析
  if (it.performance) lifePerform(it.performance);
  const hasSpeech = it.speech && String(it.speech).trim();
  switch (it.action) {
    case 'walk':
      walk(it.dir || 1);
      if (hasSpeech) setTimeout(() => say(it.speech), 300);
      break;
    case 'emote':
      emote(it.motion || 0);
      if (hasSpeech) say(it.speech);
      break;
    case 'say':
      say(hasSpeech ? it.speech : undefined);
      break;
    case 'wave':
      doWave();
      if (hasSpeech) say(it.speech);
      break;
    case 'nod':
      doNod(it.times);
      if (hasSpeech) say(it.speech);
      break;
    case 'shake':
      doShake(it.times);
      if (hasSpeech) say(it.speech);
      break;
    case 'think':
      doThink();
      if (hasSpeech) say(it.speech);
      break;
    case 'sleep':
      state.sleeping = true;
      setSleep(hasSpeech ? it.speech : undefined);
      break;
    case 'wake':
      state.sleeping = false;
      setWake(hasSpeech ? it.speech : undefined);
      break;
    case 'happy':
      doHappy();
      if (hasSpeech) setTimeout(() => say(it.speech), 200);
      break;
    case 'sad':
      markActionBusy(1500);
      applyEmotion(it.mood || '难过 😢'); setFace('sad');
      playRandomMotion('Idle');
      if (hasSpeech) say(it.speech);
      break;
    case 'angry':
      markActionBusy(1500);
      applyEmotion(it.mood || '闷闷不乐 😕'); setFace('angry');
      playRandomMotion('Idle');
      if (hasSpeech) say(it.speech);
      break;
    case 'surprised':
      doSurprised();
      if (hasSpeech) say(it.speech);
      break;
    case 'dance':
      doDance();
      if (hasSpeech) setTimeout(() => say(it.speech), 200);
      break;
    case 'clap':
      doClap();
      if (hasSpeech) say(it.speech);
      break;
    case 'blink':
      doBlink();
      if (hasSpeech) say(it.speech);
      break;
    case 'perform':
        lifePerform(it.performance);
        if (hasSpeech) say(it.speech);
        break;
    case 'idle':
      state.walking = false; resetPoseParams();
      break;
    case 'set-model':
      switchModel(it.model);
      break;
    case 'operate':
      if (HAS_IPC && it.cu) ipc.invoke('pet:test-intent', { action: 'operate', cu: it.cu });
      break;
    default:
      if (hasSpeech) say(it.speech);
      break;
  }
}

let lastLLMActAt = 0;
let autonomyTimer = null;
function startAutonomyLoop() {
  if (autonomyTimer) clearInterval(autonomyTimer);
  autonomyTimer = setInterval(async () => {
    if (!model || state.sleeping) return;
    if (state.autoLevel === 'off') return;
    if (prefs.focusMode && document.hasFocus && !document.hasFocus()) return;
    if (Date.now() - lastLLMActAt < 20_000) return;
    if (menuOpen || anyPanelOpen() || chatOpenNow()) return;
    lastLLMActAt = Date.now();
    if (HAS_IPC) {
      try {
        const res = await ipc.invoke('pet:autonomy:tick');
        if (res && res.ok && res.intent && !res.skipped) {
          // pet:command 事件已经执行了 intent，这里不需要重复
        }
      } catch (e) {
        // LLM 失败时降级本地动作
        execIntent(localIntent());
      }
    } else {
      execIntent(localIntent());
    }
  }, 8000);
}
startAutonomyLoop();

/* ── 渲染循环 ────────────────────────────────────────────── */
function startRenderLoop() {
  app.ticker.add((dt) => {
    tickTweens();
    if (!model) return;
    lifeFrame(performance.now()); // 🫀 v0.2 软组织微表情/五元音口型每帧驱动
    // 🔒 锁定时强制固定位置（禁止任何移动，包括走路/浮动）
    if (state.locked) {
      model.x = state.lockedX; model.y = state.lockedY; state.walking = false;
      positionOverlays();
      return;
    }
    if (state.walking) {
      const dx = state.targetX - model.x;
      if (Math.abs(dx) < 3) { state.walking = false; sendEvent('walk-stop'); }
      else model.x += Math.sign(dx) * state.speed * dt;
      bobT += dt * 0.25;
    } else bobT += dt * 0.06;
    const hw = modelHalfW() + 4;
    if (model.x < hw) model.x = hw;
    else if (model.x > innerWidth - hw) model.x = innerWidth - hw;
    model.y += (state.floatY - model.y) * 0.25;
    if (state.walking) model.y += Math.sin(bobT) * 2;  // 仅走路时轻微起伏
    // 呼吸动画：仅在 prefs.breathing 开启时使用 ParamBreath（默认关闭，不再跳动）
    if (prefs.breathing) {
      try { setParam('ParamBreath', (Math.sin(bobT * 0.9) + 1) / 2); } catch (e) {}
    } else {
      try { setParam('ParamBreath', 0); } catch (e) {}
    }
    if (state.jumpEnd) {
      const now = Date.now();
      if (now < state.jumpEnd) {
        const jt = (now - state.jumpStart) / (state.jumpEnd - state.jumpStart);
        model.y -= Math.sin(Math.PI * Math.min(1, Math.max(0, jt))) * 70;
      } else state.jumpEnd = 0;
    }
    positionOverlays();
  });
}

/* ── 交互 & 穿透唤醒 ─────────────────────────────────────── */
let ctMode = true;
let menuOpen = false;
const lastMouse = { x: -1, y: -1 };

function overModel(x, y, pad) {
  if (!model) return false;
  const p = pad == null ? 60 : pad;
  const hw = modelHalfW() + p;
  const hh = Math.abs(model.height) / 2 + p;
  return x > model.x - hw && x < model.x + hw && y > model.y - hh && y < model.y + hh;
}

/* 检查鼠标是否在某个 DOM 元素上 */
function isMouseOverEl(el) {
  if (!el || lastMouse.x < 0) return false;
  const r = el.getBoundingClientRect();
  return lastMouse.x >= r.left && lastMouse.x <= r.right && lastMouse.y >= r.top && lastMouse.y <= r.bottom;
}

/* 检查是否有弹出面板打开 */
function anyPanelOpen() {
  return document.querySelectorAll('.nk-panel.show').length > 0;
}

/* 检查鼠标是否在任何 UI 元素上（工具栏/面板/聊天/菜单） */
function overAnyUI() {
  const toolbar = document.getElementById('neko-toolbar');
  const collapsed = document.getElementById('tb-collapsed');
  if (isMouseOverEl(toolbar)) return true;
  if (isMouseOverEl(collapsed)) return true;
  if (anyPanelOpen()) {
    for (const p of document.querySelectorAll('.nk-panel.show')) {
      if (isMouseOverEl(p)) return true;
    }
  }
  if (chatOpenNow() && isMouseOverEl(chatPanel)) return true;
  if (menuOpen && isMouseOverEl(petMenu)) return true;
  return false;
}

function inInteractiveZone() {
  if (!model) return true;
  if (dragging || chatDragOff) return true;
  if (menuOpen) return true;
  if (overAnyUI()) return true;
  return overModel(lastMouse.x, lastMouse.y, ctMode ? 36 : 72);
}

if (HAS_IPC) {
  let lastIgnore = null;
  document.addEventListener('mousemove', (e) => {
    lastMouse.x = e.clientX; lastMouse.y = e.clientY;
    // 眼神/头部跟随：交给 pixi 标准 focus 链路（全屏跟随，眼头身协同）
    if (model && !dragging && !state.walking) {
      if (prefs.mouseTrack !== false) driveGaze(e.clientX, e.clientY);
      else gazeCenter();
    }
    const ignore = (dragging || chatDragOff) ? false : !inInteractiveZone();
    if (ignore !== lastIgnore) {
      lastIgnore = ignore;
      ipc.send('pet:set-ignore-mouse', ignore);
      applyHoverFade();
    }
  });
}

/* ── 悬停淡化（已按用户要求禁用，模型始终保持不透明）────────── */
function applyHoverFade() {
  if (!model) return;
  document.body.style.opacity = '1';
}

/* ── 拖拽移动模型 ────────────────────────────────────────── */
let dragging = false, dragMoved = 0, dragOffX = 0, dragOffY = 0;
function fromUi(e) { return !!(e.target && e.target.closest && (e.target.closest('#chat-panel') || e.target.closest('#pet-menu') || e.target.closest('#neko-toolbar') || e.target.closest('#tb-collapsed') || e.target.closest('.nk-panel'))); }
document.getElementById('pet-container').addEventListener('mousedown', (e) => {
  if (e.button !== 0 || !model || menuOpen) return;
  if (fromUi(e)) return;
  if (!overModel(e.clientX, e.clientY)) return;
  if (state.locked) { say('我被固定住啦喵~'); return; }  // 🔒 锁定时禁止拖拽
  dragging = true; dragMoved = 0;
  dragOffX = e.clientX - model.x; dragOffY = e.clientY - model.y;
  state.walking = false;
  if (HAS_IPC && ctMode) ipc.send('pet:set-ignore-mouse', false);
});
document.addEventListener('mousemove', (e) => {
  if (!dragging || !model) return;
  dragMoved += Math.abs(e.movementX || 1) + Math.abs(e.movementY || 1);
  const hw = modelHalfW() + 4, hh = Math.abs(model.height) / 2 + 4;
  model.x = Math.min(innerWidth - hw, Math.max(hw, e.clientX - dragOffX));
  model.y = Math.min(innerHeight - hh, Math.max(hh, e.clientY - dragOffY));
  state.floatY = model.y;
  state.targetX = model.x;
});
document.addEventListener('mouseup', () => {
  if (!dragging) return;
  dragging = false;
  if (dragMoved > 4) {
    state.floating = model.y < groundY() - 24;
    if (!state.floating) state.floatY = groundY();
    state.lastPlaceAt = Date.now();
    sendEvent('drag-end');
  }
});

document.getElementById('pet-container').addEventListener('click', (e) => {
  if (menuOpen) return;
  if (fromUi(e)) return;
  if (dragMoved > 4) return;
  if (chatJustDragged) return;  // 刚拖完聊天框，不触发
  if (!overModel(e.clientX, e.clientY)) return;
  toggleChat();

const chatPanel = document.getElementById('chat-panel');
const chatLog = document.getElementById('chat-log');
const chatInput = document.getElementById('pet-chat-input');
function chatOpenNow() { return chatPanel ? chatPanel.classList.contains('show') : false; }
function positionChatPanel() {
  if (!chatPanel || !model) return;
  const w = 420, h = chatPanel.offsetHeight || 480;
  let x = model.x + modelHalfW() + 24;
  if (x + w > innerWidth - 8) x = model.x - modelHalfW() - 24 - w;

function addChatMsg(role, text) {
  if (!chatLog) return;
  const d = document.createElement('div');
  d.className = 'cp-msg ' + role;
  if (role === 'pet') {
    d.innerHTML = '<span class="cp-msg-avatar">🐱</span>';
    const span = document.createElement('span');
    span.textContent = text;
    d.appendChild(span);
  } else {
    d.textContent = text;
  }
  chatLog.appendChild(d);
  while (chatLog.children.length > 30) chatLog.removeChild(chatLog.firstChild);
  chatLog.scrollTop = chatLog.scrollHeight;
}
function showTyping(show) {
  const t = document.getElementById('chat-typing');
  if (t) t.classList.toggle('show', show);
  if (show && chatLog) chatLog.scrollTop = chatLog.scrollHeight;
  if (!show) clearIntentFallback();
}
// 意图台词兜底：主 Agent 回复未到时暂存短句，超时再显示
let _intentFallbackTimer = null, _pendingIntentSpeech = null;
function armIntentFallback(speech) {
  _pendingIntentSpeech = speech;
  clearTimeout(_intentFallbackTimer);
  _intentFallbackTimer = setTimeout(() => {
    if (_pendingIntentSpeech && chatOpenNow()) addChatMsg('pet', _pendingIntentSpeech);
    _pendingIntentSpeech = null;
    showTyping(false);
  }, 12000);
}
function clearIntentFallback() {
  clearTimeout(_intentFallbackTimer); _intentFallbackTimer = null; _pendingIntentSpeech = null;
}
function clearChat() {
  if (chatLog) chatLog.innerHTML = '';
}
function toggleChat(force) {
  if (!chatPanel) return;
  const show = typeof force === 'boolean' ? force : !chatOpenNow();
  if (show) {
    chatPanel.classList.remove('closing');
    chatPanel.classList.add('show');
    positionChatPanel();
    setTimeout(() => chatInput && chatInput.focus(), 150);
    if (HAS_IPC && ctMode) ipc.send('pet:set-ignore-mouse', false);
  } else {
    chatPanel.classList.remove('show');
    chatPanel.classList.add('closing');
    setTimeout(() => { chatPanel.classList.remove('closing'); }, 200);
  }
}
function submitChat() {
  const text = (chatInput && chatInput.value || '').trim();
  if (!text) return;
  addChatMsg('user', text);
  if (chatInput) chatInput.value = '';
  showTyping(true);
  if (HAS_IPC) {
    // 1) 同步到主窗口 Lumina Agent 聊天
    try { ipc.send('pet:sync-send', { text }); } catch(e) {}
    // 2) 桌宠意图系统（驱动动作/表情）
    //    dispatchIntent 在主进程已通过 pet:command 下发执行，这里只处理错误情况
    ipc.invoke('pet:chat', { text }).then(res => {
      // typing 等主 Agent 回复(pet:sync-reply)或 12s 意图兜底再关，这里不提前关
      if (!res || !res.ok) {
        addChatMsg('pet', '呜…脑子转不动了喵…');
        showTyping(false);
      }
      // 如果 LLM 不可用降级了，pet:command 事件会执行 intent
      // 如果 source 是 llm，dispatchIntent 也已经下发了
    }).catch(() => {
      showTyping(false);
      addChatMsg('pet', '喵…连接出了点问题…');
    });
  } else {
    showTyping(false);
    addChatMsg('pet', '喵~');
  }
  patchInteraction && patchInteraction();
}
if (chatInput) chatInput.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); submitChat(); } });
const chatSendBtn = document.getElementById('pet-chat-send');

/* 聊天面板拖拽 —— 修复：记录拖动距离，拖动后抑制 click 事件；边界使用面板实际宽高 */
const chatHead = document.getElementById('chat-head');
let chatDragOff = null;
let chatDragMoved = 0;
let chatJustDragged = false;
let _chatJustDraggedTimer = null;
if (chatHead) {
  chatHead.addEventListener('mousedown', (e) => {
    if (e.target.closest('.cp-close')) return;
    chatDragOff = { dx: e.clientX - chatPanel.offsetLeft, dy: e.clientY - chatPanel.offsetTop };
    chatDragMoved = 0;
    e.preventDefault();
    e.stopPropagation();
  });
  document.addEventListener('mousemove', (e) => {
    if (!chatDragOff || !chatPanel) return;
    chatDragMoved += Math.abs(e.movementX || 1) + Math.abs(e.movementY || 1);
    const pw = chatPanel.offsetWidth || 320;
    const ph = chatPanel.offsetHeight || 300;
    chatPanel.style.left = Math.max(4, Math.min(innerWidth - pw - 4, e.clientX - chatDragOff.dx)) + 'px';
    chatPanel.style.top = Math.max(4, Math.min(innerHeight - ph - 4, e.clientY - chatDragOff.dy)) + 'px';
  });
  document.addEventListener('mouseup', () => {
    if (chatDragOff && chatDragMoved > 4) {
      // 标记刚拖动完，抑制接下来的 click 事件（防止点击模型关闭聊天框）
      chatJustDragged = true;
      clearTimeout(_chatJustDraggedTimer);
      _chatJustDraggedTimer = setTimeout(() => { chatJustDragged = false; }, 100);
    }
    chatDragOff = null;
  });
}

/* ════════════════════════════════════════════════════════════
   N.E.K.O 风格工具栏 & 弹出面板系统

function closeAllPanels() {
  document.querySelectorAll('.nk-panel').forEach(p => p.classList.remove('show'));
  document.querySelectorAll('.tb-btn').forEach(b => b.classList.remove('active'));
  // 重新应用工具栏按钮的持久状态
  applyPrefs();
}

function togglePanel(panelId, btnId) {
  const panel = document.getElementById(panelId);
  const btn = document.getElementById(btnId);
  if (!panel) return;
  const isOpen = panel.classList.contains('show');
  closeAllPanels();
  if (!isOpen) {
    // 构建面板内容
    if (panelId === 'panel-audio') { panel.innerHTML = buildAudioPanel(); bindAudioPanel(); }
    else if (panelId === 'panel-tools') { panel.innerHTML = buildToolsPanel(); bindToolsPanel(); }
    else if (panelId === 'panel-settings') { panel.innerHTML = buildSettingsPanel(); bindSettingsPanel(); }
    else if (panelId === 'panel-sparkle') { panel.innerHTML = buildSparklePanel(); bindSparklePanel(); }
    panel.dataset.anchor = btnId;
    if (btn) btn.classList.add('active');
    positionPanel(panel, btn);
    // 强制 reflow 后再加 .show，确保入场动画触发
    void panel.offsetWidth;
    panel.classList.add('show');
    if (HAS_IPC) ipc.send('pet:set-ignore-mouse', false);
  }
}

function positionPanel(panel, anchorBtn) {
  if (!panel || !anchorBtn) return;
  const place = () => {
    const r = anchorBtn.getBoundingClientRect();
    const pw = panel.offsetWidth || 240;
    const ph = panel.offsetHeight || 200;
    let x = r.right + 10;
    if (x + pw > innerWidth - 8) x = r.left - pw - 10;
    x = Math.max(8, Math.min(innerWidth - pw - 8, x));
    let y;
    if (ph >= innerHeight - 16) y = 8;
    else y = r.top + r.height / 2 - ph / 2;
    y = Math.max(8, Math.min(innerHeight - ph - 8, y));
    panel.style.left = x + 'px';
    panel.style.top = y + 'px';
  };
  place();
  requestAnimationFrame(place);
}

function livePref(patch) {
  if (HAS_IPC) ipc.invoke('pet:update-prefs', patch).catch(() => {});
  // 本地立即应用
  prefs = Object.assign(prefs, patch);
  if (patch.catpaw) prefs.catpaw = Object.assign(prefs.catpaw || {}, patch.catpaw);
  applyPrefs();
  // 标记本地刚更新，抑制 pet:prefs-changed 回传时的面板重建（避免打断开关/滑块动画）
  _lastLocalPrefAt = Date.now();
}

function bindAudioPanel() {
  const $ = id => document.getElementById(id);
  $('ap-ss').onchange = e => livePref({ screenShare: e.target.checked });
  $('ap-vr').onchange = e => { livePref({ voiceRecognition: e.target.checked }); $('ap-vr-hint').textContent = e.target.checked ? '当前使用语音识别中…' : '点击开启'; };
  $('ap-spatial').onchange = e => livePref({ spatial: e.target.checked });
  $('ap-voice').onchange = e => livePref({ voiceOn: e.target.checked });
  $('ap-tts-engine').onchange = e => livePref({ ttsEngine: e.target.value });
  $('ap-vol').oninput = e => { $('ap-vol-val').textContent = e.target.value + '%'; };
  $('ap-vol').onchange = e => livePref({ volume: Number(e.target.value) });
  // 设备选择（枚举系统音频设备）
  $('ap-mic-row').onclick = async () => {
    try {
      const devices = await navigator.mediaDevices.enumerateDevices();
      const mics = devices.filter(d => d.kind === 'audioinput');
      if (!mics.length) { alert('未找到麦克风设备'); return; }
      const names = mics.map((d, i) => `${i + 1}. ${d.label || '麦克风 ' + (i + 1)}`).join('\n');
      const choice = prompt('选择麦克风（输入编号）：\n' + names, '1');
      if (choice != null) {
        const idx = Math.max(0, Math.min(mics.length - 1, parseInt(choice) - 1));
        if (!isNaN(idx)) { livePref({ micDevice: mics[idx].deviceId }); $('ap-mic-name').textContent = mics[idx].label || '麦克风 ' + (idx + 1); }
      }
    } catch (err) { alert('枚举设备失败：' + err.message); }
  };
  $('ap-pb-row').onclick = async () => {
    try {
      const devices = await navigator.mediaDevices.enumerateDevices();
      const speakers = devices.filter(d => d.kind === 'audiooutput');
      if (!speakers.length) { alert('未找到播放设备'); return; }
      const names = speakers.map((d, i) => `${i + 1}. ${d.label || '扬声器 ' + (i + 1)}`).join('\n');
      const choice = prompt('选择播放设备（输入编号）：\n' + names, '1');
      if (choice != null) {
        const idx = Math.max(0, Math.min(speakers.length - 1, parseInt(choice) - 1));
        if (!isNaN(idx)) { livePref({ playbackDevice: speakers[idx].deviceId }); $('ap-pb-name').textContent = speakers[idx].label || '扬声器 ' + (idx + 1); }
      }
    } catch (err) { alert('枚举设备失败：' + err.message); }
  };
}

    livePref({ catpaw: { desktop: e.target.checked } });

      if (r && !r.ok) say(r.error || '虚拟桌面操作失败');
    }).catch(() => {});
  };
  $('tp-plugins').onchange = e => {
    livePref({ catpaw: { plugins: e.target.checked } });
    const panel = $('tp-plugins-panel');
    if (panel) panel.style.display = e.target.checked ? 'flex' : 'none';
    if (e.target.checked && HAS_IPC) {
      ipc.invoke('pet:plugins', { action: 'list' }).then(r => updatePluginList(r)).catch(() => {});
    }
  };
  $('tp-perc').onchange = e => livePref({ catpaw: { perception: e.target.checked } });
  const openBtn = $('tp-plugin-open');
  if (openBtn) openBtn.onclick = () => { if (HAS_IPC) ipc.invoke('pet:plugins', { action: 'open-dir' }); };
  const reloadBtn = $('tp-plugin-reload');
  if (reloadBtn) reloadBtn.onclick = () => {
    if (HAS_IPC) ipc.invoke('pet:plugins', { action: 'reload' }).then(r => { updatePluginList(r); say('插件已重新加载喵~'); }).catch(() => {});

function updatePluginList(r) {
  const list = document.getElementById('tp-plugin-list');
  if (!list) return;
  if (!r || !r.ok) { list.textContent = r?.error || '暂无插件'; return; }
  const plugins = r.plugins || [];
  if (!plugins.length) { list.textContent = '插件目录为空，把 .js 文件放进去即可'; return; }
  list.innerHTML = plugins.map(p => `<div style="padding:2px 0;">${p.enabled ? '✅' : '⚠️'} ${p.name} — ${p.desc || '无描述'}</div>`).join('');
}

function bindSettingsPanel() {

  const dlg = $('sp-dialogue'); if (dlg) dlg.onclick = () => { settingsSubPage = 'dialogue'; refreshPanel('panel-settings'); };

  // 🤵 主动秘书配置
  const ensureSec = () => { prefs.secretary = Object.assign({ enabled: true, minIntervalSec: 45, sources: {} }, prefs.secretary || {}); return prefs.secretary; };
  const scEn = $('sc-enabled');
  if (scEn) scEn.onchange = e => { ensureSec(); livePref({ secretary: Object.assign({}, prefs.secretary, { enabled: e.target.checked }) }); };
  const scIv = $('sc-interval');
  if (scIv) {
    scIv.oninput = e => { const v = $('sc-interval-val'); if (v) v.textContent = e.target.value + 's'; };
    scIv.onchange = e => { ensureSec(); livePref({ secretary: Object.assign({}, prefs.secretary, { minIntervalSec: Number(e.target.value) }) }); };
  }

function refreshPanel(panelId) {
  const panel = document.getElementById(panelId);

  const btnId = { 'panel-audio': 'tb-voice', 'panel-tools': 'tb-tools', 'panel-settings': 'tb-settings', 'panel-sparkle': 'tb-sparkle' }[panelId];

  else if (panelId === 'panel-tools') panel.innerHTML = buildToolsPanel();
  else if (panelId === 'panel-settings') panel.innerHTML = buildSettingsPanel();
  else if (panelId === 'panel-sparkle') panel.innerHTML = buildSparklePanel();

  if (panelId === 'panel-audio') bindAudioPanel();
  else if (panelId === 'panel-tools') bindToolsPanel();

  else if (panelId === 'panel-sparkle') bindSparklePanel();

  if (btn) { btn.classList.add('active'); positionPanel(panel, btn); }
}

/* ── 主进程命令 ──────────────────────────────────────────── */
if (HAS_IPC) {
  ipc.on('pet:command', (_e, cmd) => {
    if (!cmd) return;
    if (cmd.type === 'set-emotion' && cmd.emotion) applyEmotion(cmd.emotion.label || cmd.emotion);
    if (cmd.type === 'say') say(cmd.text || '喵~');
    if (cmd.type === 'proactive-card') showProactiveCard(cmd);
    if (cmd.type === 'walk') cmd.enable ? walk(1) : (state.walking = false);
    if (cmd.type === 'set-opacity') document.body.style.opacity = cmd.value;
    if (cmd.type === 'set-tooltip') say(cmd.text);
    if (cmd.type === 'set-scale' && typeof cmd.value === 'number') setUserScale(cmd.value, false);
    if (cmd.type === 'set-click-through') {
      ctMode = !!cmd.value;
      updateLockIcon();
      if (HAS_IPC) ipc.send('pet:set-ignore-mouse', !inInteractiveZone());
    }
    if (cmd.type === 'set-locked') {
      state.locked = !!cmd.value;
      if (state.locked) { state.walking = false; state.lockedX = model.x; state.lockedY = model.y; state.floating = false; state.floatY = model.y; }
      updateLockIcon();
    }
    if (cmd.type === 'set-auto') {
      if (cmd.value === 'off' || cmd.value === 'light' || cmd.value === 'heavy') state.autoLevel = cmd.value;
    }
    if (cmd.type === 'intent') {
      try { console.log('%c[Brain] LLM 驱动身体 → ' + JSON.stringify(cmd.intent), 'color:#7aa2f7;font-weight:bold'); } catch (e) {}
      lastLLMActAt = Date.now();
      if (chatOpenNow() && cmd.intent && cmd.intent.speech) {
        // 主 Agent 回复正在路上（typing 中）时，意图台词先不入气泡，避免一句话冒出两个回复；
        // 12 秒后主回复仍没来（如主窗口未开），用意图台词兜底，不让聊天冷场。
        const typingEl = document.getElementById('chat-typing');
        if (typingEl && typingEl.classList.contains('show')) armIntentFallback(cmd.intent.speech);
        else addChatMsg('pet', cmd.intent.speech);
      }
      execIntent(cmd.intent);
    }
  });
  // 主窗口 Lumina Agent 回复 → 显示在桌宠聊天中
  ipc.on('pet:sync-reply', (_e, data) => {
    showTyping(false);
    if (data && data.text) {
      addChatMsg(data.role === 'user' ? 'user' : 'pet', data.text);
      if (data.role !== 'user' && Array.isArray(data.options) && data.options.length) addChatOptions(data.options);
      // 如果聊天面板没打开，显示气泡提示
      if (data.role !== 'user' && !chatOpenNow()) {
        say(data.text.slice(0, 80));
      }
    }
  });
  // 历史记录回复 → 批量加载到聊天面板
  ipc.on('pet:sync-history-reply', (_e, messages) => {
    if (!Array.isArray(messages) || messages.length === 0) return;
    if (chatLog) {
      chatLog.innerHTML = '';
      for (const m of messages) {
        addChatMsg(m.role === 'user' ? 'user' : 'pet', m.content);
      }
    }
  });
  // 请求历史记录
  if (HAS_IPC) {
    try { ipc.send('pet:sync-history-request'); } catch {}
  }
}

/* ── 启动 ────────────────────────────────────────────────── */
async function boot() {
  const reportProgress = (p, s) => { if (HAS_IPC) try { ipc.send('pet:startup-progress', { progress: p, stage: s }); } catch(e){} };
  reportProgress(20, '正在初始化渲染引擎…');
  if (!initPixi()) { showPetError('渲染器初始化失败，请检查控制台'); return; }
  startRenderLoop();
  reportProgress(35, '正在读取配置…');
  const MODEL_PATHS = { Mao: 'assets/Mao/mao_pro.model3.json' };
  let currentModel = { id: 'Mao', name: 'Mao', url: MODEL_PATHS.Mao };
  if (HAS_IPC) { try { const cm = await ipc.invoke('pet:models:current'); if (cm && cm.url) currentModel = cm; } catch (e) {} }
  const candidates = [currentModel.url, MODEL_PATHS.Mao];
  let loaded = false;
  reportProgress(50, '正在加载 Live2D 模型…');
  for (const src of candidates) {
    try {
      model = await Live2DModel.from(src, { autoInteract: false, autoFocus: false });
      loaded = true;
      state.name = (src === currentModel.url ? currentModel.name : 'Mao') || 'Mao';
      break;
    } catch (e) { console.warn('[Pet] 模型加载失败，尝试下一个:', src, e); }
  }
  if (!loaded) { showPetError('模型加载失败，请检查 assets 目录'); reportProgress(0, '模型加载失败'); return; }
  reportProgress(80, '正在初始化模型…');

  // N.E.K.O 遮罩修复
  if (model.internalModel && model.internalModel.renderer && model.internalModel.renderer._clippingManager) {
    model.internalModel.renderer._clippingManager._renderTextureCount = 3;
    if (typeof model.internalModel.renderer._clippingManager.initialize === 'function') {
      model.internalModel.renderer._clippingManager.initialize(
        model.internalModel.coreModel, model.internalModel.coreModel.getDrawableCount(),
        model.internalModel.coreModel.getDrawableMasks(), model.internalModel.coreModel.getDrawableMaskCounts(), 3
      );
    }
  }
  app.stage.addChild(model);
  // 👀 每帧驱动“空闲注视/回中”；鼠标跟随走 mousemove→driveGaze→model.focus 标准链路
  try { model.on('beforeModelUpdate', gazeFrame); } catch (e) {}
  try { gazeState.lastMove = 0; gazeState.nextIdle = 0; } catch (e) {}
  try { model.anchor.set(0.5, 0.5); } catch (e) {}
  state.naturalW = model.width || 300; state.naturalH = model.height || 300;
  applyScale();
  model.x = innerWidth / 2; state.targetX = innerWidth / 2;
  clampPosition();
  positionOverlays();
  try { window.__live2dModel = model; } catch (e) {}

  // 🎬 检测模型内置动作组 & 表情，启动空闲动作循环
  initMotionSystem();
  initLifeEngine(); // 🫀 v0.2

  if (HAS_IPC) {
    ipc.invoke('pet:config').then(cfg => {
      if (cfg && typeof cfg.scale === 'number') setUserScale(cfg.scale, false);
      if (cfg && (cfg.auto === 'off' || cfg.auto === 'light' || cfg.auto === 'heavy')) state.autoLevel = cfg.auto;
      if (cfg && typeof cfg.clickThrough === 'boolean') { ctMode = cfg.clickThrough; updateLockIcon(); }
    }).catch(() => {});
  }

  setTimeout(() => { say('右键我可以自定义，旁边工具栏有更多功能喵~'); }, 2500);
  fetchEmotion();
  startAutoBehavior();
  reportProgress(100, '启动完成喵~');
}
setInterval(fetchEmotion, 15000);
window.addEventListener('resize', () => {
  applyScale();
  const hw = model ? modelHalfW() + 8 : 20;
  state.targetX = Math.min(innerWidth - hw, Math.max(hw, state.targetX));
  // 重新定位打开的面板
  document.querySelectorAll('.nk-panel.show').forEach(p => {
    const btnId = { 'panel-audio': 'tb-voice', 'panel-tools': 'tb-tools', 'panel-settings': 'tb-settings', 'panel-sparkle': 'tb-sparkle' }[p.id];
    if (btnId) positionPanel(p, document.getElementById(btnId));

});

/* ── 自主行为 ────────────────────────────────────────────── */
function startAutoBehavior() {
  tickDayNightCycle();
  setInterval(tickDayNightCycle, 60 * 1000);

  let autonomyTickNo = 0;
  setInterval(() => {
    if (state.sleeping || !HAS_IPC) return;
    if (state.autoLevel === 'off' || prefs.proactive === false) return;
    if (prefs.privacyMode) return;
    autonomyTickNo++;
    if (state.autoLevel === 'light' && autonomyTickNo % 2 !== 0) return;
    ipc.invoke('pet:autonomy:tick').catch(() => {});
  }, 30 * 1000);

  setInterval(() => {
    if (state.sleeping || state.autoLevel === 'off' || prefs.proactive === false) return;
    if (prefs.focusMode && document.hasFocus && !document.hasFocus()) return;
    if (Math.random() < 0.25) {
      const pool = ['想不想吃小蛋糕？', '要不要休息一下？', '今天也要加油喵~', '尾巴摇啊摇~', '刚刚做了一个梦…'];
      say(pool[Math.floor(Math.random() * pool.length)]);
    }
  }, 45 * 1000);

  setInterval(() => {
    if (state.sleeping || state.autoLevel !== 'heavy') return;
    const stayPlaced = state.floating || Date.now() - state.lastPlaceAt < 60_000;
    const r = Math.random();
    if (r < 0.35 && !stayPlaced) { walk(Math.random() > 0.5 ? 1 : -1); }
    else if (r < 0.6) { doBlink(); }
    else if (r < 0.75) { doWave(); }
  }, 18 * 1000);

  setInterval(() => {
    if (state.sleeping || state.autoLevel === 'off' || prefs.proactive === false) return;
    if (prefs.focusMode && document.hasFocus && !document.hasFocus()) return;
    if (Math.random() < 0.35) {
      const topics = ['主人~你在忙什么呀？', '要不要起来走一走喵？', '我发现一个有意思的事想告诉你…', '要不要喝口水？别太累了喵。', '今天的心情怎么样呀？'];
      const text = topics[Math.floor(Math.random() * topics.length)];
      say(text); sendEvent('proactive-speak', { text });
    }
  }, 90 * 1000);

  setInterval(() => {
    if (state.sleeping || state.autoLevel === 'off' || prefs.privacyMode) return;
    if (HAS_IPC) ipc.invoke('pet:perception:tick').catch(() => {});
  }, 120 * 1000);

  // 🤵 主动秘书心跳：每 10s 询问一次，是否真的搭话由主进程按"总开关 + 最低间隔"节流
  setInterval(() => {
    if (state.sleeping || prefs.privacyMode) return;
    const sec = prefs.secretary || {};
    if (sec.enabled === false || prefs.proactive === false) return;
    if (HAS_IPC) ipc.invoke('pet:secretary:tick').catch(() => {});
  }, 10 * 1000);
}

function tickDayNightCycle() {
  const h = new Date().getHours();
  const shouldSleep = h >= 23 || h < 7;
  if (shouldSleep && !state.sleeping) execIntent({ action: 'sleep' });
  else if (!shouldSleep && state.sleeping) execIntent({ action: 'wake' });
  if (!state.sleeping) {
    if (h >= 0 && h < 6) applyEmotion('疲惫 😩');
    else if (h >= 6 && h < 9) applyEmotion('平静 😐');
    else if (h >= 9 && h < 18) applyEmotion('开心 😊');
    else applyEmotion('幸福 💖');
  }
}

let lastInteractionTs = Date.now(), interactionCount = 0, lastMoodTick = Date.now();
function moodEngine() {
  const now = Date.now();
  if (now - lastMoodTick < 90_000) return;
  lastMoodTick = now;
  const idle = now - lastInteractionTs;
  if (state.sleeping) return;
  if (idle > 20 * 60_000) applyEmotion('低落 😔');
  else if (idle > 10 * 60_000) applyEmotion('闷闷不乐 😕');
  else if (interactionCount > 8) applyEmotion('兴奋 🤩');
  else if (interactionCount > 4) applyEmotion('开心 😊');
}
setInterval(moodEngine, 90_000);

const patchInteraction = () => { interactionCount++; lastInteractionTs = Date.now(); };
document.getElementById('pet-container').addEventListener('click', patchInteraction);
document.getElementById('pet-container').addEventListener('dblclick', patchInteraction);
if (chatInput) chatInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') patchInteraction(); });

/* ── 插件系统 ───────────────────────────────────────────── */
const PetPlugins = {
  _hooks: {},
  loaded: [],
  /** 注册事件钩子 */
  on(event, cb) { (this._hooks[event] = this._hooks[event] || []).push(cb); },
  /** 触发钩子 */
  emit(event, data) { (this._hooks[event] || []).forEach(cb => { try { cb(data); } catch (e) { console.warn('[Plugin] hook error:', e); } }); },
  /** 加载插件代码 */
  load(code, filename) {
    try {
      const api = {
        say: (t) => say(t),
        execIntent: (i) => execIntent(i),
        addChatMsg: (r, t) => addChatMsg(r, t),
        setState: (k, v) => { state[k] = v; },
        getState: () => ({ ...state }),
        getPrefs: () => ({ ...prefs }),
        on: (ev, cb) => this.on(ev, cb),
        sendCommand: (cmd) => { if (HAS_IPC) ipc.send('pet:send-command', cmd); },
        log: (...args) => console.log(`[Plugin:${filename}]`, ...args),
      };
      // 沙箱化执行
      const fn = new Function('Lumina', `"use strict";\n${code}`);
      fn(api);
      this.loaded.push({ name: filename, code });
      console.log(`[Plugin] 已加载: ${filename}`);
      return true;
    } catch (e) {
      console.error(`[Plugin] 加载失败 ${filename}:`, e);
      return false;
    }
  },
  /** 批量加载 */
  loadAll(codes) {
    codes.forEach((code, i) => this.load(code, `plugin-${i}.js`));
  },
};

// 接收主进程的插件重载
if (HAS_IPC) {
  ipc.on('pet:plugins-reload', (_e, codes) => {
    PetPlugins.loaded = [];
    PetPlugins._hooks = {};
    if (Array.isArray(codes)) PetPlugins.loadAll(codes);
    say(`已重新加载 ${codes?.length || 0} 个插件喵~`);
  });
  // 启动时自动加载插件（如果开启了应用开发模式）
  setTimeout(() => {
    if (prefs.catpaw?.plugins) {
      ipc.invoke('pet:plugins', { action: 'list' }).then(r => {
        if (r?.ok && r.plugins?.length) {
          ipc.invoke('pet:plugins', { action: 'reload' }).catch(() => {});
        }
      }).catch(() => {});
    }
  }, 3000);
}

boot().catch(err => {
  console.error('[Pet] boot failed:', err);
  showPetError('启动失败：' + (err && err.message ? err.message : String(err)));
});
</script>
