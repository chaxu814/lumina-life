<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' data: file: blob:; img-src 'self' data: file: blob:; media-src 'self' data: file: blob:; script-src 'self' 'unsafe-inline';" />
<title>Lumina MMD Pet (beta)</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: transparent; font-family: "Microsoft YaHei", sans-serif; user-select: none; }
  #mmd { position: fixed; inset: 0; }
  #status {
    position: fixed; left: 50%; bottom: 18%; transform: translateX(-50%);
    padding: 10px 18px; border-radius: 10px; font-size: 13px; color: #d8d4e6;
    background: rgba(20, 16, 32, 0.85); border: 1px solid rgba(255,255,255,0.12);
    text-align: center; max-width: 80vw; line-height: 1.6;
  }
  #beta-tag {
    position: fixed; right: 12px; top: 10px; padding: 4px 10px; border-radius: 6px;
    font-size: 11px; color: #ffd966; background: rgba(180, 140, 40, 0.3);
    border: 1px solid rgba(255, 217, 102, 0.3);
  }
  #bubble {
    position: fixed; left: 50%; top: 12%; transform: translateX(-50%);
    padding: 8px 14px; border-radius: 12px; background: rgba(40,30,60,0.85);
    color: #fff; font-size: 13px; opacity: 0; transition: opacity 0.3s;
    pointer-events: none; white-space: nowrap;
  }
  #bubble.show { opacity: 1; }
</style>
</head>
<body>
<canvas id="mmd"></canvas>
<div id="beta-tag">MMD Beta</div>
<div id="status">正在初始化 MMD 渲染器…</div>
<div id="bubble"></div>
<!-- 渲染器已抽为 bundle（electron/pet/mmd/mmdRenderer.ts → assets/pet-mmd.js）：
     three/MMDLoader 内联打包，IPC 仅经 window.petAPI 白名单桥，无 require。 -->
<script src="assets/pet-mmd.js"></script>
</body>
</html>
