<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' data: file: blob:; img-src 'self' data: file: blob:; media-src 'self' data: file: blob:; script-src 'self' 'unsafe-inline';" />
<title>Lumina MMD Pet (beta)</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: transparent; font-family: "Microsoft YaHei", sans-serif; user-select: none; }
  #mmd { position: fixed; inset: 0; }
  #status {
    position: fixed; left: 50%; bottom: 18%; transform: translateX(-50%);
    padding: 10px 18px; border-radius: 10px; font-size: 13px; color: #d8d4e6;
    background: rgba(20, 16, 32, 0.85); border: 1px solid rgba(255,255,255,0.12);
    text-align: center; max-width: 80vw; line-height: 1.6;
  }
  #beta-tag {
    position: fixed; right: 12px; top: 10px; padding: 4px 10px; border-radius: 6px;
    font-size: 11px; color: #ffd966; background: rgba(180, 140, 40, 0.3);
    border: 1px solid rgba(255, 217, 102, 0.3);
  }
  #bubble {
    position: fixed; left: 50%; top: 12%; transform: translateX(-50%);
    padding: 8px 14px; border-radius: 12px; background: rgba(40,30,60,0.85);
    color: #fff; font-size: 13px; opacity: 0; transition: opacity 0.3s;
    pointer-events: none; white-space: nowrap;
  }
  #bubble.show { opacity: 1; }
</style>
</head>
<body>
<canvas id="mmd"></canvas>
<div id="beta-tag">MMD Beta</div>
<div id="status">正在初始化 MMD 渲染器…</div>
<div id="bubble"></div>
<script>
const statusEl = document.getElementById('status');
const bubbleEl = document.getElementById('bubble');

function setStatus(msg) { statusEl.textContent = msg; statusEl.style.display = msg ? 'block' : 'none'; }
function say(text) {
  bubbleEl.textContent = text;
  bubbleEl.classList.add('show');
  clearTimeout(bubbleEl._t);
  bubbleEl._t = setTimeout(() => bubbleEl.classList.remove('show'), 2000);
}

// ── IPC ──
let ipc = null;
try { ipc = require('electron').ipcRenderer; } catch (e) {}
const HAS_IPC = !!ipc;

if (HAS_IPC) {
  ipc.invoke('pet:startup-progress', { progress: 30, stage: '初始化 MMD 渲染器…' }).catch(()=>{});
}

// ── 读取当前模型路径 ──
async function getModelUrl() {
  // 先从 query param 读
  try {
    const params = new URLSearchParams(location.search);
    const m = params.get('model');
    if (m) return decodeURIComponent(m);
  } catch (e) {}
  // 从 IPC 读
  if (HAS_IPC) {
    try {
      const cm = await ipc.invoke('pet:models:current');
      if (cm && cm.url && cm.kind === 'mmd') return cm.url;
    } catch (e) {}
  }
  return null;
}

// ── three.js 初始化 ──
let renderer, scene, camera, mmdModel = null, clock;
let controls = null;

async function initThree() {
  const THREE = require('three');
  const canvas = document.getElementById('mmd');
  renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;

  scene = new THREE.Scene();
  // 渐变背景（透明舞台用暗色渐变）
  const bgCanvas = document.createElement('canvas');
  bgCanvas.width = 2; bgCanvas.height = 256;
  const bgCtx = bgCanvas.getContext('2d');
  const grad = bgCtx.createLinearGradient(0, 0, 0, 256);
  grad.addColorStop(0, '#2a2540');
  grad.addColorStop(1, '#1a1828');
  bgCtx.fillStyle = grad;
  bgCtx.fillRect(0, 0, 2, 256);
  const bgTex = new THREE.CanvasTexture(bgCanvas);
  scene.background = bgTex;

  camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
  camera.position.set(0, 1.5, 5);

  // 灯光
  const ambient = new THREE.AmbientLight(0xffffff, 0.6);
  scene.add(ambient);
  const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
  dirLight.position.set(3, 5, 4);
  dirLight.castShadow = true;
  dirLight.shadow.mapSize.set(1024, 1024);
  scene.add(dirLight);

  // 地面阴影
  const groundGeo = new THREE.PlaneGeometry(20, 20);
  const groundMat = new THREE.ShadowMaterial({ opacity: 0.3 });
  const ground = new THREE.Mesh(groundGeo, groundMat);
  ground.rotation.x = -Math.PI / 2;
  ground.position.y = 0;
  ground.receiveShadow = true;
  scene.add(ground);

  clock = new THREE.Clock();

  // OrbitControls
  try {
    const { OrbitControls } = require('three/examples/jsm/controls/OrbitControls.js');
    controls = new OrbitControls(camera, canvas);
    controls.target.set(0, 1.0, 0);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.minDistance = 2;
    controls.maxDistance = 15;
  } catch (e) { console.warn('OrbitControls 加载失败:', e); }

  window.addEventListener('resize', onResize);
  animate();
}

function onResize() {
  if (!renderer || !camera) return;
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}

function animate() {
  requestAnimationFrame(animate);
  const delta = clock ? clock.getDelta() : 0.016;
  if (mmdModel) {
    // MMD 骨骼动画更新
    if (mmdModel.mixer) mmdModel.mixer.update(delta);
    if (mmdModel.skeleton) mmdModel.skeleton.update();
  }
  if (controls) controls.update();
  renderer.render(scene, camera);
}

// ── 加载 MMD 模型 ──
async function loadMMDModel(url) {
  if (!url) {
    setStatus('未找到 MMD 模型文件。\n请通过设置面板导入 .pmx 模型后重新切换。\n（MMD 支持为 beta，暂不内置示例模型）');
    return;
  }

  // 检查文件大小（>50MB 提示）
  try {
    const { stat } = require('fs');
    // URL 是 file:// 开头，转成文件路径
    const fileUrl = new URL(url);
    const filePath = fileUrl.pathname.replace(/^\//, '').replace(/^([a-zA-Z]):/, '$1:');
    const stats = await new Promise((res, rej) => stat(filePath, (err, s) => err ? rej(err) : res(s)));
    if (stats.size > 50 * 1024 * 1024) {
      setStatus(`模型较大 (${(stats.size / 1024 / 1024).toFixed(1)}MB)，可能卡顿…`);
    }
  } catch (e) { /* 大小检查失败不阻断 */ }

  setStatus('正在加载 MMD 模型…');
  try {
    const THREE = require('three');
    const { MMDLoader } = require('three/examples/jsm/loaders/MMDLoader.js');
    const loader = new MMDLoader();

    loader.load(url, async (mesh) => {
      // 清理旧模型
      if (mmdModel) {
        scene.remove(mmdModel);
        mmdModel = null;
      }
      mmdModel = mesh;
      mesh.position.y = 0;
      mesh.scale.set(0.08, 0.08, 0.08); // MMD 模型默认很大，缩小到合适尺寸
      mesh.castShadow = true;
      scene.add(mesh);

      // 添加待机动作（如果没有 VMD，就静止站立）
      if (HAS_IPC) {
        try {
          const cm = await ipc.invoke('pet:models:current');
          // 尝试加载 manifest 中指定的 idle vmd
          if (cm && cm.entryRel) {
            // vmd 路径由 manifest 指定，这里简化处理
          }
        } catch (e) {}
      }

      setStatus('');
      say('MMD 模型加载完成 (beta)');
      if (HAS_IPC) ipc.invoke('pet:startup-progress', { progress: 100, stage: 'MMD 就绪' }).catch(()=>{});
    }, (xhr) => {
      if (xhr.total) {
        const pct = Math.round((xhr.loaded / xhr.total) * 100);
        setStatus(`加载模型… ${pct}%`);
      }
    }, (err) => {
      console.error('MMD 加载失败:', err);
      setStatus(`MMD 模型加载失败: ${(err.message || err).toString().slice(0, 100)}\n请确认模型为 .pmx 格式（.pmd 暂不支持）`);
      if (HAS_IPC) ipc.send('pet:model-load-failed', { error: String(err) });
    });
  } catch (e) {
    console.error('MMDLoader 初始化失败:', e);
    setStatus(`MMD 渲染器初始化失败: ${e.message}\n请确认 three.js MMDLoader 可用`);
  }
}

// ── 启动 ──
(async function boot() {
  try {
    await initThree();
    const modelUrl = await getModelUrl();
    await loadMMDModel(modelUrl);
  } catch (e) {
    console.error('MMD 启动失败:', e);
    setStatus(`MMD 启动失败: ${e.message}`);
  }
})();
</script>
</body>
</html>
