<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' data: file:; img-src 'self' data: file: blob:; media-src 'self' data: file: blob:; script-src 'self' 'unsafe-inline';" />
<title>Lumina VRM Pet</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; overflow: hidden; background: transparent;
    font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
    user-select: none; -webkit-user-select: none;
  }
  #vrm { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  /* 说话气泡 */
  #bubble {
    position: fixed; left: 50%; transform: translateX(-50%) translateY(8px);
    max-width: 300px; padding: 10px 14px; border-radius: 14px;
    background: rgba(28, 24, 40, 0.86); color: #fff; font-size: 13px; line-height: 1.55;
    border: 1px solid rgba(255,255,255,0.16); box-shadow: 0 8px 24px rgba(0,0,0,0.32);
    opacity: 0; transition: opacity .25s ease, transform .25s ease; pointer-events: none;
    white-space: pre-wrap; word-break: break-word; text-align: center;
  }
  #bubble.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  /* 加载 / 错误提示 */
  #status {
    position: fixed; left: 50%; bottom: 18%; transform: translateX(-50%);
    padding: 8px 16px; border-radius: 10px; font-size: 12px; color: #d8d4e6;
    background: rgba(20, 16, 32, 0.82); border: 1px solid rgba(255,255,255,0.12);
    text-align: center; max-width: 80vw;
  }
  #bar { margin-top: 6px; width: 180px; height: 4px; border-radius: 2px; background: rgba(255,255,255,.18); overflow: hidden; display: none; }
  #bar.show { display: block; }
  #bar > i { display: block; height: 100%; width: 0; background: linear-gradient(90deg,#7aa2f7,#bb9af7); transition: width .2s; }
  /* 右上角小提示 */
  #hint {
    position: fixed; right: 14px; bottom: 10px; font-size: 11px; color: rgba(255,255,255,.55);
    background: rgba(20,16,32,.55); padding: 4px 10px; border-radius: 8px; pointer-events: none;
  }
</style>
</head>
<body>
  <canvas id="vrm"></canvas>
  <div id="bubble"></div>
  <div id="status">正在唤醒 3D 伙伴…
    <div id="bar"><i id="barfill"></i></div>
  </div>
  <div id="hint">双击打开对话 · 右键设置</div>

  <script src="assets/pet-vrm.js"></script>
  <script>
  (function () {
    'use strict'
    const HAS_IPC = !!(window.petAPI && window.petAPI.ipc)
    let ipc = null
    try { ipc = HAS_IPC ? window.petAPI.ipc : null } catch (e) { ipc = null }

    const bubbleEl = document.getElementById('bubble')
    const statusEl = document.getElementById('status')
    const bar = document.getElementById('bar')
    const barFill = document.getElementById('barfill')
    let bubbleTimer = null
    let talkTimer = null
    let handle = null
    let bounds = null
    let opacity = 1
    // F3：是否开启 VRM 连续情绪动作（flag pet.vrmExpressive，beta 默认关）
    let vrmExpressive = false

    // 把前端三维 (mood:-1~1, energy:0~1) 折算成 emotionCore 五维喂给 VRM
    // （与 Live2D 的 frontendThreeToCore 同口径；离线/未配 LLM 时也能驱动表情）
    function applyContinuousEmotion(mood, energy) {
      if (!handle || typeof handle.setEmotionCore !== 'function') return
      const valence = Math.max(-1, Math.min(1, Number(mood) || 0))
      const arousal = Math.max(0, Math.min(1, Number(energy) || 0.5))
      const fatigue = Math.max(0, Math.min(1, 1 - arousal))
      const anxiety = Math.max(0, Math.min(1, -valence * 0.5))
      handle.setEmotionCore({ valence, arousal, anxiety, fatigue, energy: arousal })
    }
    // 与 Live2D 页同口径，定时拉情绪喂给身体
    function pollEmotion() {
      if (!ipc || !vrmExpressive) return
      ipc.invoke('gamification:getEmotionXp').then(res => {
        if (res && res.success && res.emotion) {
          applyContinuousEmotion(res.emotion.mood, res.emotion.energy)
        }
      }).catch(() => {})
    }

    function setStatus(text, withBar) {
      statusEl.style.display = text ? 'block' : 'none'
      statusEl.firstChild.textContent = text || ''
      bar.className = withBar ? 'show' : ''
    }
    function showBubble(text, ms) {
      if (!text) return
      bubbleEl.textContent = text
      bubbleEl.classList.add('show')
      // 位置跟随广告牌上缘
      if (bounds) {
        const css = { x: bounds.x / (window.devicePixelRatio || 1), y: bounds.y / (window.devicePixelRatio || 1), h: bounds.height / (window.devicePixelRatio || 1) }
        bubbleEl.style.bottom = (window.innerHeight - css.y + 8) + 'px'
      }
      clearTimeout(bubbleTimer)
      bubbleTimer = setTimeout(() => bubbleEl.classList.remove('show'), ms || 6000)
    }
    // 说话：口型开合（五元音随机切换）+ 气泡
    const VOWELS = ['A', 'I', 'U', 'E', 'O']
    function speak(text) {
      if (!handle) return
      let n = 26
      clearInterval(talkTimer)
      if (text) showBubble(text, Math.min(9000, 1800 + text.length * 90))
      talkTimer = setInterval(() => {
        n--
        if (n <= 0) { clearInterval(talkTimer); handle.setTalkLevel(0); if (handle.setViseme) handle.setViseme('A', 0); return }
        const lvl = 0.25 + Math.random() * 0.65
        handle.setTalkLevel(lvl)
        // v6.2 五元音随机切换，3D 嘴型不再只是单调的 ah
        if (handle.setViseme) handle.setViseme(VOWELS[Math.floor(Math.random() * VOWELS.length)], lvl)
      }, 90)
    }
    const EMOTION_MAP = {
      happy: 'happy', joy: 'happy', 开心: 'happy',
      sad: 'sad', 难过: 'sad',
      angry: 'angry', 生气: 'angry',
      surprised: 'surprised', 惊讶: 'surprised',
      relaxed: 'relaxed',
    }

    function inBounds(ev) {
      if (!bounds) return true
      const dpr = window.devicePixelRatio || 1
      const px = ev.clientX * dpr, py = ev.clientY * dpr
      return px >= bounds.x && px <= bounds.x + bounds.width && py >= bounds.y && py <= bounds.y + bounds.height
    }

    async function boot() {
      let model = null
      if (ipc) {
        try { model = await ipc.invoke('pet:models:current') } catch (e) { model = null }
      }
      const url = model && model.url
      // 选中的不是 VRM（理论上主进程不会把本页加载给 Live2D），交给主进程重开
      if (!url) { setStatus('未找到模型，正在切回…'); if (ipc) ipc.invoke('pet:reopen').catch(() => {}); return }
      if (model.kind && model.kind !== 'vrm') {
        if (ipc) { ipc.invoke('pet:reopen').catch(() => {}); return }
      }
      if (!window.LuminaVRM) { setStatus('3D 渲染组件未加载（pet-vrm.js 缺失）'); return }

      handle = window.LuminaVRM.mount({
        canvas: document.getElementById('vrm'),
        url: url,
        onProgress: (p) => { barFill.style.width = p + '%'; setStatus('加载模型 ' + p + '%', true) },
        onBounds: (rect) => {
          bounds = rect
          // 初次拿到包围盒：把全屏舞台裁剪到角色矩形
          if (ipc) ipc.send('pet:set-shape', [rect])
        },
        onReady: (meta) => {
          setStatus(''); bar.className = ''
          if (ipc) {
            ipc.send('pet:startup-progress', { progress: 1, stage: 'vrm-ready' })
            ipc.send('pet:set-ignore-mouse', false)
          }
        },
        onError: (msg) => {
          setStatus('VRM 加载失败：' + msg + '（可在模型库切回 Live2D）', false)
          if (ipc) ipc.send('pet:startup-progress', { progress: 1, stage: 'vrm-error' })
        },
      })

      // 鼠标穿透：仅在角色矩形内接管；窗口内鼠标同时驱动视线
      document.addEventListener('mousemove', (ev) => {
        if (ipc) ipc.send('pet:set-ignore-mouse', !inBounds(ev))
        if (handle && handle.setGaze) {
          const nx = (ev.clientX / window.innerWidth - 0.5) * 2
          const ny = -(ev.clientY / window.innerHeight - 0.5) * 2
          handle.setGaze(nx, ny)
        }
      })
      document.addEventListener('click', () => { if (ipc) ipc.send('pet:event', { type: 'click' }) })
      document.addEventListener('dblclick', () => {
        if (ipc) { ipc.send('pet:event', { type: 'double-click' }); ipc.invoke('pet:toggle-main').catch(() => {}) }
      })
      document.addEventListener('contextmenu', (ev) => {
        ev.preventDefault()
        if (ipc) ipc.invoke('pet:open-settings').catch(() => {})
      })

      // 主进程命令（与 Live2D 桌宠同一套命令协议）
      if (ipc) {
        // F3：读取 VRM 连续情绪 flag（默认关），开了才轮询情绪驱动身体
        ipc.invoke('pet:get-feature-flags').then(f => {
          vrmExpressive = !!(f && f.vrmExpressive)
          if (vrmExpressive) { pollEmotion(); setInterval(pollEmotion, 15000) }
        }).catch(() => { vrmExpressive = false })
        ipc.on('pet:command', (_e, cmd) => {
          if (!cmd || !handle) return
          if (cmd.type === 'say' || cmd.type === 'set-tooltip') speak(cmd.text || '喵~')
          if (cmd.type === 'set-emotion' && cmd.emotion) {
            // F3：flag 开 → 连续情绪驱动（用 mood/energy 折算五维）；flag 关 → 旧的一次性表情
            if (vrmExpressive && typeof cmd.emotion.mood === 'number') {
              applyContinuousEmotion(cmd.emotion.mood, cmd.emotion.energy)
            } else {
              const key = EMOTION_MAP[cmd.emotion.label || cmd.emotion] || (typeof cmd.emotion === 'string' ? EMOTION_MAP[cmd.emotion] : '')
              if (key) handle.setExpression(key)
            }
          }
          if (cmd.type === 'set-opacity' && typeof cmd.value === 'number') {
            opacity = Math.max(0.15, Math.min(1, cmd.value))
            document.body.style.opacity = String(opacity)
          }
          if (cmd.type === 'set-click-through') { ipc.send('pet:set-ignore-mouse', !inBoundsCenter()) }
          if (cmd.type === 'intent' && cmd.intent && cmd.intent.speech) speak(cmd.intent.speech)
        })
        ipc.on('pet:sync-reply', (_e, data) => { if (data && data.role !== 'user' && data.text) speak(data.text) })
        ipc.on('pet:live-speech', (_e, data) => { if (data && data.speaking) handle.setTalkLevel(data.level || 0.6) })
        // 👀 v6.2 全屏注视：主进程每 100ms 推送鼠标位置（窗口外也能追踪）
        ipc.on('pet:cursor', (_e, c) => {
          if (!handle || !handle.setGaze || !c || !c.active) return
          const nx = (c.x / window.innerWidth - 0.5) * 2
          const ny = -(c.y / window.innerHeight - 0.5) * 2
          handle.setGaze(nx, ny)
        })
      }
    }
    function inBoundsCenter() { return !!bounds }

    document.addEventListener('DOMContentLoaded', boot)
    // file:// 下 DOMContentLoaded 有时早于内联脚本执行，兜底
    if (document.readyState !== 'loading') boot()
  })()
  </script>
</body>
</html>
