name: Test

on:
  push:
    branches: [main, master]
    paths-ignore:
      - '**.md'
      - '.github/**'
  pull_request:
    branches: [main, master]
  workflow_dispatch:  # 允许手动触发

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        node-version: [20, 22]

    runs-on: ${{ matrix.os }}

    defaults:
      run:
        shell: ${{ matrix.os == 'windows-latest' && 'pwsh' || 'bash' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Linux - install system deps (libappindicator for tray)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libappindicator1 libayatana-appindicator3-1 libgconf-2-4 libnss3 2>/dev/null || true

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit
        # 主类型检查为合入门禁：tsc 必须零错误（严格模式检查仍保留在 lint job 作为参考）

      - name: Run tests
        run: npx vitest run --reporter=verbose

      - name: Print platform capability matrix (CI log audit)
        # 单独跑矩阵打印用例，方便在各 runner 日志里核对 Computer Use / UIA / 截屏能力
        run: npx vitest run tests/platformMatrixLog.test.ts --reporter=verbose

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}-${{ matrix.node-version }}
          path: |
            test-results/
            *.xml
          retention-days: 7

  coverage:
    # 覆盖率门禁：只在 Linux + Node 22 跑一次，命中 vitest.config.ts 中的 thresholds。
    # 低于阈值（核心模块 70% 行/函数、55% 分支）即失败。
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Coverage gate
        run: npm run test:coverage

  lint:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]  # lint 只需跑一次，用 Linux 最快

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check (strict)
        run: npx tsc --noEmit --strict
        continue-on-error: true

      - name: ESLint check (flat config)
        run: npx eslint .
        # ESLint v9 flat config（eslint.config.js）；历史问题已降级 warn 渐进收敛，
        # 会真出 bug 的规则（prefer-const/no-var）保持 error，故 lint 应稳定 exit 0。

  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    runs-on: ${{ matrix.os }}
    needs: [test]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    defaults:
      run:
        shell: ${{ matrix.os == 'windows-latest' && 'pwsh' || 'bash' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Linux - install system deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libappindicator1 libayatana-appindicator3-1 libnss3 2>/dev/null || true

      - name: Install dependencies
        run: npm ci

      - name: Build Electron app
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output-${{ matrix.os }}
          path: out/
          retention-days: 7


  # release 已迁移到独立工作流 .github/workflows/release.yml
  # （三平台打包 + Windows/macOS 签名 + 公证，tag v* 或手动触发）
