name: Test

on:
  push:
    branches: [main, master]
    paths-ignore:
      - '**.md'
      - '.github/**'
  pull_request:
    branches: [main, master]
  workflow_dispatch:  # 允许手动触发

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        node-version: [20, 22]

    runs-on: ${{ matrix.os }}

    defaults:
      run:
        shell: ${{ matrix.os == 'windows-latest' && 'pwsh' || 'bash' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Linux - install system deps (libappindicator for tray)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libappindicator1 libayatana-appindicator3-1 libgconf-2-4 libnss3 2>/dev/null || true

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit
        # 主类型检查为合入门禁：tsc 必须零错误（严格模式检查仍保留在 lint job 作为参考）

      - name: Run tests
        run: npx vitest run --reporter=verbose

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}-${{ matrix.node-version }}
          path: |
            test-results/
            *.xml
          retention-days: 7

  coverage:
    # 覆盖率门禁：只在 Linux + Node 22 跑一次，命中 vitest.config.ts 中的 thresholds。
    # 低于阈值（核心模块 70% 行/函数、55% 分支）即失败。
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Coverage gate
        run: npm run test:coverage

  lint:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]  # lint 只需跑一次，用 Linux 最快

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check (strict)
        run: npx tsc --noEmit --strict
        continue-on-error: true

      - name: ESLint check
        run: npx eslint electron/ src/ tests/ --ext .ts,.tsx,.js,.jsx --max-warnings 50
        continue-on-error: true

  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    runs-on: ${{ matrix.os }}
    needs: [test]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    defaults:
      run:
        shell: ${{ matrix.os == 'windows-latest' && 'pwsh' || 'bash' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Linux - install system deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libappindicator1 libayatana-appindicator3-1 libnss3 2>/dev/null || true

      - name: Install dependencies
        run: npm ci

      - name: Build Electron app
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output-${{ matrix.os }}
          path: out/
          retention-days: 7

  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            build_script: pack:win
            artifact_glob: dist/*.exe
            artifact_name: Lumina-Life-Windows
          - os: macos-latest
            build_script: pack:mac
            artifact_glob: dist/*
            artifact_name: Lumina-Life-macOS
          - os: ubuntu-latest
            build_script: pack:linux
            artifact_glob: dist/*
            artifact_name: Lumina-Life-Linux

    runs-on: ${{ matrix.os }}
    needs: [test, build]
    # 推 v* tag 自动发布；也可在 Actions 页手动 Run workflow 产出三平台安装包（构建产物/草稿 Release）
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'

    defaults:
      run:
        shell: ${{ matrix.os == 'windows-latest' && 'pwsh' || 'bash' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Linux - install system deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libappindicator1 libayatana-appindicator3-1 libfuse2 libnss3 2>/dev/null || true

      - name: Windows - import code-signing certificate (if provided)
        if: matrix.os == 'windows-latest' && env.CSC_LINK != ''
        shell: pwsh
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
        run: |
          # WINDOWS_CSC_LINK：base64 编码的 PFX（openssl base64 -in cert.pfx -out cert.b64）。
          # 设置后 electron-builder 会用它做 Authenticode 签名；未设置则产出未签名安装包。
          echo "Certificate secret present, electron-builder will sign via CSC_LINK."
          if ($env:CSC_LINK) {
            $bytes = [Convert]::FromBase64String($env:CSC_LINK)
            [IO.File]::WriteAllBytes("cert.pfx", $bytes)
            echo "CSC_LINK=$((Resolve-Path cert.pfx).Path)" | Out-File -FilePath $env:GITHUB_ENV -Append
          }

      - name: macOS - install signing certs (if provided)
        if: matrix.os == 'macos-latest'
        shell: bash
        env:
          BUILD_CERT_BASE64: ${{ secrets.MAC_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.MAC_KEYCHAIN_PASSWORD }}
        run: |
          # 配置 MAC_CERTIFICATE_BASE64 + MAC_CERTIFICATE_PASSWORD 后导入 Developer ID 证书；
          # 再配置 APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID 即可自动公证。
          # 全部缺省时跳过签名（产出未签名 dmg，用户需右键打开）。
          if [ -z "$BUILD_CERT_BASE64" ]; then
            echo "No macOS certificate secret, building unsigned."
            echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> $GITHUB_ENV
          else
            echo "$BUILD_CERT_BASE64" | base64 --decode > certificate.p12
            security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
            security default-keychain -s build.keychain
            security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
            security import certificate.p12 -k build.keychain -P "$P12_PASSWORD" -T /usr/bin/codesign
            security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          fi

      - name: Install dependencies
        run: npm ci

      - name: Rebuild native modules for Electron
        run: npm run rebuild:electron
        continue-on-error: true

      - name: Build and package
        run: npm run ${{ matrix.build_script }}
        env:
          # Windows Authenticode（PFX 已在上方落盘时，electron-builder 自动读取）
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
          # macOS 公证（Developer ID 证书已导入时生效）
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.WINDOWS_CSC_LINK == '' && secrets.MAC_CERTIFICATE_BASE64 == '' && 'false' || 'true' }}

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            ${{ matrix.artifact_glob }}
            dist/*.yml
            dist/*.blockmap
          retention-days: 30

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.deb
            dist/*.yml
            dist/*.blockmap
          draft: true
          generate_release_notes: true
          body: |
            ## Lumina Life ${{ github.ref_name }}

            查看 [CHANGELOG.md](CHANGELOG.md) 了解完整变更。

            ### 📦 下载

            | 平台 | 安装包 |
            |---|---|
            | Windows | `*win-x64-setup.exe` (NSIS 安装包) |
            | macOS Intel | `*mac-x64.dmg` |
            | macOS Apple Silicon | `*mac-arm64.dmg` |
            | Linux | `*.AppImage` / `*.deb` |

            ### 安装说明

            **Windows**: 下载 `.exe` 双击安装。
            **macOS**: 下载 `.dmg` 拖入 Applications 文件夹。首次启动需右键 → 打开（绕过 Gatekeeper）。
            **Linux**: 下载 `.AppImage` → `chmod +x *.AppImage && ./Lumina*.AppImage`；或下载 `.deb` → `sudo dpkg -i *.deb`。
