name: Test

on:
  push:
    branches: [main, master]
    paths-ignore:
      - '**.md'
      - '.github/**'
  pull_request:
    branches: [main, master]
  workflow_dispatch:  # 允许手动触发

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        node-version: [20, 22]

    runs-on: ${{ matrix.os }}

    env:
      # 测试 job 以 Node 运行 vitest：保留 Node ABI 的原生模块
      # （postinstall 默认会把 better-sqlite3 对齐到 Electron ABI，见 scripts/electron-postinstall.cjs）
      LUMINA_NATIVE_ABI: node

    defaults:
      run:
        shell: ${{ matrix.os == 'windows-latest' && 'pwsh' || 'bash' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Linux - install system deps (libappindicator for tray)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libappindicator1 libayatana-appindicator3-1 libgconf-2-4 libnss3 2>/dev/null || true

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit
        # 主类型检查为合入门禁：tsc 必须零错误（严格模式检查仍保留在 lint job 作为参考）

      - name: Check circular dependencies (runtime, ratcheted)
        # 运行时循环依赖棘轮门禁：不得新增环（基线 scripts/circular-baseline.json）。
        # 口径与决策依据见 scripts/check-circular.cjs 文件头。
        run: npm run check:circular

      - name: Run tests
        run: npx vitest run --reporter=verbose

      - name: Print platform capability matrix (CI log audit)
        # 单独跑矩阵打印用例，方便在各 runner 日志里核对 Computer Use / UIA / 截屏能力
        run: npx vitest run tests/platformMatrixLog.test.ts --reporter=verbose

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}-${{ matrix.node-version }}
          path: |
            test-results/
            *.xml
          retention-days: 7

  bundle-requires:
    # 打包断链门禁 —— 2026-10-04 新增。
    #
    # 【为什么这道门必须存在】
    # 体检 out/main/index.js 时发现 68 条运行时相对 require 指向不存在的路径。
    # 根因：为断循环依赖而写的运行时 require，在 electron-vite 扁平化打包后必然失效
    #（模块已打进同一个文件，那个字符串路径却还在）。
    #
    # 这类故障**不会让构建失败，也不会让测试失败**：
    # dev 模式能解析 → 正常；单测跑源码 → 正常；只有用户拿到安装包才炸。
    # 已知实例：require('./agentConfig').getConfig() 双重错误（模块无此导出 + 路径不存在），
    # 被 catch 吞掉后「情绪门控」开关从未生效过，而 UI 上它是给用户看的。
    #
    # 策略是棘轮：已知的记进基线，新增的即失败。与 lint-ratchet 同一思路。
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build (produce out/main/index.js)
        run: npm run build

      - name: Bundle requires gate
        run: node scripts/bundle-requires-gate.cjs

  native-abi:
    # 原生模块 ABI 门禁 —— 2026-10-03 发布审计的真实事故。
    # better-sqlite3 的预编译包是为 Node 20 (ABI 143) 打的，而 Electron 40 需要 ABI 148。
    # 后果：vitest 全绿（测试跑在 Node 下），但**打包后启动时** SQLite 初始化失败，
    #       记忆系统的 ReMe/Scroll 分支静默降级 —— 属于「测试骗过了我们」的那类 bug。
    # 这个 job 在真实 Electron ABI 下加载原生模块，确保发布产物不会带病。
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Rebuild native modules for Electron ABI
        run: npm run rebuild:electron

      - name: Verify native module loads under Electron ABI
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # 用 Electron 的 Node 模式实际 require 一次，验证 ABI 一致
          $env:ELECTRON_RUN_AS_NODE = '1'
          & .\node_modules\electron\dist\electron.exe -e "const D=require('better-sqlite3'); const d=new D(':memory:'); d.exec('create table t(x)'); d.prepare('insert into t values (?)').run(42); if(d.prepare('select x from t').get().x!==42) throw new Error('bad'); console.log('ELECTRON_ABI_OK'); d.close();"
          if ($LASTEXITCODE -ne 0) { throw '原生模块在 Electron ABI 下加载失败 —— 记忆系统会在真机静默降级' }
          if (-not $?) { throw '原生模块探测失败' }

      - name: Native ABI unit test
        run: npx vitest run tests/nativeAbi.test.ts --reporter=verbose

  coverage:
    # 覆盖率门禁：只在 Linux + Node 22 跑一次，命中 vitest.config.ts 中的 thresholds。
    # 低于阈值（核心模块 70% 行/函数、55% 分支）即失败。
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Coverage gate
        run: npm run test:coverage

  lint:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]  # lint 只需跑一次，用 Linux 最快

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check (strict)
        run: npx tsc --noEmit --strict
        # v3.34: 移除 continue-on-error。
        # 之前这里是 `continue-on-error: true`，等于 README 里「tsc --strict 零
        # 错误」这句宣传在 CI 里根本没被执行 —— 任何人都能提交一堆 strict 报错
        # 而不被拦下。对一个准备开源、且 agentRunner.ts 已有 3196 行的项目，
        # 这个门禁形同虚设。外部 PR 若真的卡在 strict，门禁失败信息本身就是引导。

      - name: ESLint error gate
        run: npx eslint . --quiet
        # error 级规则只有 prefer-const / no-var / no-irregular-whitespace 等
        # 「会真出 bug」的几条，必须恒为 0。v3.34 修掉了其中 14 条 —— 包括
        # botRoute.ts 一处真 bug：`Number(req.slot) ?? 0`，Number 失败返回 NaN
        # 而非 null/undefined，这条回退分支永远不触发，NaN 槽位号会被一路传进
        # bot 的 select_slot，表现为「点了没反应」。

      - name: ESLint ratchet (warning 总量只允许变小)
        run: node scripts/lint-ratchet.cjs
        env:
          LINT_RATCHET_TOLERANCE: '25'
        # 仓库有约 5000 条历史 warning，一次性清零不现实（要改 5000 处）。
        # 与其把门禁关掉，不如做棘轮：基线记在 scripts/lint-baseline.json，
        # 新增的 warning 会让 CI 失败并打印出是哪些文件；修掉后跑
        # `npm run lint:ratchet:update` 收紧基线。
        #
        # 容忍 25 条跨平台波动：CI 跑 win/mac/linux × Node 20/22，行尾、
        # 路径解析、glob 行为都可能让某条规则的命中数差个位数。基线写死成
        # 精确值等于把 CI 变成「换台机器就可能红」的炸弹，而 lint 门禁的价值
        # 在于拦住**真新增**，不是拦住平台差异。
        #
        # ⚠️ 不要改回 `eslint . --max-warnings 0` —— 那会对着 5000 条历史
        # warning 直接把 CI 打红，门禁形同虚设。

  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    runs-on: ${{ matrix.os }}
    needs: [test]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    defaults:
      run:
        shell: ${{ matrix.os == 'windows-latest' && 'pwsh' || 'bash' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'npm'

      - name: Linux - install system deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libappindicator1 libayatana-appindicator3-1 libnss3 2>/dev/null || true

      - name: Install dependencies
        run: npm ci

      - name: Build Electron app
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output-${{ matrix.os }}
          path: out/
          retention-days: 7


  # release 已迁移到独立工作流 .github/workflows/release.yml
  # （三平台打包 + Windows/macOS 签名 + 公证，tag v* 或手动触发）

  # ── 打包产物守卫（2026-10-20 新增）────────────────────────────
  # 为什么单独一个 job：check-bundle-requires 必须跑在**真实构建产物**上，
  # 而 test job 跑的是源码（vitest），没有 out/。历史上正是因为这个缺口，
  # delegationManager 的坏 require 在 187 个测试全绿时把打包版团队功能打废。
  bundle:
    runs-on: ubuntu-latest
    env:
      LUMINA_NATIVE_ABI: node
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build (production)
        run: npm run build

      - name: Check bundled relative requires (ratcheted)
        run: npm run check:bundle-requires
