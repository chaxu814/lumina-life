name: Test

on:
  push:
    branches: [main, master]
    paths-ignore:
      - '**.md'
      - '.github/**'
  pull_request:
    branches: [main, master]
  workflow_dispatch:  # 允许手动触发

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        node-version: [18, 20, 22]

    runs-on: ${{ matrix.os }}

    defaults:
      run:
        shell: ${{ matrix.os == 'windows-latest' && 'pwsh' || 'bash' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Linux - install system deps (libappindicator for tray)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libappindicator1 libayatana-appindicator3-1 libgconf-2-4 libnss3 2>/dev/null || true

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit
        continue-on-error: true  # 类型检查作为参考，不阻断CI

      - name: Run tests
        run: npx vitest run --reporter=verbose

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}-${{ matrix.node-version }}
          path: |
            test-results/
            *.xml
          retention-days: 7

  lint:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]  # lint 只需跑一次，用 Linux 最快

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check (strict)
        run: npx tsc --noEmit --strict
        continue-on-error: true

      - name: ESLint check
        run: npx eslint electron/ src/ tests/ --ext .ts,.tsx,.js,.jsx --max-warnings 50
        continue-on-error: true

  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    runs-on: ${{ matrix.os }}
    needs: [test]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    defaults:
      run:
        shell: ${{ matrix.os == 'windows-latest' && 'pwsh' || 'bash' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Linux - install system deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libappindicator1 libayatana-appindicator3-1 libnss3 2>/dev/null || true

      - name: Install dependencies
        run: npm ci

      - name: Build Electron app
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output-${{ matrix.os }}
          path: out/
          retention-days: 7

  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            build_script: pack:win
            artifact_glob: dist/*.exe
            artifact_name: Lumina-Life-Windows
          - os: macos-latest
            build_script: pack:mac
            artifact_glob: dist/*
            artifact_name: Lumina-Life-macOS
          - os: ubuntu-latest
            build_script: pack:linux
            artifact_glob: dist/*
            artifact_name: Lumina-Life-Linux

    runs-on: ${{ matrix.os }}
    needs: [test, build]
    if: startsWith(github.ref, 'refs/tags/v')

    defaults:
      run:
        shell: ${{ matrix.os == 'windows-latest' && 'pwsh' || 'bash' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Linux - install system deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libappindicator1 libayatana-appindicator3-1 libfuse2 libnss3 2>/dev/null || true

      - name: macOS - install certs (placeholder, set APPLE_* secrets for signing)
        if: matrix.os == 'macos-latest'
        run: |
          # 如有 Apple Developer 证书，设置环境变量：
          #   APPLE_ID, APPLE_ID_PASSWORD, APPLE_TEAM_ID
          # electron-builder 会自动读取
          echo "macOS build - code signing will be skipped if no credentials"
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Install dependencies
        run: npm ci

      - name: Build and package
        run: npm run ${{ matrix.build_script }}

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_glob }}
          retention-days: 30

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.deb
          draft: true
          generate_release_notes: true
          body: |
            ## Lumina Life ${{ github.ref_name }}

            查看 [CHANGELOG.md](CHANGELOG.md) 了解完整变更。

            ### 📦 下载

            | 平台 | 安装包 |
            |---|---|
            | Windows | `*win-x64-setup.exe` (NSIS 安装包) |
            | macOS Intel | `*mac-x64.dmg` |
            | macOS Apple Silicon | `*mac-arm64.dmg` |
            | Linux | `*.AppImage` / `*.deb` |

            ### 安装说明

            **Windows**: 下载 `.exe` 双击安装。
            **macOS**: 下载 `.dmg` 拖入 Applications 文件夹。首次启动需右键 → 打开（绕过 Gatekeeper）。
            **Linux**: 下载 `.AppImage` → `chmod +x *.AppImage && ./Lumina*.AppImage`；或下载 `.deb` → `sudo dpkg -i *.deb`。
